name: V5 Release resume integration gate s-20261102-6ed41c9a

on:
  push:
    branches:
      - agent/s-20261102-6ed41c9a/optimization-001
    paths:
      - .github/workflows/v5-release-integration-6ed41c9a.yml
      - tavern_ai/release_resume_gate_6ed41c9a.py
      - tests/test_release_resume_gate_6ed41c9a.py
      - tests/test_train_release_workflow_6ed41c9a.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v5-release-integration-6ed41c9a
  cancel-in-progress: false

jobs:
  proof:
    if: github.repository == 'sstxww/reinforcement-learning' && github.ref == 'refs/heads/agent/s-20261102-6ed41c9a/optimization-001'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tests and validate Release-selector regression
        run: |
          python -m pip install -e '.[test]'
          python -m pytest tests/test_release_resume_gate_6ed41c9a.py tests/test_train_release_workflow_6ed41c9a.py -q
      - name: Install pinned TavernGym
        run: bash scripts/bootstrap_engine.sh
      - name: Execute genuine completed baseline-controlled eight-seat game
        run: |
          python -m tavern_ai.canary --agent-id s-20261102-6ed41c9a --seed 94311 \
            --policy baseline --receipt experiments/s-20261102-6ed41c9a/001-94311.json
          python -m tavern_ai.validate_receipt experiments/s-20261102-6ed41c9a/001-94311.json
      - name: Commit owned genuine receipt to session branch only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/s-20261102-6ed41c9a/001-94311.json
          git commit -m "Record s-20261102-6ed41c9a real eight-seat baseline integration receipt"
          git push origin "HEAD:refs/heads/agent/s-20261102-6ed41c9a/optimization-001"
