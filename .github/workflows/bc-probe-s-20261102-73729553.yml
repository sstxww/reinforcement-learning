name: BC public-action-family probe s-20261102-73729553
on:
  push:
    branches: ['agent/s-20261102-73729553/optimization-001']
    paths:
      - 'tavern_ai/bc_probe_73729553.py'
      - 'tests/test_bc_probe_73729553.py'
      - '.github/workflows/bc-probe-s-20261102-73729553.yml'
permissions:
  contents: write
concurrency:
  group: bc-probe-s-20261102-73729553
  cancel-in-progress: false
jobs:
  masked-bc-and-eight-seat-games:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python and validate deterministic unit tests
        run: |
          python -m pip install -e '.[test]'
          python -m pytest
      - name: Install exact pinned TavernGym
        run: |
          bash scripts/bootstrap_engine.sh
          python -m tavern_ai.contract
      - name: Train masked BC and play 12 actual full eight-player games
        run: |
          python -m tavern_ai.bc_probe_73729553 \
            --receipts-dir experiments/s-20261102-73729553 \
            --report-dir reports/s-20261102-73729553
          python -m tavern_ai.validate_receipt experiments/s-20261102-73729553/001-bc_category-67029.json
      - name: Commit only own real receipts and compact checkpoint
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = 'agent/s-20261102-73729553/optimization-001'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/s-20261102-73729553/ reports/s-20261102-73729553/
          if ! git diff --cached --quiet; then
            git commit -m 'results(s-20261102-73729553): actual masked BC full-game evidence'
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Keep 30-day private experiment artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bc-probe-s-20261102-73729553-${{ github.run_id }}
          path: |
            experiments/s-20261102-73729553/*.json
            reports/s-20261102-73729553/*.json
          if-no-files-found: ignore
          retention-days: 30
