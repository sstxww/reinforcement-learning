name: V7 read-only integration gate and own eight-seat evidence aadbbf93

on:
  push:
    branches:
      - 'agent/s-20261103-aadbbf93/optimization-001'
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: v7-review-s-20261103-aadbbf93
  cancel-in-progress: false

jobs:
  audit-and-genuine-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies and run V7 regression
        run: |
          python -m pip install -e '.[test]'
          python -m pytest tests/test_v7_merge_gate_aadbbf93.py
      - name: Bootstrap pinned genuine TavernGym
        run: bash scripts/bootstrap_engine.sh
      - name: Complete a real, unassisted eight-seat baseline game
        run: |
          python -m tavern_ai.contract
          python -m tavern_ai.canary --agent-id s-20261103-aadbbf93 --policy baseline --seed 99673 --receipt experiments/s-20261103-aadbbf93/001-99673.json
          python -m tavern_ai.validate_receipt experiments/s-20261103-aadbbf93/001-99673.json
      - name: Retain original independent match and regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v7-aadbbf93-actual-baseline-${{ github.run_id }}
          path: experiments/s-20261103-aadbbf93/*.json
          if-no-files-found: ignore
          retention-days: 30
