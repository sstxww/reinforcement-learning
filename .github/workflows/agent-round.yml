name: Agent round 1 - real-game receipts

on:
  push:
    branches:
      - 'agent/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: autotavern-game-${{ github.ref }}
  cancel-in-progress: false

jobs:
  record-real-match:
    if: github.repository == 'sstxww/reinforcement-learning'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Identify isolated research branch
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in
            agent/strategy/v1) AGENT=strategy; SEED=1101 ;;
            agent/learning/v1) AGENT=learning; SEED=1202 ;;
            agent/evaluation/v1) AGENT=evaluation; SEED=1303 ;;
            agent/infrastructure/v1) AGENT=infrastructure; SEED=1404 ;;
            *) echo "Not a registered V1 branch"; exit 2 ;;
          esac
          echo "agent=$AGENT" >> "$GITHUB_OUTPUT"
          echo "seed=$SEED" >> "$GITHUB_OUTPUT"
      - name: Install test dependencies
        run: |
          python -m pip install -e '.[test]'
          python -m pytest
      - name: Install and verify pinned real TavernGym
        run: bash scripts/bootstrap_engine.sh
      - name: Play and validate a complete eight-seat match
        shell: bash
        env:
          AGENT: ${{ steps.identity.outputs.agent }}
          SEED: ${{ steps.identity.outputs.seed }}
        run: |
          set -euo pipefail
          mkdir -p "experiments/$AGENT"
          RECEIPT="experiments/$AGENT/round1-full-match.json"
          if [[ -f "$RECEIPT" ]]; then
            python -m tavern_ai.validate_receipt "$RECEIPT"
            echo "Existing round-1 match receipt retained; PR CI independently reruns a match."
          else
            python -m tavern_ai.canary --agent-id "$AGENT" --seed "$SEED"               --policy baseline --receipt "$RECEIPT"
            python -m tavern_ai.validate_receipt "$RECEIPT"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- "$RECEIPT"
            git commit -m "test($AGENT): record real TavernGym full-match receipt"
            git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          fi
      - name: Keep independent execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-full-match-${{ github.run_id }}
          path: experiments/*/round1-full-match.json
          if-no-files-found: ignore
          retention-days: 30
