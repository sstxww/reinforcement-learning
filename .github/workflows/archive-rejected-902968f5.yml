name: Archive V5 rejected 1408-step model 902968f5

on:
  push:
    branches:
      - 'agent/s-20261102-902968f5/optimization-001'
    paths:
      - '.github/workflows/archive-rejected-902968f5.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: archive-rejected-902968f5
  cancel-in-progress: false

jobs:
  persist-rejected-weight:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v5-rejected-1408-902968f5
      EXPECTED: 503c527492d3a43ff2be9996c4865d2af8be55a981a5a0308b4dccb316598e8e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify authentic failed-model provenance
        run: |
          python - <<'PY'
          import json
          r=json.load(open('reports/s-20261102-902968f5/001-resume-audit.json'))
          assert r['status']=='resume_smoke_verified'
          assert r['initial_total_timesteps']==1280
          assert r['final_total_timesteps']==1408
          assert r['actual_added_steps']==128
          assert r['resumed_sha256']=='503c527492d3a43ff2be9996c4865d2af8be55a981a5a0308b4dccb316598e8e'
          print('Source audit and 128 real resumed steps verified')
          PY
      - name: Recover model artifact from exact original Actions ID
        run: |
          mkdir -p restored
          gh run download 41427679320 --repo sstxww/reinforcement-learning \
            --name release-resume-diagnostic-902968f5-41427679320 --dir restored
          test -f restored/checkpoints/resumed-902968f5/model.zip
          test -f restored/checkpoints/resumed-902968f5/model.metadata.json
          printf '%s  %s\n' "$EXPECTED" restored/checkpoints/resumed-902968f5/model.zip | sha256sum -c -
          python - <<'PY'
          import json, hashlib
          from pathlib import Path
          p=Path('restored/checkpoints/resumed-902968f5')
          m=json.loads((p/'model.metadata.json').read_text())
          assert m['schema']==2
          assert m['total_timesteps']==1408
          assert m['parent_checkpoint_sha256']=='73bde2666426cecce39f135980a897bb2cd4a7d70783ba04c9c0d29477a6664a'
          assert hashlib.sha256((p/'model.zip').read_bytes()).hexdigest()==m['checkpoint_sha256']
          print('Recovered optimizer/metadata lineage SHA256 consistent')
          PY
      - name: Publish immutable clearly REJECTED diagnostic Release
        run: |
          if gh release view "$TAG" --repo sstxww/reinforcement-learning >/dev/null 2>&1; then
            echo 'Release already exists; no overwrite authorized'
            exit 2
          fi
          gh release create "$TAG" \
            --repo sstxww/reinforcement-learning \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title 'REJECTED: V5 1408-step PPO model, full-game safety limit' \
            --notes-file research/sessions/s-20261102-902968f5/failures/001-unfinished-model-game.md \
            restored/checkpoints/resumed-902968f5/model.zip \
            restored/checkpoints/resumed-902968f5/model.metadata.json \
            reports/s-20261102-902968f5/001-resume-audit.json \
            experiments/s-20261102-902968f5/001-baseline-927103.json
      - name: Independently re-download Release, validate hashes, load optimizer and infer
        run: |
          python -m pip install -e '.[train,test]'
          bash scripts/bootstrap_engine.sh
          mkdir -p redownload
          gh release download "$TAG" --repo sstxww/reinforcement-learning \
            --dir redownload --pattern model.zip --pattern model.metadata.json
          printf '%s  %s\n' "$EXPECTED" redownload/model.zip | sha256sum -c -
          python - <<'PY'
          import json, hashlib
          from pathlib import Path
          import numpy as np
          from sb3_contrib import MaskablePPO
          from tavern_ai.contract import verify_engine
          from tavern_ai.env import TavernEnv
          model=Path('redownload/model.zip')
          meta=json.loads(Path('redownload/model.metadata.json').read_text())
          assert hashlib.sha256(model.read_bytes()).hexdigest()==meta['checkpoint_sha256']
          assert verify_engine()==meta['engine']
          env=TavernEnv(seed=927105)
          try:
            p=MaskablePPO.load(str(model), env=env, device='cpu')
            assert p.num_timesteps==1408
            obs,_=env.reset(seed=927105)
            mask=env.action_masks()
            action,_=p.predict(obs, action_masks=mask, deterministic=True)
            assert mask[int(action)]
            assert p.policy.optimizer is not None
            print('REJECTED Release separately download/hash/load/optimizer/inference verified; NOT Champion')
          finally:
            env.close()
          PY
