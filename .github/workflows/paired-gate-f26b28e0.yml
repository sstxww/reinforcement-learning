name: V5 isolated paired receipt audit f26b28e0
on:
  push:
    branches:
      - agent/s-20261102-f26b28e0/optimization-001
    paths:
      - .github/workflows/paired-gate-f26b28e0.yml
      - tavern_ai/paired_receipt_gate_f26b28e0.py
      - tests/test_paired_receipt_gate_f26b28e0.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paired-gate-f26b28e0
  cancel-in-progress: false

jobs:
  paired-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Isolated stdlib receipt-gate regression tests
        run: |
          python -m pip install -e '.[test]'
          python -m pytest -q tests/test_paired_receipt_gate_f26b28e0.py
      - name: Audit three genuinely paired full eight-seat matches from main history
        run: |
          python -m tavern_ai.paired_receipt_gate_f26b28e0 \
            --model experiments/s-20261102-68099929/002-model-99125.json \
                    experiments/s-20261102-68099929/002-model-99126.json \
                    experiments/s-20261102-68099929/002-model-99127.json \
            --baseline experiments/s-20261102-68099929/002-baseline-99125.json \
                       experiments/s-20261102-68099929/002-baseline-99126.json \
                       experiments/s-20261102-68099929/002-baseline-99127.json \
            --registry models/registry.json --out outputs/paired-1408.json
      - name: Install pinned real TavernGym engine
        run: bash scripts/bootstrap_engine.sh
      - name: This session plays one real full eight-seat baseline game
        run: |
          python -m tavern_ai.canary --agent-id s-20261102-f26b28e0 \
            --seed 65241 --policy baseline \
            --receipt outputs/001-65241.json
          python -m tavern_ai.validate_receipt outputs/001-65241.json
      - name: Preserve true receipts and descriptive paired summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-audit-f26b28e0-${{ github.run_id }}
          path: outputs/*.json
          if-no-files-found: ignore
          retention-days: 30
