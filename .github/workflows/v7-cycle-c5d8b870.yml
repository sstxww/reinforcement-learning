name: V7 c5d8b870 raw Play-Cancel state-cycle evidence
on:
  push:
    branches:
      - agent/s-20261103-c5d8b870/optimization-001
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v7-s-20261103-c5d8b870-cycle-r001
  cancel-in-progress: false

jobs:
  bounded-cycle-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned project training and test requirements
        run: python -m pip install -e '.[train,test]'
      - name: Reject false public-state returns in synthetic tests
        run: python -m pytest -q tests/test_play_cancel_cycle_c5d8b870.py
      - name: Install pinned TavernGym 1.1.0
        run: bash scripts/bootstrap_engine.sh
      - name: Verify engine layout
        run: python -m tavern_ai.contract
      - name: Download and verify durable unpromoted 1408-step source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python -m tavern_ai.release_restore_entry --model-id v5-s-20261102-68099929-1408-41428692617 --out-dir checkpoints
          echo 'a73d24c68d238396136c9857ec4f341f39afc6562139ce9b693d282019db2632  checkpoints/model.zip' | sha256sum -c -
      - name: Genuine eight-seat baseline canary (NOT a PPO result)
        run: |
          python -m tavern_ai.canary --agent-id s-20261103-c5d8b870 --policy baseline --seed 99831 --receipt outputs/s-20261103-c5d8b870-001-baseline.json
          python -m tavern_ai.validate_receipt outputs/s-20261103-c5d8b870-001-baseline.json
      - name: Raw unassisted PPO public-state probe at same seed and fixed budget
        run: |
          python -m tavern_ai.play_cancel_cycle_c5d8b870 --model checkpoints/model.zip --seed 99831 --max-model-decisions 384 --out reports/s-20261103-c5d8b870/001-raw-cycle-99831.json
      - name: Preserve original model diagnostic and baseline receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v7-c5d8b870-real-evidence-${{ github.run_id }}
          path: |
            outputs/s-20261103-c5d8b870-001-baseline.json
            reports/s-20261103-c5d8b870/001-raw-cycle-99831.json
          if-no-files-found: ignore
          retention-days: 30
