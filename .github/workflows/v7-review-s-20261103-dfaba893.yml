name: V7 PR175 rollback review + genuine baseline - s-20261103-dfaba893
on:
  push:
    branches:
      - agent/s-20261103-dfaba893/optimization-001
    paths:
      - .github/workflows/v7-review-s-20261103-dfaba893.yml
      - reports/s-20261103-dfaba893/rollback-toctou-reproducer.py
permissions:
  contents: read
concurrency:
  group: v7-pr175-rollback-review-s-20261103-dfaba893
  cancel-in-progress: false
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independently reproduce synthetic rollback interleaving
        run: |
          mkdir -p outputs
          python reports/s-20261103-dfaba893/rollback-toctou-reproducer.py | tee outputs/rollback-toctou-synthetic.json
      - name: Install test dependencies
        run: python -m pip install -e '.[test]'
      - name: Pinned TavernGym bootstrap and contract
        run: |
          bash scripts/bootstrap_engine.sh
          python -m tavern_ai.contract
      - name: Complete genuine eight-seat baseline (no PPO policy)
        run: |
          python -m tavern_ai.canary --agent-id s-20261103-dfaba893 \
            --seed 994277 --policy baseline --receipt outputs/001-994277.json
          python -m tavern_ai.validate_receipt outputs/001-994277.json
          sha256sum outputs/001-994277.json > outputs/001-994277.sha256
      - name: Archive original evidence (expiring, not a model Release)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v7-pr175-review-s-20261103-dfaba893-${{ github.run_id }}
          path: outputs/*
          if-no-files-found: ignore
          retention-days: 30
