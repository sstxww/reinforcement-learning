name: Mechanics probe R001 s-20261102-0ecd90f7

on:
  push:
    branches:
      - agent/s-20261102-0ecd90f7/optimization-001
    paths:
      - .github/workflows/experiment-s-20261102-0ecd90f7.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mechanics-s-20261102-0ecd90f7-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bounded-mechanism-study:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded test dependencies
        run: |
          python -m pip install -e '.[test]'
      - name: Unit mechanism tests
        run: |
          python -m pytest tests/test_mechanics_probe_0ecd90f7.py
          python -m pytest
      - name: Install pinned real TavernGym engine with verified patch
        run: bash scripts/bootstrap_engine.sh
      - name: Verify public observation contract
        run: python -m tavern_ai.contract
      - name: Train real public-state mechanism probe and finish five eight-seat games
        run: |
          python -m tavern_ai.mechanics_probe_0ecd90f7 \
            --receipt-dir experiments/s-20261102-0ecd90f7 \
            --report-dir reports/s-20261102-0ecd90f7
      - name: Validate all five real complete-match receipts
        run: |
          for f in experiments/s-20261102-0ecd90f7/*.json; do
            python -m tavern_ai.validate_receipt "$f"
          done
      - name: Persist genuine evidence only to this session branch
        run: |
          test "$(git branch --show-current)" = "agent/s-20261102-0ecd90f7/optimization-001"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/s-20261102-0ecd90f7/ \
            reports/s-20261102-0ecd90f7/ \
            research/sessions/s-20261102-0ecd90f7/ \
            research/knowledge/proposals/s-20261102-0ecd90f7-001.md
          if ! git diff --cached --quiet; then
            git commit -m "results(s-20261102-0ecd90f7): persist actual trained mechanics probe and match receipts"
            git push origin HEAD:refs/heads/agent/s-20261102-0ecd90f7/optimization-001
          fi
      - name: Preserve secondary bounded artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mechanics-s-20261102-0ecd90f7-${{ github.run_id }}
          path: |
            reports/s-20261102-0ecd90f7/
            experiments/s-20261102-0ecd90f7/
          if-no-files-found: ignore
          retention-days: 30
