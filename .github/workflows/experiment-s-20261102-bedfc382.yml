name: Session s-20261102-bedfc382 - bounded reward experiment

on:
  push:
    branches:
      - agent/s-20261102-bedfc382/optimization-001
    paths:
      - .github/workflows/experiment-s-20261102-bedfc382.yml
      - tavern_ai/potential_reward.py
      - tavern_ai/reward_experiment.py
      - tests/test_session_reward.py

permissions:
  contents: write

concurrency:
  group: session-s-20261102-bedfc382
  cancel-in-progress: false

jobs:
  isolated-reward-test:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[train,test]'
      - name: Reward and action-mask unit tests
        run: python -m pytest tests/test_session_reward.py
      - name: Install verified TavernGym source and patch
        run: bash scripts/bootstrap_engine.sh
      - name: Check pinned simulator dimensions and hash
        run: python -m tavern_ai.contract
      - name: Train two 256-step PPO arms and play six complete eight-seat matches
        timeout-minutes: 55
        run: |
          python -m tavern_ai.reward_experiment --steps 256 \
            --train-seed 22042 --out outputs/reward
      - name: Verify each personally run full-game receipt
        run: |
          for seed in 31011 31012 31013; do
            python -m tavern_ai.validate_receipt \
              "experiments/s-20261102-bedfc382/001-${seed}.json"
          done
          python scripts/check_pr_evidence.py
        env:
          GITHUB_HEAD_REF: agent/s-20261102-bedfc382/optimization-001
      - name: Commit only this session's real evidence on its own branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/s-20261102-bedfc382/ research/sessions/s-20261102-bedfc382/metrics-001.json
          git commit -m "experiment(s-20261102-bedfc382): record genuine shaped-policy games and paired metrics"
          git push origin HEAD:refs/heads/agent/s-20261102-bedfc382/optimization-001
      - name: Preserve temporary model checkpoints and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s-20261102-bedfc382-models-${{ github.run_id }}
          path: |
            outputs/reward/*.zip
            research/sessions/s-20261102-bedfc382/metrics-001.json
            experiments/s-20261102-bedfc382/*.json
          retention-days: 30
          if-no-files-found: ignore
