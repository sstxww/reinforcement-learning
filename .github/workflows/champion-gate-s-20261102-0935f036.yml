name: V5 isolated champion-evidence gate s-20261102-0935f036

on:
  push:
    branches:
      - 'agent/s-20261102-0935f036/optimization-001'

permissions:
  contents: read

concurrency:
  group: 's-20261102-0935f036-isolated-evidence'
  cancel-in-progress: false

jobs:
  model-gate-and-real-game:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -e '.[test]'
      - name: Regression tests (synthetic registry examples)
        run: python -m pytest tests/test_model_registry.py tests/test_champion_gate_s_20261102_0935f036.py
      - name: Install pinned real TavernGym engine
        run: bash scripts/bootstrap_engine.sh
      - name: Real eight-seat baseline match, not a PPO strength test
        run: |
          python -m tavern_ai.contract
          python -m tavern_ai.canary --agent-id 's-20261102-0935f036' --seed 831202 --policy baseline --receipt 'outputs/s-20261102-0935f036-831202.json'
          python -m tavern_ai.validate_receipt 'outputs/s-20261102-0935f036-831202.json'
      - name: Save actual match receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 's-20261102-0935f036-real-game-${{ github.run_id }}'
          path: 'outputs/*.json'
          if-no-files-found: ignore
          retention-days: 30
