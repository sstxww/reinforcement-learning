name: V5 registry integrity and real-game gate s-20261102-490e3c78
on:
  push:
    branches:
      - agent/s-20261102-490e3c78/optimization-001
    paths:
      - 'models/registry.json'
      - 'tavern_ai/model_registry.py'
      - 'tests/test_model_registry.py'
      - '.github/workflows/v5-registry-s-20261102-490e3c78.yml'
permissions:
  contents: write
concurrency:
  group: v5-registry-s-20261102-490e3c78
  cancel-in-progress: false
jobs:
  validate-and-match:
    if: github.ref == 'refs/heads/agent/s-20261102-490e3c78/optimization-001'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install unit test dependencies
        run: python -m pip install -e '.[test]'
      - name: Verify registry and fail-closed recovery preflight tests
        run: |
          python -m pytest -q tests/test_model_registry.py
          python -m tavern_ai.model_registry --registry models/registry.json
      - name: Bootstrap exact pinned TavernGym engine
        run: |
          bash scripts/bootstrap_engine.sh
          python -m tavern_ai.contract
      - name: Run own genuine full eight-seat baseline match
        run: |
          mkdir -p experiments/s-20261102-490e3c78
          python -m tavern_ai.canary --agent-id s-20261102-490e3c78 --seed 59001 --policy baseline --receipt experiments/s-20261102-490e3c78/001-59001.json
          python -m tavern_ai.validate_receipt experiments/s-20261102-490e3c78/001-59001.json
          python -m pytest -q
      - name: Commit only new actual match evidence in owned namespace
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "agent/s-20261102-490e3c78/optimization-001"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/s-20261102-490e3c78/001-59001.json
          git diff --cached --quiet && exit 0
          git commit -m "results(s-20261102-490e3c78): preserve true eight-seat integration canary"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Preserve evidence in isolated artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-registry-s-20261102-490e3c78-${{ github.run_id }}
          path: experiments/s-20261102-490e3c78/*.json
          if-no-files-found: ignore
          retention-days: 30
