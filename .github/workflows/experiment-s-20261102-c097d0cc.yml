name: Placement probe s-20261102-c097d0cc

on:
  push:
    branches:
      - 'agent/s-20261102-c097d0cc/optimization-001'

permissions:
  contents: write

concurrency:
  group: 'placement-probe-s-20261102-c097d0cc'
  cancel-in-progress: false

jobs:
  paired-full-game:
    if: github.ref == 'refs/heads/agent/s-20261102-c097d0cc/optimization-001'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install -e '.[test]'
      - name: Test isolated placement heuristic
        run: python -m pytest
      - name: Bootstrap actual pinned TavernGym engine
        run: bash scripts/bootstrap_engine.sh
      - name: Verify patched engine and observe2 contract
        run: python -m tavern_ai.contract
      - name: Paired full eight-seat simulations (no early stopping)
        run: |
          timeout 25m python -m tavern_ai.placement_probe \
            --agent-id s-20261102-c097d0cc --seed-start 31001 --games 4
          for receipt in experiments/s-20261102-c097d0cc/001-*.json; do
            python -m tavern_ai.validate_receipt "$receipt"
          done
      - name: Preserve independently generated session results on ONLY this branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'agent/s-20261102-c097d0cc/optimization-001'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- experiments/s-20261102-c097d0cc/ research/sessions/s-20261102-c097d0cc/ research/knowledge/proposals/s-20261102-c097d0cc-001.md
          git diff --cached --quiet && exit 0
          git commit -m 'experiment(placement): save verified seeded matches and research evidence'
          git push origin "HEAD:refs/heads/agent/s-20261102-c097d0cc/optimization-001"
      - name: Upload session-specific receipts as fallback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 'placement-s-20261102-c097d0cc-${{ github.run_id }}'
          path: |
            experiments/s-20261102-c097d0cc/
            research/sessions/s-20261102-c097d0cc/
            research/knowledge/proposals/s-20261102-c097d0cc-001.md
          if-no-files-found: ignore
          retention-days: 45
