name: Experiment s-20261102-7f4c9a62 entropy PPO

on:
  push:
    branches:
      - 'agent/s-20261102-7f4c9a62/optimization-001'
    paths:
      - '.github/workflows/experiment-s-20261102-7f4c9a62.yml'
      - 'tavern_ai/entropy_probe.py'
      - 'tests/test_entropy_probe.py'

permissions:
  contents: read

concurrency:
  group: entropy-s-20261102-7f4c9a62
  cancel-in-progress: false

jobs:
  real-training-and-games:
    if: github.ref == 'refs/heads/agent/s-20261102-7f4c9a62/optimization-001'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install train and test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[train,test]'
      - name: Run tests
        run: python -m pytest
      - name: Install real TavernGym 1.1.0 engine
        run: bash scripts/bootstrap_engine.sh
      - name: Independent bounded PPO training and complete eight-seat games
        env:
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: |
          python -m tavern_ai.entropy_probe \
            --session-id s-20261102-7f4c9a62 \
            --steps 128 --train-seed 70141 --start-seed 31041 --games 2 \
            --base-sha 6ac59235b8238196a0e6462de77b72413c829372
          python -m tavern_ai.validate_receipt \
            experiments/s-20261102-7f4c9a62/001-31041.json
      - name: Preserve isolated checkpoints and receipts
        uses: actions/upload-artifact@v4
        with:
          name: entropy-s-20261102-7f4c9a62-${{ github.run_id }}
          path: |
            checkpoints/s-20261102-7f4c9a62/
            experiments/s-20261102-7f4c9a62/
            reports/s-20261102-7f4c9a62/
          if-no-files-found: error
          retention-days: 30
      - name: Commit only this session receipts to own branch
        env:
          TARGET_BRANCH: agent/s-20261102-7f4c9a62/optimization-001
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/s-20261102-7f4c9a62 reports/s-20261102-7f4c9a62
          if ! git diff --cached --quiet; then
            git commit -m 'experiment: preserve real entropy-PPO match receipts'
            git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          fi
