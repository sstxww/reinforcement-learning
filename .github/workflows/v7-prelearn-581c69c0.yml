name: V7 schema-2 prelearn gate s-20261103-581c69c0

on:
  push:
    branches:
      - agent/s-20261103-581c69c0/optimization-001
    paths:
      - .github/workflows/v7-prelearn-581c69c0.yml

permissions:
  contents: read

concurrency:
  group: v7-prelearn-s-20261103-581c69c0-r001
  cancel-in-progress: false

jobs:
  regression-and-genuine-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -e '.[test]'
      - name: Verify focused precompute regressions
        run: python -m pytest -q tests/test_train_prelearn_s_20261103_581c69c0.py tests/test_train_schema2_resume_db1986b8.py
      - name: Verify pinned TavernGym engine
        run: bash scripts/bootstrap_engine.sh
      - name: Verify pinned contract
        run: python -m tavern_ai.contract
      - name: OWN authentic complete eight-seat baseline match
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python -m tavern_ai.canary --agent-id s-20261103-581c69c0 \
            --policy baseline --seed 97831 \
            --receipt artifacts/001-baseline-97831.json
          python -m tavern_ai.validate_receipt artifacts/001-baseline-97831.json
          echo 'V7_BASELINE_RECEIPT_BEGIN'
          cat artifacts/001-baseline-97831.json
          echo
          echo 'V7_BASELINE_RECEIPT_END'
      - name: Preserve original receipt as expiring Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v7-s-20261103-581c69c0-r001-baseline
          path: artifacts/001-baseline-97831.json
          if-no-files-found: ignore
          retention-days: 30

  bounded-unpromoted-resume:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install training dependencies
        run: python -m pip install -e '.[train,test]'
      - name: Verify pinned TavernGym engine
        run: bash scripts/bootstrap_engine.sh
      - name: Restore canonical registered unpromoted Release, fail closed
        run: |
          set -euo pipefail
          python -m tavern_ai.release_restore_entry --model-id latest --out-dir checkpoints
          python -m tavern_ai.contract
      - name: Actual bounded 128-step MaskablePPO continuation, no fresh start
        shell: bash
        run: |
          set -euo pipefail
          python -m tavern_ai.train --steps 128 --seed 93471 \
            --resume checkpoints/model.zip --out checkpoints/candidate.zip
          python - <<'PY'
          import json
          from pathlib import Path
          source=json.loads(Path("checkpoints/model.metadata.json").read_text())
          child=json.loads(Path("checkpoints/candidate.metadata.json").read_text())
          assert child["total_timesteps"] > source["total_timesteps"], (source, child)
          assert child["parent_checkpoint_sha256"], child
          assert child["schema"] == source["schema"], (source, child)
          print("V7_RESUME_LINEAGE",json.dumps({
              "source_steps": source["total_timesteps"],
              "child_steps": child["total_timesteps"],
              "child_schema": child["schema"],
              "parent_sha256": child["parent_checkpoint_sha256"]
          },sort_keys=True))
          PY
          sha256sum checkpoints/candidate.zip checkpoints/candidate.metadata.json | tee checkpoints/candidate.sha256
      - name: Bounded original raw candidate game; incomplete is not rank eight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          set +e
          timeout 600s python -m tavern_ai.canary --agent-id s-20261103-581c69c0 \
            --seed 97832 --policy model --model checkpoints/candidate.zip \
            --receipt artifacts/001-raw-model-97832.json
          rc=$?
          set -e
          echo "RAW_MODEL_EXIT_CODE=$rc" | tee artifacts/raw-model-status.txt
          if (( rc == 0 )); then
            python -m tavern_ai.validate_receipt artifacts/001-raw-model-97832.json
            echo 'V7_RAW_MODEL_RECEIPT_BEGIN'
            cat artifacts/001-raw-model-97832.json
            echo
            echo 'V7_RAW_MODEL_RECEIPT_END'
          else
            echo "No completed model receipt; no model placement or promotion claim." | tee -a artifacts/raw-model-status.txt
          fi
      - name: Preserve bounded candidate as TEMPORARY Artifact only (no Release/Champion)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v7-s-20261103-581c69c0-r001-unpromoted-resume
          path: |
            checkpoints/candidate.zip
            checkpoints/candidate.metadata.json
            checkpoints/candidate.sha256
            artifacts/001-raw-model-97832.json
            artifacts/raw-model-status.txt
          if-no-files-found: ignore
          retention-days: 30
