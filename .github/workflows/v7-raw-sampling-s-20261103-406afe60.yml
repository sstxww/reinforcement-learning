name: V7 bounded raw PPO argmax versus masked-sampling s-20261103-406afe60

# One-shot branch workflow; no scheduled runs, no pushes, no model promotion.
on:
  push:
    branches:
      - agent/s-20261103-406afe60/optimization-001
    paths:
      - .github/workflows/v7-raw-sampling-s-20261103-406afe60.yml

permissions:
  contents: read

concurrency:
  group: v7-raw-sampling-s-20261103-406afe60
  cancel-in-progress: false

jobs:
  source-verified-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded test and PPO inference dependencies
        run: |
          python -m pip install -e '.[train,test]'
          python -m pytest -q tests/test_raw_sampling_probe_s406afe60.py
      - name: Install pinned TavernGym and verify engine
        run: |
          bash scripts/bootstrap_engine.sh
          python -m tavern_ai.contract
      - name: Restore official unpromoted Release with SHA-bound preflight
        run: |
          python -m tavern_ai.release_restore_entry --model-id latest --out-dir checkpoints
          sha256sum checkpoints/model.zip
          cat checkpoints/model.metadata.json
      - name: Original baseline completes an actual eight-seat match
        run: |
          mkdir -p experiments/s-20261103-406afe60
          python -m tavern_ai.buy_opportunity_68099929 --agent-id s-20261103-406afe60 --seed 99831 --policy baseline --out experiments/s-20261103-406afe60/001-baseline-99831.json
          python -m tavern_ai.validate_receipt experiments/s-20261103-406afe60/001-baseline-99831.json
      - name: Unassisted deterministic original PPO completes an eight-seat match
        run: |
          python -m tavern_ai.raw_sampling_probe_s406afe60 --model checkpoints/model.zip --seed 99831 --agent-id s-20261103-406afe60 --mode argmax --out experiments/s-20261103-406afe60/002-argmax-99831.json
          python -m tavern_ai.validate_receipt experiments/s-20261103-406afe60/002-argmax-99831.json
      - name: Unassisted stochastic original PPO on same seed and seat
        run: |
          python -m tavern_ai.raw_sampling_probe_s406afe60 --model checkpoints/model.zip --seed 99831 --agent-id s-20261103-406afe60 --mode sampled --out experiments/s-20261103-406afe60/003-sampled-99831.json
          python -m tavern_ai.validate_receipt experiments/s-20261103-406afe60/003-sampled-99831.json
      - name: Preserve original receipt files, even if a model game fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v7-s406afe60-${{ github.run_id }}
          path: |
            experiments/s-20261103-406afe60/*.json
            checkpoints/model.metadata.json
          if-no-files-found: ignore
          retention-days: 14
