name: "V7 merge authority read-only audit s-20261103-9fb48c19"

on:
  push:
    branches:
      - "agent/s-20261103-9fb48c19/optimization-001"
    paths:
      - ".github/workflows/v7-merge-audit-s-20261103-9fb48c19.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "v7-merge-audit-s-20261103-9fb48c19"
  cancel-in-progress: false

jobs:
  read-only-audit-and-real-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project and scoped audit regressions
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
          python -m pytest -q tests/test_v7_merge_authority_audit_s_20261103_9fb48c19.py
      - name: Read live PR merge authority but NEVER execute merge
        shell: bash
        run: |
          set +e
          python scripts/v7_merge_authority_audit_s_20261103_9fb48c19.py --pr 175 | tee v7-merge-audit.json
          code=${PIPESTATUS[0]}
          set -e
          # This is a fail-closed audit: exit 2 is mandatory, never success-authority.
          test "$code" -eq 2
          python - <<'PY'
          import json
          data=json.load(open("v7-merge-audit.json"))
          assert data["merge_authorized"] is False
          PY
      - name: Install pinned TavernGym and verify exact contract
        run: |
          bash scripts/bootstrap_engine.sh
          python -m tavern_ai.contract
      - name: Genuine complete eight-seat baseline match (not raw PPO)
        run: |
          mkdir -p experiments/s-20261103-9fb48c19
          python -m tavern_ai.canary --agent-id s-20261103-9fb48c19 \
            --seed 99731 --policy baseline \
            --receipt experiments/s-20261103-9fb48c19/001-99731.json
          python -m tavern_ai.validate_receipt experiments/s-20261103-9fb48c19/001-99731.json
          sha256sum experiments/s-20261103-9fb48c19/001-99731.json
      - name: Commit only own authentic full-match receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/s-20261103-9fb48c19/001-99731.json
          if ! git diff --cached --quiet; then
            git commit -m "test(v7): preserve real independent eight-seat baseline receipt seed 99731"
            BRANCH="agent/s-20261103-9fb48c19/optimization-001"
            # Other V7 writers may append our own STATUS/proposal before this job
            # reaches its push. Rebase only this session's receipt on the current
            # remote head; never force-push or touch another session's ref.
            published=0
            for attempt in 1 2 3; do
              git fetch origin "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
              git rebase "refs/remotes/origin/$BRANCH"
              if git push origin "HEAD:refs/heads/$BRANCH"; then
                published=1
                break
              fi
            done
            test "$published" -eq 1
          fi
      - name: Archive non-secret read-only audit and genuine receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "v7-merge-authority-s-20261103-9fb48c19-${{ github.run_id }}"
          path: |
            v7-merge-audit.json
            experiments/s-20261103-9fb48c19/001-99731.json
          if-no-files-found: ignore
          retention-days: 30
