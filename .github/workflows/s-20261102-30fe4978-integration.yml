name: V5 paired receipt gate - s-20261102-30fe4978

on:
  push:
    branches:
      - agent/s-20261102-30fe4978/optimization-001

permissions:
  contents: read

concurrency:
  group: v5-receipt-30fe4978-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test requirements
        run: python -m pip install -e '.[test]'
      - name: Run paired receipt gate regressions
        run: python -m pytest tests/test_paired_receipt_gate_30fe4978.py -q
      - name: Audit real existing unguarded V5 paired receipts (three seeds)
        run: |
          python -m tavern_ai.paired_receipt_gate_30fe4978 \
            --candidate experiments/s-20261102-68099929/002-model-99125.json experiments/s-20261102-68099929/002-model-99126.json experiments/s-20261102-68099929/002-model-99127.json \
            --baseline experiments/s-20261102-68099929/002-baseline-99125.json experiments/s-20261102-68099929/002-baseline-99126.json experiments/s-20261102-68099929/002-baseline-99127.json \
            --out outputs/paired-evidence.json
      - name: Install pinned TavernGym
        run: bash scripts/bootstrap_engine.sh
      - name: Run independent real eight-seat baseline canary
        run: |
          python -m tavern_ai.canary --agent-id s-20261102-30fe4978 --seed 39711 \
            --policy baseline --receipt outputs/own-real-game-39711.json
          python -m tavern_ai.validate_receipt outputs/own-real-game-39711.json
      - name: Preserve actual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s-20261102-30fe4978-evidence
          path: outputs/*.json
          if-no-files-found: ignore
          retention-days: 30
