name: V5 paired-evidence read-only regression s-20261102-6fc22e71

on:
  push:
    branches:
      - agent/s-20261102-6fc22e71/optimization-001
    paths:
      - .github/workflows/paired-evidence-s-20261102-6fc22e71.yml

permissions:
  contents: read

concurrency:
  group: v5-paired-evidence-s-20261102-6fc22e71
  cancel-in-progress: false

jobs:
  validate-existing-real-game-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded test requirements
        run: python -m pip install -e '.[test]'
      - name: Test exact input and paired-evaluation evidence gate
        run: python -m pytest tests/test_paired_evidence_s_6fc22e71.py
      - name: Install pinned TavernGym simulator
        run: bash scripts/bootstrap_engine.sh
      - name: Validate original real eight-seat game evidence without replaying or rewriting
        run: |
          python -m tavern_ai.contract
          python -m tavern_ai.validate_receipt experiments/s-20261102-6fc22e71/001-93461.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("experiments/s-20261102-6fc22e71/001-93461.json").read_text(encoding="utf-8"))
          assert p["seed"] == 93461 and p["agent_id"] == "s-20261102-6fc22e71"
          assert p["git_sha"] == "0282bced0522c3b931d7933c57e4c6380f03bb39"
          assert p["policy"] == "baseline" and p["placements"][0] == 7
          assert p["completed"] is True and p["truncated_combats"] == 0 and p["turn_limit_end"] is False
          print("Original completed eight-seat receipt from run 41449960959 confirmed.")
          PY
      - name: Archive immutable original receipt for audit
        uses: actions/upload-artifact@v4
        with:
          name: v5-verified-existing-match-s-20261102-6fc22e71
          path: experiments/s-20261102-6fc22e71/001-93461.json
          if-no-files-found: error
          retention-days: 30
