name: Rank8 legal-purchase opportunity probe - s-20261102-decfc670

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rank8-probe-s-20261102-decfc670
  cancel-in-progress: false

jobs:
  trace-real-model:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests including legal-action diagnostic
        run: |
          python -m pip install -e '.[train,test]'
          python -m pytest
      - name: Pinned engine with verified action/observation contract
        run: bash scripts/bootstrap_engine.sh
      - name: Fetch permanent V2 model, verify hash, metadata and legal inference
        run: |
          mkdir -p outputs/s-20261102-decfc670
          gh release download v2-learning-41413557445 \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern model.zip --pattern model.metadata.json \
            --dir outputs/s-20261102-decfc670
          python -m tavern_ai.checkpoint_registry \
            --registry models/sessions/s-20261102-decfc670/registry.json \
            --model-id v2-learning-41413557445 \
            --model outputs/s-20261102-decfc670/model.zip \
            --metadata outputs/s-20261102-decfc670/model.metadata.json \
            --cpu-smoke
      - name: Two fresh authentic eight-seat model-action traces (guard explicitly counted)
        run: |
          python -m tavern_ai.rank8_probe_decfc670 \
            --model outputs/s-20261102-decfc670/model.zip \
            --registry models/sessions/s-20261102-decfc670/registry.json \
            --seeds 86251 86252 \
            --out-dir experiments/s-20261102-decfc670 \
            --report reports/s-20261102-decfc670/002-rank8-opportunities.json
          python -m tavern_ai.validate_receipt experiments/s-20261102-decfc670/002-86251.json
          python -m tavern_ai.validate_receipt experiments/s-20261102-decfc670/002-86252.json
      - name: Preserve only structured real-game evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rank8-real-model-s-20261102-decfc670-${{ github.run_id }}
          path: |
            experiments/s-20261102-decfc670/*.json
            reports/s-20261102-decfc670/*.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Persist genuine receipts on this branch only
        if: success()
        run: |
          test "$GITHUB_REF_NAME" = "agent/s-20261102-decfc670/optimization-001"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/s-20261102-decfc670/ reports/s-20261102-decfc670/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "results(s-20261102-decfc670): two real model-game action opportunity traces"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
