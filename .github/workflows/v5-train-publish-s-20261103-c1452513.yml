name: V5 read-only trainer gate and independent eight-seat smoke s-20261103-c1452513

on:
  push:
    branches:
      - agent/s-20261103-c1452513/optimization-001
    paths:
      - .github/workflows/v5-train-publish-s-20261103-c1452513.yml

permissions:
  contents: read

concurrency:
  group: s-20261103-c1452513-own-gate
  cancel-in-progress: false

jobs:
  audit-and-real-game:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and test workflow privilege isolation
        run: |
          python -m pip install -e '.[test]'
          python -m pytest -q tests/test_train_publish_privilege_s_20261103_c1452513.py
      - name: Install pinned TavernGym and verify observation/action contract
        run: |
          bash scripts/bootstrap_engine.sh
          python -m tavern_ai.contract
      - name: Run this session's genuine independent eight-seat game
        run: |
          mkdir -p experiments/s-20261103-c1452513
          python -m tavern_ai.canary --agent-id s-20261103-c1452513 \
            --seed 932019 --policy baseline \
            --receipt experiments/s-20261103-c1452513/001-932019.json
          python -m tavern_ai.validate_receipt \
            experiments/s-20261103-c1452513/001-932019.json
          cat experiments/s-20261103-c1452513/001-932019.json
      - name: Retain authentic receipt without granting write token to the game
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s-20261103-c1452513-real-game
          path: experiments/s-20261103-c1452513/001-932019.json
          if-no-files-found: ignore
          retention-days: 30
