name: V7 one-shot verified receipt custody s-20261103-406afe60

# Run once on creation; the receipt-only evidence commit does not retrigger it.
on:
  push:
    branches:
      - agent/s-20261103-406afe60/optimization-001
    paths:
      - .github/workflows/v7-import-receipts-s-20261103-406afe60.yml

permissions:
  actions: read
  contents: write

concurrency:
  group: v7-custody-s-20261103-406afe60
  cancel-in-progress: false

jobs:
  import-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download original finished-game Artifact from exact source run
        run: |
          set -euo pipefail
          gh run download 41511916662 --repo "$GITHUB_REPOSITORY" \
            --name v7-s406afe60-41511916662 --dir downloaded
          test -s downloaded/experiments/s-20261103-406afe60/001-baseline-99831.json
          test -s downloaded/experiments/s-20261103-406afe60/002-argmax-99831.json
          test -s downloaded/experiments/s-20261103-406afe60/003-sampled-99831.json
      - name: Independently check immutable original bytes, engine and provenance
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          from tavern_ai.receipt_integrity import validate_integrity
          root=Path("downloaded/experiments/s-20261103-406afe60")
          expected=[
              ("001-baseline-99831.json","4149499bd7fed09b45de93b5801d1b9db4cf9dd10c58df9f3045a7944876a97b","baseline",None),
              ("002-argmax-99831.json","aba5a0b30e205119c0ce52e06fbc446febf8338cb24c11626410bf5f2abb61dc","model","argmax"),
              ("003-sampled-99831.json","6355ab8757a1d6343480a2438b34f81784fb78adac7635b69efc1703592d3751","model","sampled"),
          ]
          model_sha="a73d24c68d238396136c9857ec4f341f39afc6562139ce9b693d282019db2632"
          src="b7260914ab2d7264cc44f1abc41f63bdf7f598f3"
          for filename, digest, policy, mode in expected:
              raw=(root/filename).read_bytes()
              assert hashlib.sha256(raw).hexdigest()==digest, filename
              receipt=json.loads(raw)
              validate_integrity(receipt)
              assert receipt["seed"] == 99831
              assert receipt["agent_id"] == "s-20261103-406afe60"
              assert receipt["git_sha"] == src
              assert receipt["policy"] == policy
              assert receipt.get("selection_mode") == mode
              assert receipt["model_sha256"] == (model_sha if policy=="model" else None)
              assert receipt.get("fallback_actions",0) == 0
              assert receipt.get("guard_forced_ends",0) == 0
              print(filename,receipt["placements"][0],digest)
          PY
      - name: Store only the three unchanged original real-game receipts in own branch
        run: |
          set -euo pipefail
          mkdir -p experiments/s-20261103-406afe60
          cp downloaded/experiments/s-20261103-406afe60/{001-baseline-99831,002-argmax-99831,003-sampled-99831}.json experiments/s-20261103-406afe60/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/s-20261103-406afe60/
          git diff --cached --quiet && { echo "Already archived"; exit 0; }
          git commit -m "evidence(v7): archive unchanged source-run 99831 three real eight-seat receipts"
          git push origin HEAD:refs/heads/agent/s-20261103-406afe60/optimization-001
