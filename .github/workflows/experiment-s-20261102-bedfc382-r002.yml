name: Session s-20261102-bedfc382 - round 002 longer PPO reward experiment

on:
  push:
    branches:
      - agent/s-20261102-bedfc382/optimization-001
    paths:
      - .github/workflows/experiment-s-20261102-bedfc382-r002.yml
      - tavern_ai/reward_experiment_r002.py

permissions:
  contents: write

concurrency:
  group: session-s-20261102-bedfc382-r002
  cancel-in-progress: false

jobs:
  paired-study:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[train,test]'
      - name: Check reward and cap invariants
        run: python -m pytest tests/test_session_reward.py
      - name: Install and verify pinned real TavernGym engine
        run: bash scripts/bootstrap_engine.sh
      - name: Two real 4096-step MaskablePPO training arms + 40 full games
        timeout-minutes: 55
        run: |
          python -m tavern_ai.reward_experiment_r002 \
            --steps 4096 --seed 22043 --out outputs/reward-r002
      - name: Validate 20 owned-seat real eight-player matches
        run: |
          for seed in $(seq 32001 32020); do
            python -m tavern_ai.validate_receipt \
              "experiments/s-20261102-bedfc382/002-${seed}.json"
          done
          python scripts/check_pr_evidence.py
        env:
          GITHUB_HEAD_REF: agent/s-20261102-bedfc382/optimization-001
      - name: Commit only this session round 002 evidence
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/s-20261102-bedfc382/002-*.json research/sessions/s-20261102-bedfc382/metrics-002.json
          git commit -m "experiment(s-20261102-bedfc382): save twenty true round-002 game receipts"
          git push origin HEAD:refs/heads/agent/s-20261102-bedfc382/optimization-001
      - name: Preserve session-only checkpoints and audit metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s-20261102-bedfc382-r002-models-${{ github.run_id }}
          path: |
            outputs/reward-r002/*.zip
            research/sessions/s-20261102-bedfc382/metrics-002.json
            experiments/s-20261102-bedfc382/002-*.json
          if-no-files-found: ignore
          retention-days: 30
