name: Masked-BC R001 s-20261102-1f73f4a5
on:
  push:
    branches:
      - 'agent/s-20261102-1f73f4a5/optimization-001'
    paths:
      - 'tavern_ai/bc_s_20261102_1f73f4a5.py'
      - 'tests/test_bc_s_20261102_1f73f4a5.py'
      - '.github/workflows/bc-s-20261102-1f73f4a5.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: masked-bc-s-20261102-1f73f4a5-r001
  cancel-in-progress: false
jobs:
  bounded-distill-and-real-games:
    if: github.ref == 'refs/heads/agent/s-20261102-1f73f4a5/optimization-001'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project training and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[train,test]'
      - name: Test legal-masking and public-observation guards
        run: python -m pytest tests/test_bc_s_20261102_1f73f4a5.py tests/test_baseline.py
      - name: Install exact TavernGym engine
        run: |
          bash scripts/bootstrap_engine.sh
          python -m tavern_ai.contract
      - name: Train BC and play six complete genuine eight-seat matches
        env:
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: |
          python -m tavern_ai.bc_s_20261102_1f73f4a5 --seed-train 56100 --seed-eval 56103 --out experiments/s-20261102-1f73f4a5
          python -m tavern_ai.validate_receipt experiments/s-20261102-1f73f4a5/teacher-56103.json
          python -m tavern_ai.validate_receipt experiments/s-20261102-1f73f4a5/student-guarded-56103.json
          python -m tavern_ai.validate_receipt experiments/s-20261102-1f73f4a5/student-guarded-56104.json
      - name: Commit only compact genuine receipts and metrics to own branch
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = "agent/s-20261102-1f73f4a5/optimization-001"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/s-20261102-1f73f4a5/*.json
          if ! git diff --cached --quiet; then
            git commit -m "evidence(bc): add actual heldout teacher and guarded student matches [skip ci]"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
      - name: Upload bounded model and evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bc-s-20261102-1f73f4a5-model
          path: |
            experiments/s-20261102-1f73f4a5/*.pt
            experiments/s-20261102-1f73f4a5/*.json
          if-no-files-found: ignore
          retention-days: 30
