name: V5 paired evidence and real game s-20261102-c647a479
on:
  push:
    branches:
      - agent/s-20261102-c647a479/optimization-001
    paths:
      - .github/workflows/v5-paired-evidence-s-20261102-c647a479.yml

permissions:
  contents: write

concurrency:
  group: v5-paired-evidence-s-20261102-c647a479
  cancel-in-progress: false

jobs:
  paired-evidence:
    if: github.repository == 'sstxww/reinforcement-learning'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded test dependencies
        run: python -m pip install -e '.[test]'
      - name: Full repository regression suite
        run: python -m pytest -q
      - name: Re-evaluate previously verified real paired game receipts
        run: |
          mkdir -p reports/s-20261102-c647a479
          python -m tavern_ai.paired_evidence \
            --candidate experiments/s-20261102-83d91476/001-candidate-45111.json experiments/s-20261102-83d91476/001-candidate-45112.json \
            --baseline experiments/s-20261102-83d91476/001-baseline-45111.json experiments/s-20261102-83d91476/001-baseline-45112.json \
            --out reports/s-20261102-c647a479/001-paired-45111-45112.json
      - name: Install authentic pinned TavernGym
        run: |
          bash scripts/bootstrap_engine.sh
          python -m tavern_ai.contract
      - name: Run own genuine complete eight-seat baseline match
        run: |
          mkdir -p experiments/s-20261102-c647a479
          python -m tavern_ai.canary --agent-id s-20261102-c647a479 \
            --seed 99641 --policy baseline \
            --receipt experiments/s-20261102-c647a479/001-99641.json
          python -m tavern_ai.validate_receipt experiments/s-20261102-c647a479/001-99641.json
      - name: Persist only this session's validated evidence
        if: success()
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = "agent/s-20261102-c647a479/optimization-001"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/s-20261102-c647a479/001-paired-45111-45112.json
          git add experiments/s-20261102-c647a479/001-99641.json
          if ! git diff --cached --quiet; then
            git commit -m "test(v5): persist paired real-game evaluation and own true eight-seat receipt"
            git push origin HEAD:agent/s-20261102-c647a479/optimization-001
          fi
      - name: Preserve bounded independent evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-paired-evidence-s-20261102-c647a479
          path: |
            reports/s-20261102-c647a479/*.json
            experiments/s-20261102-c647a479/*.json
          if-no-files-found: ignore
          retention-days: 30
