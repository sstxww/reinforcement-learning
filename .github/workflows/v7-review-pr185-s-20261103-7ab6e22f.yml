name: V7 independent PR185 review and genuine baseline s-20261103-7ab6e22f
on:
  push:
    branches: [agent/s-20261103-7ab6e22f/optimization-001]
    paths:
      - '.github/workflows/v7-review-pr185-s-20261103-7ab6e22f.yml'
      - 'tests/test_v7_token_postmerge_7ab6e22f.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v7-pr185-review-s-20261103-7ab6e22f
  cancel-in-progress: false
jobs:
  independent-token-gate-repro-and-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install unit test dependencies
        run: python -m pip install -e '.[test]'
      - name: Fetch immutable reviewed PR185 snapshot (read only)
        run: |
          mkdir -p outputs
          curl -fsSL --retry 2 --max-time 30 https://raw.githubusercontent.com/sstxww/reinforcement-learning/1259014683c5bfe834e9cfa8dfeba51419c390f4/scripts/v7_serial_integrator.py -o outputs/review-pr185.py
          curl -fsSL --retry 2 --max-time 30 https://raw.githubusercontent.com/sstxww/reinforcement-learning/1259014683c5bfe834e9cfa8dfeba51419c390f4/.github/workflows/v7-serialized-integrator.yml -o outputs/review-pr185.yml
      - name: Reproduce merged-but-no-main-CI failure via mock API
        env:
          V7_REVIEW_TARGET: outputs/review-pr185.py
          V7_REVIEW_WORKFLOW: outputs/review-pr185.yml
        run: python -m pytest -q tests/test_v7_token_postmerge_7ab6e22f.py
      - name: Install pinned TavernGym
        run: bash scripts/bootstrap_engine.sh
      - name: Verify pinned engine
        run: python -m tavern_ai.contract
      - name: Genuine eight-player baseline (NOT PPO strength)
        run: |
          python -m tavern_ai.canary --agent-id s-20261103-7ab6e22f \
            --seed 99831 --policy baseline \
            --receipt outputs/s-20261103-7ab6e22f-001-99831.json
          python -m tavern_ai.validate_receipt outputs/s-20261103-7ab6e22f-001-99831.json
      - name: Save original canary receipt and reviewed source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v7-pr185-review-7ab6e22f
          path: outputs/
          retention-days: 30
          if-no-files-found: ignore
