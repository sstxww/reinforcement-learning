name: V7 s-20261103-d8bde8c1 exact CI merge-base proof and real baseline canary

on:
  push:
    branches:
      - agent/s-20261103-d8bde8c1/optimization-001
    paths:
      - scripts/v7_ci_merge_base_d8bde8c1.py
      - tests/test_v7_ci_merge_base_d8bde8c1.py
      - .github/workflows/v7-ci-merge-base-s-20261103-d8bde8c1.yml

permissions:
  contents: read

concurrency:
  group: v7-s-20261103-d8bde8c1-merge-base-smoke
  cancel-in-progress: false

jobs:
  regression-and-eight-seat-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install unit test dependencies
        run: python -m pip install -e '.[test]'
      - name: Regression tests for stale PR merge base
        run: python -m pytest -q tests/test_v7_ci_merge_base_d8bde8c1.py
      - name: Install pinned TavernGym engine
        run: bash scripts/bootstrap_engine.sh
      - name: Validate pinned engine contract
        run: python -m tavern_ai.contract
      - name: Independent complete eight-seat baseline game
        run: |
          python -m tavern_ai.canary --agent-id s-20261103-d8bde8c1 \
            --seed 99679 --policy baseline --receipt outputs/s-20261103-d8bde8c1-001.json
          python -m tavern_ai.validate_receipt outputs/s-20261103-d8bde8c1-001.json
      - name: Preserve genuine original receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v7-d8bde8c1-eightseat-${{ github.run_id }}
          path: outputs/s-20261103-d8bde8c1-001.json
          if-no-files-found: ignore
          retention-days: 30
