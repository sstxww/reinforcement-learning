name: Seat rotation R002 s-20261102-e9dad467
on:
  push:
    branches: ['agent/s-20261102-e9dad467/optimization-002']
    paths:
      - 'tavern_ai/seat_rotation.py'
      - 'tests/test_seat_rotation.py'
      - '.github/workflows/seat-rotation-r002-s-20261102-e9dad467.yml'
permissions:
  contents: write
concurrency:
  group: seat-rotation-r002-s-20261102-e9dad467
  cancel-in-progress: false
jobs:
  heldout-seat-rotation:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and test
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
          python -m pytest tests/test_seat_rotation.py tests/test_baseline.py tests/test_receipt.py
      - name: Install pinned real TavernGym
        run: bash scripts/bootstrap_engine.sh
      - name: Twelve held-out genuine eight-seat matches
        run: |
          python -m tavern_ai.seat_rotation \
            --agent-id s-20261102-e9dad467 --round 2 \
            --seeds 41023 41024 41025 41026 --seats 0 3 6 \
            --receipt-dir experiments/s-20261102-e9dad467 \
            --report reports/s-20261102-e9dad467/rotation-round002.json
          python -m tavern_ai.validate_receipt experiments/s-20261102-e9dad467/002-41023.json
      - name: Upload real evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seat-rotation-r002-s-20261102-e9dad467
          path: |
            experiments/s-20261102-e9dad467/*.json
            reports/s-20261102-e9dad467/rotation-round002.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Save only own proven reports after success
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/s-20261102-e9dad467/ reports/s-20261102-e9dad467/rotation-round002.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "results(seat-rotation-r002): save twelve held-out real matches"
          test "$GITHUB_REF_NAME" = "agent/s-20261102-e9dad467/optimization-002"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
