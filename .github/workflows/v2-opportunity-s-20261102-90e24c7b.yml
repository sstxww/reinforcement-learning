name: V5 V2 legal-purchase diagnosis s-20261102-90e24c7b

on:
  push:
    branches:
      - agent/s-20261102-90e24c7b/optimization-001
    paths:
      - .github/workflows/v2-opportunity-s-20261102-90e24c7b.yml
      - tavern_ai/v2_opportunity_s_90e24c7b.py
      - tests/test_v2_opportunity_s_90e24c7b.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v5-v2-opportunity-s-20261102-90e24c7b-r001
  cancel-in-progress: false

jobs:
  verified-v2-trace:
    if: github.repository == 'sstxww/reinforcement-learning' && github.ref == 'refs/heads/agent/s-20261102-90e24c7b/optimization-001'
    runs-on: ubuntu-latest
    timeout-minutes: 105
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU train and test dependencies
        run: |
          python -m pip install -e '.[train,test]'
      - name: Full unit tests and specific action-mask regression
        run: |
          python -m pytest -q
          python -m pytest -q tests/test_v2_opportunity_s_90e24c7b.py
      - name: Build and verify pinned TavernGym 1.1.0
        run: |
          bash scripts/bootstrap_engine.sh
          python -m tavern_ai.contract
      - name: Download UNPROMOTED V2 from immutable Release and verify SHA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p checkpoints
          gh release download v2-learning-41413557445 \
            --repo sstxww/reinforcement-learning \
            --pattern model.zip --pattern model.metadata.json \
            --dir checkpoints
          echo '73bde2666426cecce39f135980a897bb2cd4a7d70783ba04c9c0d29477a6664a  checkpoints/model.zip' | sha256sum -c -
          test -s checkpoints/model.metadata.json
      - name: Paired full eight-seat genuine-game opportunity traces
        run: |
          python -m tavern_ai.v2_opportunity_s_90e24c7b \
            --model checkpoints/model.zip \
            --seed-start 89101 \
            --out reports/s-20261102-90e24c7b/001-opportunities.json
          python - <<'PY'
          import glob, json
          from tavern_ai.receipt_integrity import validate_integrity
          files=glob.glob("experiments/s-20261102-90e24c7b/*.json")
          assert len(files)==6, files
          for path in files:
              receipt=json.load(open(path,encoding="utf-8"))
              assert validate_integrity(receipt), path
              assert receipt["completed"] and not receipt["truncated_combats"] and not receipt["turn_limit_end"]
          report=json.load(open("reports/s-20261102-90e24c7b/001-opportunities.json",encoding="utf-8"))
          assert report["baseline"]["games"]==3 and report["model_guarded"]["games"]==3
          assert report["new_training_steps"]==0 and report["champion_promoted"] is False
          PY
      - name: Commit only this session's actual receipts and report
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'agent/s-20261102-90e24c7b/optimization-001'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/s-20261102-90e24c7b/*.json reports/s-20261102-90e24c7b/*.json
          if ! git diff --cached --quiet; then
            git commit -m "evidence(v5): real V2 opportunity traces and paired receipts [skip ci]"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
      - name: Back up compact evidence as expiring Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-v2-opportunity-s-20261102-90e24c7b
          path: |
            experiments/s-20261102-90e24c7b/*.json
            reports/s-20261102-90e24c7b/*.json
          if-no-files-found: ignore
          retention-days: 30
