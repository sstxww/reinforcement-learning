name: V5 durable-source and real-match audit s-20261102-5a69c4f2
on:
  push:
    branches:
      - agent/s-20261102-5a69c4f2/optimization-001
    paths:
      - '.github/workflows/experiment-s-20261102-5a69c4f2.yml'
      - 'tavern_ai/resume_guard_5a69c4f2.py'
      - 'tests/test_resume_guard_5a69c4f2.py'
permissions:
  contents: write
concurrency:
  group: isolated-v5-source-s-20261102-5a69c4f2
  cancel-in-progress: false
jobs:
  real-engine-verified-source:
    if: github.repository == 'sstxww/reinforcement-learning' && github.ref == 'refs/heads/agent/s-20261102-5a69c4f2/optimization-001'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate recovery guard with isolated unit regressions
        run: |
          python -m pip install -e '.[train,test]'
          python -m pytest -q tests/test_resume_guard_5a69c4f2.py
      - name: Install and verify exact pinned TavernGym
        run: |
          bash scripts/bootstrap_engine.sh
          python -m tavern_ai.contract
      - name: Download and verify registered durable Release with CPU inference
        run: |
          python -m tavern_ai.resume_guard_5a69c4f2 --role latest --probe-inference \
            --destination checkpoints
      - name: Complete independent, real eight-seat TavernGym baseline match
        run: |
          python -m tavern_ai.canary --agent-id s-20261102-5a69c4f2 --seed 741502 \
            --policy baseline --receipt experiments/s-20261102-5a69c4f2/001-741502.json
          python -m tavern_ai.validate_receipt experiments/s-20261102-5a69c4f2/001-741502.json
      - name: Persist genuine match receipt and verified Release attestation
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'agent/s-20261102-5a69c4f2/optimization-001'
          mkdir -p reports/s-20261102-5a69c4f2
          cp checkpoints/source-attestation.json reports/s-20261102-5a69c4f2/001-source-attestation.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/s-20261102-5a69c4f2/001-741502.json reports/s-20261102-5a69c4f2/001-source-attestation.json
          git diff --cached --quiet && exit 0
          git commit -m 'evidence(v5): real eight-seat match and Release recovery attestation'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
      - name: Preserve finite diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-source-s-20261102-5a69c4f2-${{ github.run_id }}
          path: |
            experiments/s-20261102-5a69c4f2/*.json
            checkpoints/source-attestation.json
          if-no-files-found: ignore
          retention-days: 30
