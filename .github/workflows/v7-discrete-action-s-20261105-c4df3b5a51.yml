name: V7 discrete-action regression and true eight-seat baseline s-20261105-c4df3b5a51
on:
  push:
    branches:
      - agent/s-20261105-c4df3b5a51/optimization-001
    paths:
      - 'tavern_ai/env.py'
      - 'tavern_ai/action_identity.py'
      - 'tests/test_action_identity_s_20261105_c4df3b5a51.py'
      - '.github/workflows/v7-discrete-action-s-20261105-c4df3b5a51.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v7-discrete-action-s-20261105-c4df3b5a51
  cancel-in-progress: false

jobs:
  regression-and-real-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded test dependencies
        run: python -m pip install -e '.[test]'
      - name: Regression for strict action identity
        run: python -m pytest -q tests/test_action_identity_s_20261105_c4df3b5a51.py
      - name: Install pinned TavernGym
        run: bash scripts/bootstrap_engine.sh
      - name: Validate pinned 4017-447-245 engine contract
        run: python -m tavern_ai.contract
      - name: Play real complete eight-seat baseline game
        run: |
          python -m tavern_ai.canary --agent-id s-20261105-c4df3b5a51 \
            --seed 110505 --policy baseline \
            --receipt outputs/s-20261105-c4df3b5a51-001-110505.json
          python -m tavern_ai.validate_receipt outputs/s-20261105-c4df3b5a51-001-110505.json
          python - <<'PY'
          import json
          from pathlib import Path
          from tavern_ai.receipt_integrity import validate_integrity
          p=json.loads(Path('outputs/s-20261105-c4df3b5a51-001-110505.json').read_text())
          validate_integrity(p)
          assert p['policy']=='baseline' and p['seed']==110505
          assert p['agent_id']=='s-20261105-c4df3b5a51' and p['completed'] is True
          print('Authentic baseline-only full eight-seat receipt valid')
          PY
      - name: Upload original receipt as temporary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v7-s-20261105-c4df3b5a51-baseline-${{ github.run_id }}
          path: outputs/s-20261105-c4df3b5a51-001-110505.json
          if-no-files-found: ignore
          retention-days: 30
