name: V5 durable unpromoted 1536-step checkpoint custody (s-20261102-aaee3a59)

on:
  push:
    branches:
      - agent/s-20261102-aaee3a59/optimization-001
    paths:
      - .github/workflows/v5-custody-s-20261102-aaee3a59.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: v5-custody-s-20261102-aaee3a59
  cancel-in-progress: false

jobs:
  publish-verified-challenger:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v5-s-20261102-aaee3a59-1536-41450695383
      EXPECTED_SHA256: 920bfa96370f0a40dcd7cae30e1652f323f27cb7516787e0375a4e8f1b046fc0
      EXPECTED_PARENT: a73d24c68d238396136c9857ec4f341f39afc6562139ce9b693d282019db2632
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install small CPU checkpoint verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[train,test]'
      - name: Download exact successful trained-model artifact from prior run
        shell: bash
        run: |
          set -euo pipefail
          gh run download 41450695383 --repo "$GITHUB_REPOSITORY" \
            --name v5-resume-smoke-s-20261102-aaee3a59-41450695383 \
            --dir custody
          test -s custody/checkpoints/candidate/model.zip
          test -s custody/checkpoints/candidate/model.metadata.json
          echo "$EXPECTED_SHA256  custody/checkpoints/candidate/model.zip" | sha256sum -c -
      - name: Check real lineage, native-mask-compatible checkpoint and true receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from sb3_contrib import MaskablePPO
          from tavern_ai.checkpoint_preflight import audit_archive
          from tavern_ai.validate_receipt import validate
          p = Path("custody/checkpoints/candidate/model.zip")
          q = Path("custody/checkpoints/candidate/model.metadata.json")
          doc = json.loads(q.read_text(encoding="utf-8"))
          assert doc["total_timesteps"] == 1536
          assert doc["checkpoint_sha256"] == "920bfa96370f0a40dcd7cae30e1652f323f27cb7516787e0375a4e8f1b046fc0"
          assert doc["parent_checkpoint_sha256"] == "a73d24c68d238396136c9857ec4f341f39afc6562139ce9b693d282019db2632"
          audit = audit_archive(p, q, doc["checkpoint_sha256"])
          assert audit["archive_integrity"] == "passed"
          agent = MaskablePPO.load(str(p), device="cpu")
          assert agent.num_timesteps == 1536
          assert agent.action_space.n == 245
          receipt = json.loads(Path("experiments/s-20261102-aaee3a59/002-94433.json").read_text(encoding="utf-8"))
          validate(receipt)
          assert receipt["policy"] == "model" and receipt["seed"] == 94433
          assert receipt["model_sha256"] == doc["checkpoint_sha256"]
          assert receipt["completed"] and receipt["placements"][0] == 8
          assert receipt["truncated_combats"] == 0 and not receipt["turn_limit_end"]
          print(json.dumps({"model_sha256": doc["checkpoint_sha256"], "parent_sha256": doc["parent_checkpoint_sha256"], "cumulative_steps":1536, "source_run":41450695383, "heldout_game_seed":94433, "rank":8, "champion":False, "verified":True}))
          PY
      - name: Publish immutable-name research-only checkpoint Release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; refusing overwrite/duplicate" >&2
            exit 2
          fi
          cat > custody/RELEASE_NOTES.md <<'NOTES'
          Research-only unpromoted V5 MaskablePPO challenger, independently reproduced source from GitHub Actions 41450695383.
          Parent: v5-s-20261102-68099929-1408-41428692617, 1408 cumulative steps.
          This model: 128 genuine additional PPO steps, 1536 total; sha256 920bfa96370f0a40dcd7cae30e1652f323f27cb7516787e0375a4e8f1b046fc0.
          Parent weights sha256 a73d24c68d238396136c9857ec4f341f39afc6562139ce9b693d282019db2632.
          Pinned TavernGym 1.1.0, observe2 4017/447, 245 legal actions.
          Actual unguarded model-controlled full game seed 94433 completed, place 8, 15 turns, 91 decisions, no truncation.
          Historical baseline smoke seed 94431 finished place 6 on different seed; no comparable paired strength gain proven.
          This Release is for recovery/research ONLY. No Champion promotion and no Arena Elo/competitive claim. Do not overwrite canonical models/registry.json automatically.
          Original verified source: https://github.com/sstxww/reinforcement-learning/actions/runs/41450695383
          NOTES
          gh release create "$TAG" \
            custody/checkpoints/candidate/model.zip \
            custody/checkpoints/candidate/model.metadata.json \
            experiments/s-20261102-aaee3a59/002-94433.json \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --title "V5 1536-step research challenger (rank 8; no promotion)" \
            --notes-file custody/RELEASE_NOTES.md
      - name: Verify published Release asset digest and stable name
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets,url \
            --jq '.url, (.assets[] | [.name, .size] | @tsv)'
          mkdir -p custody/redownload
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern model.zip --pattern model.metadata.json --dir custody/redownload
          echo "$EXPECTED_SHA256  custody/redownload/model.zip" | sha256sum -c -
          cmp custody/checkpoints/candidate/model.metadata.json custody/redownload/model.metadata.json
          echo "Release model and metadata redownload verified; experimental only"
