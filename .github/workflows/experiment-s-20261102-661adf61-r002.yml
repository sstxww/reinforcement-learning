name: "Official-bot BC R002 s-20261102-661adf61"

on:
  push:
    branches:
      - agent/s-20261102-661adf61/optimization-002
    paths:
      - .github/workflows/experiment-s-20261102-661adf61-r002.yml
      - tavern_ai/bc_official_session_661adf61.py
      - tests/test_bc_official_session_661adf61.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: bc-official-s-20261102-661adf61
  cancel-in-progress: false

jobs:
  official-teacher-compare:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixed limited dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Check action bands and paired metrics
        run: python -m pytest tests/test_bc_session_661adf61.py tests/test_bc_official_session_661adf61.py
      - name: Install pinned real TavernGym
        run: |
          bash scripts/bootstrap_engine.sh
          python -m tavern_ai.contract
      - name: Restore and verify old session candidate
        run: |
          mkdir -p checkpoint-old
          gh run download 41419937945 --repo "$GITHUB_REPOSITORY" --name bc-session-s-20261102-661adf61 --dir checkpoint-old
          test -n "$(find checkpoint-old -type f -name bc-model.pt -print -quit)"
      - name: Three real official-bot teacher games, 80 updates, 40 held-out eight-seat games
        shell: bash
        run: |
          OLD="$(find checkpoint-old -type f -name bc-model.pt -print -quit)"
          python -m tavern_ai.bc_official_session_661adf61 \
            --old-model "$OLD" --outdir experiments/s-20261102-661adf61/r002
      - name: Preserve official-bot pilot model and source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-bc-s-20261102-661adf61
          path: experiments/s-20261102-661adf61/r002/
          if-no-files-found: warn
          retention-days: 30
