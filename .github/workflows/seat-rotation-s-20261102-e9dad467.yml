name: Seat rotation s-20261102-e9dad467
on:
  push:
    branches:
      - 'agent/s-20261102-e9dad467/optimization-001'
    paths:
      - 'tavern_ai/seat_rotation.py'
      - 'tests/test_seat_rotation.py'
      - '.github/workflows/seat-rotation-s-20261102-e9dad467.yml'

permissions:
  contents: write

concurrency:
  group: seat-rotation-s-20261102-e9dad467
  cancel-in-progress: false

jobs:
  real-seat-rotation:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Unit and contract-independent tests
        run: python -m pytest tests/test_seat_rotation.py tests/test_baseline.py tests/test_receipt.py
      - name: Bootstrap pinned TavernGym 1.1.0
        run: bash scripts/bootstrap_engine.sh
      - name: True six-game three-seat experiment
        run: |
          python -m tavern_ai.seat_rotation \
            --agent-id s-20261102-e9dad467 \
            --seeds 41021 41022 --seats 0 3 6 \
            --receipt-dir experiments/s-20261102-e9dad467 \
            --report reports/s-20261102-e9dad467/rotation.json
          python -m tavern_ai.validate_receipt experiments/s-20261102-e9dad467/001-41021.json
      - name: Upload genuine evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seat-rotation-s-20261102-e9dad467
          path: |
            experiments/s-20261102-e9dad467/*.json
            reports/s-20261102-e9dad467/*.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Commit session-owned receipts only if the engine match succeeded
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/s-20261102-e9dad467/ reports/s-20261102-e9dad467/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "results(seat-rotation): save real completed TavernGym matches"
          test "$GITHUB_REF_NAME" = "agent/s-20261102-e9dad467/optimization-001"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
