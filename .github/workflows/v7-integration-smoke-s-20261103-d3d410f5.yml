name: V7 - serial gate unit tests and real canary s-20261103-d3d410f5

on:
  push:
    branches:
      - agent/s-20261103-d3d410f5/optimization-001
    paths:
      - 'scripts/v7_serial_integrator.py'
      - 'tests/test_v7_serial_integrator_d3d410f5.py'
      - '.github/workflows/v7-integration-smoke-s-20261103-d3d410f5.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: v7-s-20261103-d3d410f5-smoke
  cancel-in-progress: false

jobs:
  regression-and-real-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned test dependencies
        run: python -m pip install -e '.[test]'
      - name: V7 merge-gate regression tests
        run: python -m pytest -q tests/test_v7_serial_integrator_d3d410f5.py
      - name: Install pinned TavernGym engine
        run: bash scripts/bootstrap_engine.sh
      - name: Verify pinned engine contract
        run: python -m tavern_ai.contract
      - name: Genuine full eight-seat baseline-only canary
        run: |
          python -m tavern_ai.canary --agent-id s-20261103-d3d410f5 \
            --seed 99673 --policy baseline --receipt outputs/s-20261103-d3d410f5-001.json
          python -m tavern_ai.validate_receipt outputs/s-20261103-d3d410f5-001.json
      - name: Preserve original game receipt (temporary evidence, not model custody)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v7-s-20261103-d3d410f5-receipt-${{ github.run_id }}
          path: outputs/s-20261103-d3d410f5-001.json
          if-no-files-found: ignore
          retention-days: 30
