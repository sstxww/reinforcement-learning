name: V5 strict evaluation receipt canary - s-20261102-1aff5449

on:
  push:
    branches:
      - agent/s-20261102-1aff5449/optimization-001
    paths:
      - tavern_ai/evaluate.py
      - tests/test_eval_receipt_gate_s_1aff5449.py
      - .github/workflows/v5-eval-integrity-s-20261102-1aff5449.yml

permissions:
  contents: write

concurrency:
  group: v5-eval-integrity-s-20261102-1aff5449
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline testing requirements
        run: python -m pip install -e '.[test]'
      - name: Run evaluator and receipt integrity regressions
        run: python -m pytest -q tests/test_eval_receipt_gate_s_1aff5449.py tests/test_evaluation_v1.py tests/test_receipt_integrity.py
      - name: Install pinned TavernGym engine
        run: bash scripts/bootstrap_engine.sh
      - name: Verify TavernGym engine contract
        run: python -m tavern_ai.contract
      - name: Play one real full eight-seat baseline game
        run: |
          mkdir -p experiments/s-20261102-1aff5449
          python -m tavern_ai.canary --agent-id s-20261102-1aff5449 --policy baseline --seed 91991 --receipt experiments/s-20261102-1aff5449/001-91991.json
          python -m tavern_ai.validate_receipt experiments/s-20261102-1aff5449/001-91991.json
          python - <<'PY'
          import json
          from pathlib import Path
          from tavern_ai.receipt_integrity import validate_integrity
          row = json.loads(Path("experiments/s-20261102-1aff5449/001-91991.json").read_text())
          assert validate_integrity(row)
          assert row["seed"] == 91991 and row["agent_id"] == "s-20261102-1aff5449"
          assert row["completed"] is True and row["truncated_combats"] == 0 and not row["turn_limit_end"]
          print("Verified independent genuine full-game receipt: seed=91991, rank=",row["placements"][0])
          PY
      - name: Commit only this session's successful complete-game receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/s-20261102-1aff5449/001-91991.json
          if ! git diff --cached --quiet; then
            git commit -m "evidence(s-20261102-1aff5449): verified real eight-seat canary seed 91991"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
