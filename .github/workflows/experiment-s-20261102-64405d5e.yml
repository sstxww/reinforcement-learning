name: Purchase-before-play paired TavernGym s-20261102-64405d5e
on:
  push:
    branches:
      - 'agent/s-20261102-64405d5e/optimization-001'
    paths:
      - 'tavern_ai/purchase_before_play_s64405d5e.py'
      - 'tests/test_purchase_before_play_s64405d5e.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: purchase-before-play-s-20261102-64405d5e
  cancel-in-progress: false

jobs:
  real-matches:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated experiment test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Run regression tests
        run: python -m pytest
      - name: Bootstrap exact pinned upstream TavernGym
        run: |
          bash scripts/bootstrap_engine.sh
          python -m tavern_ai.contract
      - name: Candidate game plus six real paired eight-seat matches
        run: |
          python -m tavern_ai.purchase_before_play_s64405d5e --seed 41060 --paired-seed 41061 --pairs 6
          python -m tavern_ai.validate_receipt experiments/s-20261102-64405d5e/001-41060.json
          python - <<'PY'
          import json
          from pathlib import Path
          from tavern_ai.validate_receipt import validate
          files = sorted(Path('experiments/s-20261102-64405d5e').rglob('*.json'))
          assert len(files) == 13, len(files)
          for path in files:
              data = json.loads(path.read_text())
              validate(data)
              assert sorted(data['placements']) == list(range(1, 9))
          report = json.loads(Path('reports/s-20261102-64405d5e/paired-001.json').read_text())
          assert report['pairs'] == 6
          assert report['main_game_completed']
          print('Verified', len(files), 'genuine completed eight-seat games')
          PY
      - name: Commit session-only genuine receipts and paired metrics
        run: |
          test "$GITHUB_REF_NAME" = "agent/s-20261102-64405d5e/optimization-001"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/s-20261102-64405d5e/ reports/s-20261102-64405d5e/
          if ! git diff --cached --quiet; then
            git commit -m "results(s-20261102-64405d5e): real TavernGym paired receipts"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
      - name: Preserve short-term evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s-20261102-64405d5e-real-games
          path: |
            experiments/s-20261102-64405d5e/**/*.json
            experiments/s-20261102-64405d5e/*.json
            reports/s-20261102-64405d5e/*.json
          retention-days: 30
          if-no-files-found: ignore
