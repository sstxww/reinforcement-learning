name: V5 paired receipt gate s-20261102-2acfa761
on:
  push:
    branches: [agent/s-20261102-2acfa761/optimization-001]
    paths:
      - .github/workflows/paired-receipt-s-20261102-2acfa761.yml
permissions:
  contents: write
concurrency:
  group: paired-receipt-s-20261102-2acfa761
  cancel-in-progress: false
jobs:
  verify-and-play:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - name: Pure receipt pairing regression
        run: python -m pytest tests/test_paired_evidence_v5_s-20261102-2acfa761.py
      - name: Bootstrap pinned simulation engine
        run: bash scripts/bootstrap_engine.sh
      - name: Real baseline-controlled complete eight-seat match
        run: |
          python -m tavern_ai.contract
          python -m tavern_ai.canary --agent-id s-20261102-2acfa761 --seed 96271 --policy baseline --receipt experiments/s-20261102-2acfa761/001-96271.json
          python -m tavern_ai.validate_receipt experiments/s-20261102-2acfa761/001-96271.json
      - name: Preserve genuine receipt ONLY on isolated branch
        run: |
          test "$GITHUB_REF_NAME" = "agent/s-20261102-2acfa761/optimization-001"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/s-20261102-2acfa761/001-96271.json
          git diff --cached --quiet && exit 0
          git commit -m "test(v5): genuine eight-seat session receipt s-20261102-2acfa761"
          git push origin HEAD:refs/heads/agent/s-20261102-2acfa761/optimization-001
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paired-evidence-s-20261102-2acfa761
          path: experiments/s-20261102-2acfa761/*.json
          if-no-files-found: ignore
          retention-days: 30
