name: V7 isolated registry/resume evidence and real baseline 6c48b19e

on:
  push:
    branches:
      - agent/s-20261103-6c48b19e/optimization-001
    paths:
      - scripts/v7_registry_resume_claim_gate_6c48b19e.py
      - tests/test_v7_registry_resume_claim_gate_6c48b19e.py
      - .github/workflows/v7-registry-resume-6c48b19e.yml

permissions:
  contents: read

concurrency:
  group: v7-registry-resume-6c48b19e
  cancel-in-progress: false

jobs:
  source-audit-and-real-game:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -e '.[test]'
      - name: Run offline fail-closed tests
        run: python -m pytest -q tests/test_v7_registry_resume_claim_gate_6c48b19e.py
      - name: Audit real canonical main-registry snapshot
        run: |
          python scripts/v7_registry_resume_claim_gate_6c48b19e.py \
            --out reports/s-20261103-6c48b19e/001-resume-claim-audit.json
      - name: Bootstrap pinned TavernGym
        run: bash scripts/bootstrap_engine.sh
      - name: One authentic full eight-seat baseline game, no model-strength claim
        run: |
          mkdir -p experiments/s-20261103-6c48b19e
          python -m tavern_ai.canary --agent-id s-20261103-6c48b19e \
            --seed 99573 --policy baseline \
            --receipt experiments/s-20261103-6c48b19e/001-99573.json
          python -m tavern_ai.validate_receipt \
            experiments/s-20261103-6c48b19e/001-99573.json
      - name: Save original engine and audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v7-registry-resume-6c48b19e-${{ github.run_id }}
          path: |
            experiments/s-20261103-6c48b19e/*.json
            reports/s-20261103-6c48b19e/*.json
          if-no-files-found: ignore
          retention-days: 30
