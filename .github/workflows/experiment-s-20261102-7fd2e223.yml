name: Session s-20261102-7fd2e223 - idle hero power paired TavernGym games

on:
  push:
    branches:
      - agent/s-20261102-7fd2e223/optimization-001
    paths:
      - '.github/workflows/experiment-s-20261102-7fd2e223.yml'
      - 'tavern_ai/hero_power_probe_7fd2e223.py'
      - 'tests/test_hero_power_probe_7fd2e223.py'

permissions:
  contents: write

concurrency:
  group: experiment-s-20261102-7fd2e223
  cancel-in-progress: false

jobs:
  real-paired-games:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -e '.[test]'
      - name: Run independent and baseline regression tests
        run: python -m pytest
      - name: Install genuine pinned TavernGym and verify observe2 contract
        run: |
          bash scripts/bootstrap_engine.sh
          python -m tavern_ai.contract
      - name: Play four matched eight-seat games with each policy
        run: |
          python -m tavern_ai.hero_power_probe_7fd2e223 \
            --agent-id s-20261102-7fd2e223 --start-seed 73101 --games 4 \
            --receipts experiments/s-20261102-7fd2e223 \
            --report reports/s-20261102-7fd2e223/paired-001.json
          for seed in 73101 73102 73103 73104; do
            python -m tavern_ai.validate_receipt "experiments/s-20261102-7fd2e223/001-${seed}.json"
            python -m tavern_ai.validate_receipt "experiments/s-20261102-7fd2e223/001-control-${seed}.json"
          done
      - name: Commit only genuine experiment receipts to this private branch
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = "agent/s-20261102-7fd2e223/optimization-001"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/s-20261102-7fd2e223/ reports/s-20261102-7fd2e223/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "results(s-20261102-7fd2e223): store real paired full-game receipts"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
      - name: Upload short-lived evidence backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s-20261102-7fd2e223-evidence-${{ github.run_id }}
          path: |
            experiments/s-20261102-7fd2e223/*.json
            reports/s-20261102-7fd2e223/*.json
          if-no-files-found: ignore
          retention-days: 30
