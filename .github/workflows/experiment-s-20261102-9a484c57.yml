name: Session s-20261102-9a484c57 early-upgrade paired eight-seat ablation

on:
  push:
    branches: ['agent/s-20261102-9a484c57/optimization-001']
    paths:
      - 'tavern_ai/upgrade_probe_9a484c57.py'
      - 'tests/test_upgrade_probe_9a484c57.py'
      - '.github/workflows/experiment-s-20261102-9a484c57.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: experiment-s-20261102-9a484c57
  cancel-in-progress: false

jobs:
  paired-real-games:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install -e '.[test]'
      - name: Run unit regressions
        run: python -m pytest
      - name: Install genuine pinned TavernGym 1.1.0
        run: |
          bash scripts/bootstrap_engine.sh
          python -m tavern_ai.contract
      - name: Run six complete independently seeded eight-seat games
        run: |
          python -m tavern_ai.upgrade_probe_9a484c57 --seeds 42021 42022 42023
          for r in experiments/s-20261102-9a484c57/*.json; do
            python -m tavern_ai.validate_receipt "$r"
          done
      - name: Commit solely this session's real match receipts and metrics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/s-20261102-9a484c57/ reports/s-20261102-9a484c57/
          if git diff --cached --quiet; then
            echo "No new experiment receipts"
            exit 0
          fi
          git commit -m "evidence(s-20261102-9a484c57): genuine paired TavernGym matches"
          test "$GITHUB_REF_NAME" = "agent/s-20261102-9a484c57/optimization-001"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
      - name: Retain paired receipts as a short-lived backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-s-20261102-9a484c57-${{ github.run_id }}
          path: |
            experiments/s-20261102-9a484c57/*.json
            reports/s-20261102-9a484c57/*.json
          if-no-files-found: ignore
          retention-days: 30
