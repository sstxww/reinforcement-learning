name: Checkpoint preflight s-20261102-75cf9e03
on:
  push:
    branches:
      - agent/s-20261102-75cf9e03/optimization-001
    paths:
      - tavern_ai/checkpoint_preflight.py
      - tests/test_checkpoint_preflight.py
      - .github/workflows/checkpoint-preflight-s-20261102-75cf9e03.yml
permissions:
  contents: write
concurrency:
  group: checkpoint-preflight-s-20261102-75cf9e03
  cancel-in-progress: false
jobs:
  integrity-and-real-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies and run synthetic archive regressions
        run: |
          python -m pip install -e '.[test]'
          python -m pytest tests/test_checkpoint_preflight.py
      - name: Bootstrap pinned real TavernGym
        run: bash scripts/bootstrap_engine.sh
      - name: Execute one genuine complete eight-seat baseline canary
        run: |
          python -m tavern_ai.canary --agent-id s-20261102-75cf9e03 --policy baseline --seed 65810 --receipt experiments/s-20261102-75cf9e03/001-65810.json
          python -m tavern_ai.validate_receipt experiments/s-20261102-75cf9e03/001-65810.json
      - name: Save own genuine match evidence (non-triggering path only)
        if: success()
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = "agent/s-20261102-75cf9e03/optimization-001"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/s-20261102-75cf9e03/001-65810.json
          git diff --cached --quiet && exit 0
          git commit -m "evidence(s-20261102-75cf9e03): genuine eight-seat baseline canary"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
      - name: Preserve isolated genuine receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint-preflight-s-20261102-75cf9e03-${{ github.run_id }}
          path: experiments/s-20261102-75cf9e03/001-65810.json
          if-no-files-found: ignore
          retention-days: 30
