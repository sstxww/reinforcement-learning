name: "V7 raw PPO seat-1 paired proof s-20261103-6f28c1b9"
on:
  push:
    branches: ['agent/s-20261103-6f28c1b9/optimization-001']
    paths:
      - '.github/workflows/v7-model-seat1-s-6f28c1b9.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: 'v7-raw-seat1-s-20261103-6f28c1b9'
  cancel-in-progress: false

jobs:
  paired-genuine-eight-seat:
    if: github.ref == 'refs/heads/agent/s-20261103-6f28c1b9/optimization-001'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tests and real MaskablePPO inference dependencies
        run: python -m pip install -e '.[test,train]'
      - name: Strict synthetic regression (never match evidence)
        run: python -m pytest -q tests/test_model_seat1_s_6f28c1b9.py
      - name: Install and verify pinned TavernGym 1.1.0
        run: |
          bash scripts/bootstrap_engine.sh
          python -m tavern_ai.contract
      - name: Download registered unpromoted V5 model from durable Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p checkpoints
          gh release download v5-s-20261102-68099929-1408-41428692617 \
            --repo sstxww/reinforcement-learning --pattern model.zip --dir checkpoints
          echo 'a73d24c68d238396136c9857ec4f341f39afc6562139ce9b693d282019db2632  checkpoints/model.zip' | sha256sum --check -
      - name: Genuine eight-seat baseline seat-1 matched-seed control
        run: |
          python -m tavern_ai.seat_rotation \
            --agent-id s-20261103-6f28c1b9 --seeds 992310 --seats 1 \
            --receipt-dir experiments/s-20261103-6f28c1b9 \
            --report reports/s-20261103-6f28c1b9/baseline-seat1.json
          python -m tavern_ai.validate_receipt experiments/s-20261103-6f28c1b9/rotated-992310-seat1.json
      - name: Genuine unassisted raw V5 PPO seat-1 game
        run: |
          python -m tavern_ai.model_seat1_s_6f28c1b9 \
            --seed 992310 --seat 1 --agent-id s-20261103-6f28c1b9 \
            --checkpoint checkpoints/model.zip \
            --receipt experiments/s-20261103-6f28c1b9/001-992310-seat1-model.json \
            --failure reports/s-20261103-6f28c1b9/001-992310-model-failure.json
          python -m tavern_ai.validate_receipt experiments/s-20261103-6f28c1b9/001-992310-seat1-model.json
      - name: Preserve original game receipts or true failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v7-raw-seat1-s-20261103-6f28c1b9-${{ github.run_id }}
          path: |
            experiments/s-20261103-6f28c1b9/*.json
            reports/s-20261103-6f28c1b9/*.json
          if-no-files-found: ignore
          retention-days: 30
