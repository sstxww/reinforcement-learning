name: Independent card-pooling ablation s-20261102-e4c71b9d

on:
  push:
    branches:
      - agent/s-20261102-e4c71b9d/optimization-001
    paths:
      - .github/workflows/experiment-s-20261102-e4c71b9d.yml

permissions:
  contents: write

concurrency:
  group: card-pool-s-20261102-e4c71b9d
  cancel-in-progress: false

jobs:
  bounded-experiment:
    if: github.ref == 'refs/heads/agent/s-20261102-e4c71b9d/optimization-001'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SESSION_ID: s-20261102-e4c71b9d
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded CPU dependencies and run tests
        run: |
          python -m pip install -e '.[train,test]'
          python -m pytest
      - name: Bootstrap pinned original game engine
        run: bash scripts/bootstrap_engine.sh
      - name: Verify TavernGym observation and action mask
        run: python -m tavern_ai.contract
      - name: Real independent eight-seat canary safety receipt
        run: |
          python -m tavern_ai.canary --agent-id "$SESSION_ID" --seed 32010 \
            --policy baseline --receipt "experiments/$SESSION_ID/001-32010.json"
          python -m tavern_ai.validate_receipt "experiments/$SESSION_ID/001-32010.json"
      - name: Actual PPO training 128 + 128 and same-seed complete matches
        run: |
          python -m tavern_ai.card_pool_experiment --steps 128 --seed 32000 --games 2
          python -m tavern_ai.validate_receipt "experiments/$SESSION_ID/001-32011.json"
          python -m tavern_ai.validate_receipt "experiments/$SESSION_ID/001-32012.json"
      - name: Commit only this session's generated JSON evidence
        if: always()
        shell: bash
        run: |
          git config user.name "autotavern-research-ci"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -d "experiments/$SESSION_ID" ]]; then git add -A "experiments/$SESSION_ID"; fi
          if [[ -d "reports/$SESSION_ID" ]]; then git add -A "reports/$SESSION_ID"; fi
          if ! git diff --cached --quiet; then
            git commit -m "experiment($SESSION_ID): engine-backed receipts and matched-seed data"
            git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          fi
      - name: Upload session-only model checkpoints and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-pool-s-20261102-e4c71b9d
          path: |
            checkpoints/s-20261102-e4c71b9d/
            experiments/s-20261102-e4c71b9d/
            reports/s-20261102-e4c71b9d/
          if-no-files-found: warn
          retention-days: 30
