name: V7 advisory workload budget and real eight-seat canary 0cefc414
on:
  push:
    branches:
      - agent/s-20261103-0cefc414/optimization-001
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v7-budget-s-20261103-0cefc414
  cancel-in-progress: false
jobs:
  regression-and-independent-real-game:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned unit dependencies
        run: python -m pip install -e '.[test]'
      - name: Budget fail-closed regression
        run: python -m pytest -q tests/test_v7_workload_budget_0cefc414.py
      - name: Install pinned TavernGym engine
        run: bash scripts/bootstrap_engine.sh
      - name: Verify engine contract
        run: python -m tavern_ai.contract
      - name: Authentic independent baseline eight-seat game
        run: |
          python -m tavern_ai.canary --agent-id s-20261103-0cefc414 \
            --seed 99697 --policy baseline --receipt outputs/s-20261103-0cefc414-001.json
          python -m tavern_ai.validate_receipt outputs/s-20261103-0cefc414-001.json
      - name: Upload original game evidence (NOT model custody)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v7-budget-0cefc414-${{ github.run_id }}
          path: outputs/s-20261103-0cefc414-001.json
          if-no-files-found: ignore
          retention-days: 30
