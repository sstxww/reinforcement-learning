name: V5 play-cancel guarded policy pilot 902968f5

on:
  push:
    branches:
      - 'agent/s-20261102-902968f5/optimization-001'
    paths:
      - 'tavern_ai/play_cancel_guard_902968f5.py'
      - 'tests/test_play_cancel_guard_902968f5.py'
      - '.github/workflows/play-cancel-pilot-902968f5.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: play-cancel-pilot-902968f5
  cancel-in-progress: false

jobs:
  genuine-guarded-games:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate legal action mask guard unit tests
        run: |
          python -m pip install -e '.[train,test]'
          python -m pytest tests/test_play_cancel_guard_902968f5.py
      - name: Bootstrap real pinned TavernGym
        run: bash scripts/bootstrap_engine.sh
      - name: Recover immutable 1408-step FAILED-game checkpoint (not Champion)
        run: |
          mkdir -p restored
          gh run download 41427679320 --repo sstxww/reinforcement-learning \
            --name release-resume-diagnostic-902968f5-41427679320 --dir restored
          printf '%s  %s\n' 503c527492d3a43ff2be9996c4865d2af8be55a981a5a0308b4dccb316598e8e restored/checkpoints/resumed-902968f5/model.zip | sha256sum -c -
      - name: Trial A authentic eight-seat game using GUARDED MODEL action mask
        run: |
          python -m tavern_ai.play_cancel_guard_902968f5 \
            --seed 927104 --model restored/checkpoints/resumed-902968f5/model.zip \
            --expected-sha 503c527492d3a43ff2be9996c4865d2af8be55a981a5a0308b4dccb316598e8e \
            --out reports/s-20261102-902968f5/003-guarded-927104.json
      - name: Trial B new held-out authentic eight-seat GUARDED MODEL game
        run: |
          python -m tavern_ai.play_cancel_guard_902968f5 \
            --seed 927106 --model restored/checkpoints/resumed-902968f5/model.zip \
            --expected-sha 503c527492d3a43ff2be9996c4865d2af8be55a981a5a0308b4dccb316598e8e \
            --out reports/s-20261102-902968f5/003-guarded-927106.json
      - name: Save unchanged-source guarded experiment reports on own branch
        if: always()
        run: |
          test "$GITHUB_REF_NAME" = "agent/s-20261102-902968f5/optimization-001" || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p reports/s-20261102-902968f5
          git add reports/s-20261102-902968f5/003-guarded-*.json
          git diff --cached --quiet && exit 0
          git commit -m "results(902968f5): authentic separate guarded-policy pilot evidence"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
      - name: Upload raw bounded results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: play-cancel-pilot-902968f5-${{ github.run_id }}
          path: reports/s-20261102-902968f5/003-guarded-*.json
          if-no-files-found: ignore
          retention-days: 30
