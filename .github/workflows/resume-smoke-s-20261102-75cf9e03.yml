name: V5 bounded genuine Release resume probe s-20261102-75cf9e03
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: resume-smoke-s-20261102-75cf9e03
  cancel-in-progress: false
jobs:
  release-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
      SRC_SHA256: 73bde2666426cecce39f135980a897bb2cd4a7d70783ba04c9c0d29477a6664a
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install training dependencies and pinned TavernGym
        run: |
          python -m pip install -e '.[train,test]'
          bash scripts/bootstrap_engine.sh
      - name: Independently download V2 Release weights and metadata
        run: |
          set -euo pipefail
          mkdir -p checkpoints/source checkpoints/next reports/s-20261102-75cf9e03
          gh release download v2-learning-41413557445 --repo "$GITHUB_REPOSITORY" --pattern model.zip --dir checkpoints/source
          gh release download v2-learning-41413557445 --repo "$GITHUB_REPOSITORY" --pattern model.metadata.json --dir checkpoints/source
          python -m tavern_ai.checkpoint_preflight --model checkpoints/source/model.zip --metadata checkpoints/source/model.metadata.json --expected-sha256 "$SRC_SHA256" --probe-inference | tee reports/s-20261102-75cf9e03/002-source-preflight.json
      - name: Genuine bounded optimizer continuation (128 PPO steps)
        run: |
          python -m tavern_ai.train --steps 128 --seed 7819 --resume checkpoints/source/model.zip --out checkpoints/next/model.zip
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          old=json.loads(Path('checkpoints/source/model.metadata.json').read_text())
          new=json.loads(Path('checkpoints/next/model.metadata.json').read_text())
          if int(old['total_timesteps'])!=1280 or int(new['total_timesteps'])!=1408:
              raise SystemExit(f'Unexpected resumed steps: {old["total_timesteps"]} -> {new["total_timesteps"]}')
          d=hashlib.sha256(Path('checkpoints/next/model.zip').read_bytes()).hexdigest()
          if d==hashlib.sha256(Path('checkpoints/source/model.zip').read_bytes()).hexdigest():
              raise SystemExit('Checkpoint unchanged after attempted PPO continuation')
          Path('reports/s-20261102-75cf9e03/002-resume-metadata.json').write_text(json.dumps({
              'schema':1,'session_id':'s-20261102-75cf9e03',
              'source_release':'v2-learning-41413557445',
              'source_sha256':'73bde2666426cecce39f135980a897bb2cd4a7d70783ba04c9c0d29477a6664a',
              'source_total_timesteps':1280,'actual_added_timesteps':128,
              'output_total_timesteps':1408,'output_sha256':d,
              'status':'optimizer_continuation_completed_but_match_pending',
              'promoted_champion':False},indent=2)+'\n')
          print('Verified 1280 -> 1408 steps, new SHA256',d)
          PY
      - name: Genuine model-controlled complete eight-seat match
        run: |
          python -m tavern_ai.canary --agent-id s-20261102-75cf9e03 --policy model --model checkpoints/next/model.zip --seed 65811 --receipt experiments/s-20261102-75cf9e03/002-65811-model.json
          python -m tavern_ai.validate_receipt experiments/s-20261102-75cf9e03/002-65811-model.json
      - name: Archive only checked, complete-game unpromoted diagnostic model
        run: |
          TAG="v5-smoke-s-20261102-75cf9e03-${GITHUB_RUN_ID}"
          gh release create "$TAG" checkpoints/next/model.zip checkpoints/next/model.metadata.json reports/s-20261102-75cf9e03/002-resume-metadata.json experiments/s-20261102-75cf9e03/002-65811-model.json --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "V5 128-step resume smoke (unpromoted)" --notes "Engineering recovery verification only. Trained 1280 to 1408 steps from v2-learning-41413557445; genuine eight-seat model game verified. Not a Champion, no strength claim."
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('reports/s-20261102-75cf9e03/002-resume-metadata.json')
          d=json.loads(p.read_text())
          d['status']='release_archived_unpromoted_complete_game'
          d['release_tag']='v5-smoke-s-20261102-75cf9e03-'+os.environ['GITHUB_RUN_ID']
          p.write_text(json.dumps(d,indent=2)+'\n')
          PY
      - name: Commit only verified session evidence (no weights)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/s-20261102-75cf9e03/002-*.json experiments/s-20261102-75cf9e03/002-65811-model.json
          git diff --cached --quiet && exit 0
          git commit -m "results(s-20261102-75cf9e03): verified bounded V2 Release continuation"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
      - name: Preserve diagnostic archive, even on failed resume or model match
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resume-smoke-s-20261102-75cf9e03-${{ github.run_id }}
          path: |
            checkpoints/next/model.zip
            checkpoints/next/model.metadata.json
            reports/s-20261102-75cf9e03/002-*.json
            experiments/s-20261102-75cf9e03/002-65811-model.json
          if-no-files-found: ignore
          retention-days: 30
