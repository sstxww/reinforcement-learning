name: V7 main enforcement and authentic eight-seat smoke 0d5a452fe9

on:
  push:
    branches: [agent/s-20261103-0d5a452fe9/optimization-001]
    paths:
      - 'scripts/v7_main_enforcement_0d5a452fe9.py'
      - 'tests/test_v7_main_enforcement_0d5a452fe9.py'
      - '.github/workflows/v7-main-enforcement-audit-0d5a452fe9.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v7-0d5a452fe9-main-audit
  cancel-in-progress: false

jobs:
  enforcement-and-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project test requirements
        run: python -m pip install -e '.[test]'
      - name: Fail-closed gate regression tests
        run: python -m pytest -q tests/test_v7_main_enforcement_0d5a452fe9.py
      - name: Live main enforcement audit (block verdict is expected evidence)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          python scripts/v7_main_enforcement_0d5a452fe9.py --json-out outputs/enforcement-0d5a452fe9.json
          code=$?
          set -e
          test "$code" -eq 2
          python - <<'PY'
          import json
          p=json.load(open('outputs/enforcement-0d5a452fe9.json'))
          assert p['globally_exclusive_merge_permission'] is False
          assert p['verdict'].startswith('BLOCKED')
          PY
      - name: Install pinned TavernGym engine
        run: bash scripts/bootstrap_engine.sh
      - name: Confirm pinned engine contract
        run: python -m tavern_ai.contract
      - name: Genuine complete eight-seat baseline (no PPO performance claim)
        run: |
          python -m tavern_ai.canary --agent-id s-20261103-0d5a452fe9 --seed 99681 --policy baseline --receipt outputs/001-99681.json
          python -m tavern_ai.validate_receipt outputs/001-99681.json
      - name: Save original baseline and audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v7-main-audit-0d5a452fe9-${{ github.run_id }}
          path: |
            outputs/001-99681.json
            outputs/enforcement-0d5a452fe9.json
          retention-days: 30
          if-no-files-found: ignore
