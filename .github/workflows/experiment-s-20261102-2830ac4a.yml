name: "Hold-sell ablation s-20261102-2830ac4a"

on:
  push:
    branches:
      - agent/s-20261102-2830ac4a/optimization-001
    paths:
      - tavern_ai/hold_sell_experiment.py
      - tests/test_hold_sell_experiment.py
      - .github/workflows/experiment-s-20261102-2830ac4a.yml

permissions:
  contents: write

concurrency:
  group: experiment-s-20261102-2830ac4a
  cancel-in-progress: false

jobs:
  real-eight-seat-ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: Checkout only this session branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install -e '.[test]'
      - name: Unit and regression tests
        run: python -m pytest
      - name: Bootstrap exact upstream engine and verify contract
        run: |
          bash scripts/bootstrap_engine.sh
          python -m tavern_ai.contract
      - name: Run own candidate match and three seed-paired controls
        run: |
          python -m tavern_ai.hold_sell_experiment \
            --agent-id s-20261102-2830ac4a \
            --seed 34200 \
            --pair-seeds 34201 34202 34203 \
            --out-dir experiments/s-20261102-2830ac4a \
            --report reports/s-20261102-2830ac4a/hold-sell-paired.json
          python -m tavern_ai.validate_receipt \
            experiments/s-20261102-2830ac4a/001-34200.json
          for receipt in experiments/s-20261102-2830ac4a/*.json; do
            python -m tavern_ai.validate_receipt "$receipt"
          done
      - name: Archive independently named run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hold-sell-s-20261102-2830ac4a-${{ github.run_id }}
          path: |
            experiments/s-20261102-2830ac4a/*.json
            reports/s-20261102-2830ac4a/*.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Commit only verified data to own branch
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'agent/s-20261102-2830ac4a/optimization-001'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/s-20261102-2830ac4a/ reports/s-20261102-2830ac4a/
          if git diff --cached --quiet; then
            echo "No novel receipts"
            exit 0
          fi
          git commit -m "results(s-20261102-2830ac4a): real paired TavernGym games"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
