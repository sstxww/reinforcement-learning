name: Choice after hero s-20261102-b34940b0 round 002
on:
  push:
    branches: ['agent/s-20261102-b34940b0/optimization-002']
    paths:
      - 'tavern_ai/choice_after_hero_s_b34940b0.py'
      - 'tests/test_choice_after_hero_s_b34940b0.py'
      - '.github/workflows/choice-after-hero-s-20261102-b34940b0.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: 'choice-after-hero-s-20261102-b34940b0-${{ github.ref }}'
  cancel-in-progress: false
jobs:
  real-three-arm-paired:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test isolated choice contracts
        run: |
          python -m pip install -e '.[test]'
          python -m pytest tests/test_choice_after_hero_s_b34940b0.py tests/test_baseline.py
      - name: Install immutable source and verify actual TavernGym
        run: |
          bash scripts/bootstrap_engine.sh
          python -m tavern_ai.contract
      - name: Run 24 genuine full eight-seat games
        run: |
          python -m tavern_ai.choice_after_hero_s_b34940b0 \
            --seeds 65201 65202 65203 65204 65301 65302 65303 65304 \
            --receipts experiments/s-20261102-b34940b0 \
            --report research/sessions/s-20261102-b34940b0/metrics-002.json
          for f in experiments/s-20261102-b34940b0/002-*.json; do
            python -m tavern_ai.validate_receipt "$f"
          done
      - name: Persist only this round's exact independent JSON
        run: |
          test "$GITHUB_REF_NAME" = 'agent/s-20261102-b34940b0/optimization-002'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/s-20261102-b34940b0/ research/sessions/s-20261102-b34940b0/metrics-002.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'results(s-20261102-b34940b0): real three-arm hero-choice ablation'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
      - name: Preserve evidence in session-specific short-lived artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hero-choice-s-20261102-b34940b0-${{ github.run_id }}
          path: |
            experiments/s-20261102-b34940b0/**/*.json
            research/sessions/s-20261102-b34940b0/metrics-002.json
          if-no-files-found: ignore
          retention-days: 30
