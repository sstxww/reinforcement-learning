name: V5 s-20261102-b45c837d checkpoint integrity & real game
on:
  push:
    branches:
      - agent/s-20261102-b45c837d/optimization-001
    paths:
      - 'tavern_ai/checkpoint_registry.py'
      - 'tests/test_checkpoint_registry.py'
      - '.github/workflows/v5-registry-s-20261102-b45c837d.yml'
permissions:
  contents: write
concurrency:
  group: v5-registry-s-20261102-b45c837d
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tests
        run: python -m pip install -e '.[test]'
      - name: Run checkpoint regression and repository tests
        run: python -m pytest
      - name: Bootstrap pinned TavernGym
        run: bash scripts/bootstrap_engine.sh
      - name: Run one authentic eight-seat baseline game
        run: |
          mkdir -p experiments/s-20261102-b45c837d
          python -m tavern_ai.canary --seed 99583 --agent-id s-20261102-b45c837d --policy baseline --receipt experiments/s-20261102-b45c837d/001-99583.json
          python -m tavern_ai.validate_receipt experiments/s-20261102-b45c837d/001-99583.json
      - name: Commit own completed-game evidence once
        if: success()
        run: |
          test "$GITHUB_REF_NAME" = "agent/s-20261102-b45c837d/optimization-001"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/s-20261102-b45c837d/001-99583.json
          git diff --cached --quiet && exit 0
          git commit -m "evidence(s-20261102-b45c837d): completed pinned-engine eight-seat match"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
      - name: Store temporary verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-registry-s-20261102-b45c837d
          path: experiments/s-20261102-b45c837d/001-99583.json
          if-no-files-found: ignore
          retention-days: 30
