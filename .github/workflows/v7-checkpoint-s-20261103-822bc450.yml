name: V7 checkpoint writer no-clobber - s-20261103-822bc450

on:
  push:
    branches:
      - agent/s-20261103-822bc450/optimization-001
    paths:
      - .github/workflows/v7-checkpoint-s-20261103-822bc450.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v7-checkpoint-writer-s-20261103-822bc450
  cancel-in-progress: false

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded regression dependencies
        run: |
          python -m pip install -e '.[test]'
      - name: Test writer integrity and seven no-clobber races
        run: |
          python -m pytest -q tests/test_checkpoint_writer_s_20261102_001b7da1.py tests/test_checkpoint_no_clobber_s_20261103_822bc450.py
      - name: Install pinned TavernGym and verify engine contract
        run: |
          bash scripts/bootstrap_engine.sh
          python -m tavern_ai.contract
      - name: Own genuine eight-seat baseline canary, not a PPO score
        run: |
          mkdir -p outputs
          python -m tavern_ai.canary --agent-id s-20261103-822bc450 --seed 98413 --policy baseline --receipt outputs/001-98413.json
          python -m tavern_ai.validate_receipt outputs/001-98413.json
          python -m json.tool outputs/001-98413.json
          sha256sum outputs/001-98413.json > outputs/001-98413.sha256
      - name: Preserve original receipt and digest as temporary artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v7-checkpoint-s-20261103-822bc450-${{ github.run_id }}
          path: outputs/*
          if-no-files-found: ignore
          retention-days: 30
