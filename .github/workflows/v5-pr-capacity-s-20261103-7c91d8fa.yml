name: V5 P0 116-PR capacity and independent baseline receipt s-20261103-7c91d8fa

on:
  push:
    branches:
      - agent/s-20261103-7c91d8fa/optimization-001
    paths:
      - scripts/v5_pr_gate_bb9904e5.py
      - tests/test_v5_pr_capacity_s_20261103_7c91d8fa.py
      - .github/workflows/v5-pr-capacity-s-20261103-7c91d8fa.yml

permissions:
  contents: write

concurrency:
  group: v5-pr-capacity-s-20261103-7c91d8fa
  cancel-in-progress: false

jobs:
  check-and-record:
    if: github.repository == 'sstxww/reinforcement-learning' && github.ref == 'refs/heads/agent/s-20261103-7c91d8fa/optimization-001'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing test dependencies
        run: python -m pip install -e '.[test]'
      - name: Verify 116-PR pagination (no network)
        run: python -m pytest -q tests/test_v5_pr_capacity_s_20261103_7c91d8fa.py tests/test_v5_pr_gate_bb9904e5.py
      - name: Install exact pinned TavernGym
        run: bash scripts/bootstrap_engine.sh
      - name: Real complete eight-seat baseline check
        run: |
          python -m tavern_ai.canary --agent-id s-20261103-7c91d8fa --seed 93207 --policy baseline --receipt experiments/s-20261103-7c91d8fa/001-93207.json
          python -m tavern_ai.validate_receipt experiments/s-20261103-7c91d8fa/001-93207.json
      - name: Commit own real receipt only, never touch main
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'agent/s-20261103-7c91d8fa/optimization-001'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/s-20261103-7c91d8fa/001-93207.json
          if ! git diff --cached --quiet; then
            git commit -m 'evidence: actual pinned TavernGym eight-seat P0 audit canary'
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Retain real receipt even if push permission fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-p0-capacity-receipt-s-20261103-7c91d8fa
          path: experiments/s-20261103-7c91d8fa/001-93207.json
          if-no-files-found: ignore
          retention-days: 30
