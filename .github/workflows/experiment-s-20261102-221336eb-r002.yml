name: Tighter decision budget round 002 s-20261102-221336eb
on:
  push:
    branches:
      - 'agent/s-20261102-221336eb/optimization-002'
    paths:
      - '.github/workflows/experiment-s-20261102-221336eb-r002.yml'
      - 'research/sessions/s-20261102-221336eb/budget_experiment_r002.py'
      - 'tests/test_budget_221336eb_r002.py'
permissions:
  contents: write
concurrency:
  group: experiment-s-20261102-221336eb-round-002
  cancel-in-progress: false
jobs:
  paired-cap3-six-seeds:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install unit test dependencies
        run: python -m pip install -e '.[test]'
      - name: Validate all regression tests
        run: python -m pytest
      - name: Verify pinned real TavernGym installation
        run: |
          bash scripts/bootstrap_engine.sh
          python -m tavern_ai.contract
      - name: Execute six paired real full eight-player games
        run: |
          python research/sessions/s-20261102-221336eb/budget_experiment_r002.py
          python -m tavern_ai.validate_receipt experiments/s-20261102-221336eb/002-73201.json
      - name: Commit ONLY round-two own evidence
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = 'agent/s-20261102-221336eb/optimization-002'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/s-20261102-221336eb/baseline-002-*.json experiments/s-20261102-221336eb/002-*.json research/sessions/s-20261102-221336eb/round-002.md research/sessions/s-20261102-221336eb/evaluation-002.json research/sessions/s-20261102-221336eb/STATUS.md research/knowledge/proposals/s-20261102-221336eb-002.md
          git diff --cached --quiet && exit 0
          git commit -m 'results(s-20261102-221336eb): record second real cap-3 ablation'
          git push origin HEAD:agent/s-20261102-221336eb/optimization-002
      - name: Save time-limited evidence backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cap3-s-20261102-221336eb-r002-evidence
          path: |
            experiments/s-20261102-221336eb/002-*.json
            experiments/s-20261102-221336eb/baseline-002-*.json
            research/sessions/s-20261102-221336eb/*-002.*
          if-no-files-found: ignore
          retention-days: 30
