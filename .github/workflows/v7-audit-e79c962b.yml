name: V7 e79c962b read-only PR audit and genuine eight-seat smoke

on:
  push:
    branches: ['agent/s-20261103-e79c962b/optimization-001']

permissions:
  contents: read

concurrency:
  group: v7-s-20261103-e79c962b-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit-and-game:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static gate regressions (synthetic, not match evidence)
        run: |
          python -m pip install -e '.[test]'
          python -m pytest -q tests/test_v7_pr_head_audit_e79c962b.py
      - name: Pinned TavernGym 1.1.0 and engine patch
        run: bash scripts/bootstrap_engine.sh
      - name: Check pinned simulator
        run: python -m tavern_ai.contract
      - name: Authentic eight-seat baseline canary (not PPO training)
        run: |
          mkdir -p outputs
          python -m tavern_ai.canary \
            --agent-id s-20261103-e79c962b --policy baseline \
            --seed 99773 --receipt outputs/s-20261103-e79c962b-99773.json
          python -m tavern_ai.validate_receipt outputs/s-20261103-e79c962b-99773.json
      - name: Upload temporary real receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v7-audit-s-20261103-e79c962b-${{ github.run_id }}
          path: outputs/*.json
          if-no-files-found: ignore
          retention-days: 30
