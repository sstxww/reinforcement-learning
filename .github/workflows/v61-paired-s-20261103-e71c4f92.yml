name: V6.1 paired RAW 1408 vs baseline - s-20261103-e71c4f92
on:
  push:
    branches:
      - agent/s-20261103-e71c4f92/optimization-001

permissions:
  contents: read

concurrency:
  group: v61-s-20261103-e71c4f92-paired-99385
  cancel-in-progress: false

jobs:
  paired-real-games:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact pinned engine and test prerequisites
        run: |
          python -m pip install -e '.[train,test]'
          bash scripts/bootstrap_engine.sh
          python -m tavern_ai.contract
      - name: Existing repository regression suite
        run: python -m pytest -q
      - name: Own complete eight-seat scripted baseline (seed 99385)
        run: |
          python research/sessions/s-20261103-e71c4f92/paired_probe.py --mode baseline --out-dir reports/s-20261103-e71c4f92
          python -m tavern_ai.validate_receipt reports/s-20261103-e71c4f92/001-99385-baseline.json
      - name: Fail-closed immutable registered Release restore
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m tavern_ai.release_restore_entry \
            --model-id v5-s-20261102-68099929-1408-41428692617 \
            --out-dir checkpoints
      - name: Own full unassisted raw MaskablePPO match on SAME seed
        run: |
          python research/sessions/s-20261103-e71c4f92/paired_probe.py \
            --mode model --model checkpoints/model.zip --out-dir reports/s-20261103-e71c4f92
          python -m tavern_ai.validate_receipt reports/s-20261103-e71c4f92/001-99385-model.json
      - name: Strict genuine same-seed receipt comparison
        run: |
          python research/sessions/s-20261103-e71c4f92/paired_probe.py --mode pair --out-dir reports/s-20261103-e71c4f92
      - name: Preserve completed receipts or truthful partial-failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s-20261103-e71c4f92-paired-raw-99385
          path: reports/s-20261103-e71c4f92/
          if-no-files-found: warn
          retention-days: 30
