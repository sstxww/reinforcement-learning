name: V5 bounded Release recovery s-20261102-7be8a4d3
on:
  push:
    branches: [agent/s-20261102-7be8a4d3/optimization-001]
    paths:
      - '.github/workflows/v5-recovery-s-20261102-7be8a4d3.yml'
      - 'models/registry.json'
      - 'scripts/verify_release_candidate.py'
      - 'tests/test_release_candidate.py'
permissions:
  contents: write
concurrency:
  group: v5-recovery-s-20261102-7be8a4d3
  cancel-in-progress: false
jobs:
  verify-resume:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ github.token }}
      SESSION: s-20261102-7be8a4d3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests and registry guards
        run: |
          python -m pip install -e '.[train,test]'
          python -m pytest
          python scripts/verify_release_candidate.py
      - name: Install exact TavernGym build
        run: |
          bash scripts/bootstrap_engine.sh
          python -m tavern_ai.contract
      - name: True baseline full-game receipt
        run: |
          mkdir -p "experiments/$SESSION" "reports/$SESSION" checkpoints
          python -m tavern_ai.canary --agent-id "$SESSION" --policy baseline --seed 23002 --receipt "experiments/$SESSION/001-baseline-23002.json"
          python -m tavern_ai.validate_receipt "experiments/$SESSION/001-baseline-23002.json"
      - name: Download and verify 1280-step model Release
        run: |
          gh release download v2-learning-41413557445 --repo "$GITHUB_REPOSITORY" --pattern model.zip --pattern model.metadata.json --dir checkpoints
          python scripts/verify_release_candidate.py --candidate v2-learning-41413557445 --model checkpoints/model.zip --metadata checkpoints/model.metadata.json --out "reports/$SESSION/001-source-verified.json"
      - name: Original model real full game
        run: |
          python -m tavern_ai.canary --agent-id "$SESSION" --policy model --model checkpoints/model.zip --seed 23002 --receipt "experiments/$SESSION/001-original-23002.json"
          python -m tavern_ai.validate_receipt "experiments/$SESSION/001-original-23002.json"
      - name: Genuine bounded 128-step continued PPO training
        run: |
          python -m tavern_ai.train --steps 128 --seed 42 --resume checkpoints/model.zip --out checkpoints/resumed.zip
          python - <<'PY'
          import json,pathlib
          m=json.loads(pathlib.Path("checkpoints/resumed.metadata.json").read_text())
          assert int(m["total_timesteps"])>1280, m
          print("RESUME VERIFIED total_steps",m["total_timesteps"])
          PY
      - name: Resumed model real full game
        run: |
          python -m tavern_ai.canary --agent-id "$SESSION" --policy model --model checkpoints/resumed.zip --seed 23002 --receipt "experiments/$SESSION/001-resumed-23002.json"
          python -m tavern_ai.validate_receipt "experiments/$SESSION/001-resumed-23002.json"
      - name: Write real comparison and checkpoint provenance
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path("experiments/s-20261102-7be8a4d3")
          out=pathlib.Path("reports/s-20261102-7be8a4d3")
          games={name:json.loads((p/("001-"+name+"-23002.json")).read_text()) for name in ("baseline","original","resumed")}
          m=json.loads(pathlib.Path("checkpoints/resumed.metadata.json").read_text())
          source=json.loads((out/"001-source-verified.json").read_text())
          h=hashlib.sha256(pathlib.Path("checkpoints/resumed.zip").read_bytes()).hexdigest()
          d={"schema":1,"session_id":"s-20261102-7be8a4d3","type":"ONE-SEED RECOVERY SMOKE, not a valid strength comparison",
          "seed":23002,"engine_hash":"6d8712c93022ba11","source_release":"v2-learning-41413557445",
          "source_sha256":source["model_sha256"],"source_steps":source["verified_steps"],
          "resumed_sha256":h,"resumed_steps":m["total_timesteps"],"added_steps":m["total_timesteps"]-source["verified_steps"],
          "games":{name:{"rank":v["placements"][0],"decisions":v["decisions"],"complete":v["completed"],
          "fallback":False} for name,v in games.items()},"release_redownload_verified":False,
          "promotion":"NOT ELIGIBLE","note":"Heldout seeds and PPO behavior diagnosis required before additional training."}
          (out/"001-results.json").write_text(json.dumps(d,indent=2)+"\n")
          print(json.dumps(d))
          PY
      - name: Publish and independently re-download unpromoted checkpoint
        continue-on-error: true
        run: |
          tag="v5-recovery-s-20261102-7be8a4d3-$GITHUB_RUN_ID"
          gh release create "$tag" "checkpoints/resumed.zip#model.zip" "checkpoints/resumed.metadata.json#model.metadata.json" "reports/$SESSION/001-results.json#smoke-results.json" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "V5 unpromoted 128-step checkpoint $GITHUB_RUN_ID" --notes "Real one-seed smoke test and resume, NOT Champion or demonstrated improvement."
          mkdir -p checkpoints/redownload
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern model.zip --pattern model.metadata.json --dir checkpoints/redownload
          test "$(sha256sum checkpoints/resumed.zip | cut -d' ' -f1)" = "$(sha256sum checkpoints/redownload/model.zip | cut -d' ' -f1)"
          test "$(sha256sum checkpoints/resumed.metadata.json | cut -d' ' -f1)" = "$(sha256sum checkpoints/redownload/model.metadata.json | cut -d' ' -f1)"
          python - <<'PY'
          import json,pathlib,os
          p=pathlib.Path("reports/s-20261102-7be8a4d3/001-results.json")
          d=json.loads(p.read_text())
          d["release_redownload_verified"]=True
          d["release_tag"]="v5-recovery-s-20261102-7be8a4d3-"+os.environ["GITHUB_RUN_ID"]
          p.write_text(json.dumps(d,indent=2)+"\n")
          PY
      - name: Save only independent session receipts and compact metrics
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "experiments/$SESSION" "reports/$SESSION" 2>/dev/null || true
          if git diff --cached --quiet; then echo "No verified receipts available"; exit 0; fi
          git commit -m "results($SESSION): genuine match and model recovery evidence"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
      - name: Preserve available data even if training fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-recovery-s-20261102-7be8a4d3-${{ github.run_id }}
          path: |
            experiments/s-20261102-7be8a4d3/*.json
            reports/s-20261102-7be8a4d3/*.json
            checkpoints/resumed.zip
            checkpoints/resumed.metadata.json
          if-no-files-found: ignore
          retention-days: 30
