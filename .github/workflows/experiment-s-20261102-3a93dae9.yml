name: Free hero-power ablation s-20261102-3a93dae9

on:
  push:
    branches:
      - 'agent/s-20261102-3a93dae9/optimization-001'
    paths:
      - '.github/workflows/experiment-s-20261102-3a93dae9.yml'

permissions:
  contents: write

concurrency:
  group: hero-power-s-20261102-3a93dae9
  cancel-in-progress: false

jobs:
  paired-real-games:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install regression dependencies
        run: |
          python -m pip install -e '.[test]'
      - name: Full unit tests before engine experiment
        run: python -m pytest
      - name: Install genuine pinned TavernGym 1.1 and verified observe2 patch
        run: |
          bash scripts/bootstrap_engine.sh
          python -m tavern_ai.contract
      - name: Play paired genuine eight-seat full matches
        run: |
          python -m tavern_ai.hero_power_ablation_s20261102_3a93dae9 --seeds 18021 18022
          for SEED in 18021 18022; do
            python -m tavern_ai.validate_receipt "experiments/s-20261102-3a93dae9/001-$SEED.json"
            python -m tavern_ai.validate_receipt "experiments/s-20261102-3a93dae9/baseline-$SEED.json"
          done
      - name: Commit only session-owned real match evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "agent/s-20261102-3a93dae9/optimization-001"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/s-20261102-3a93dae9/ research/sessions/s-20261102-3a93dae9/paired-results.json
          if ! git diff --cached --quiet; then
            git commit -m "results(s-20261102-3a93dae9): record actual paired full games"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
      - name: Upload bounded session evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hero-power-s-20261102-3a93dae9-${{ github.run_id }}
          path: |
            experiments/s-20261102-3a93dae9/*.json
            research/sessions/s-20261102-3a93dae9/paired-results.json
          if-no-files-found: ignore
          retention-days: 30
