name: V5 s-20261102-001b7da1 independent full-match receipt

on:
  push:
    branches:
      - agent/s-20261102-001b7da1/optimization-001
    paths:
      - .github/workflows/v5-fullmatch-s-20261102-001b7da1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-eight-seat-receipt:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project test dependencies
        run: python -m pip install -e '.[test]'
      - name: Test checkpoint recovery guard
        run: python -m pytest tests/test_checkpoint_writer_s_20261102_001b7da1.py
      - name: Bootstrap pinned TavernGym
        run: bash scripts/bootstrap_engine.sh
      - name: Play an independent real eight-seat TavernGym game
        run: |
          mkdir -p outputs
          python -m tavern_ai.canary --agent-id s-20261102-001b7da1 --seed 91801 --policy baseline --receipt outputs/001-91801.json
          python -m tavern_ai.validate_receipt outputs/001-91801.json
      - name: Save genuine receipt as a GitHub Actions artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fullmatch-s-20261102-001b7da1
          path: outputs/001-91801.json
          if-no-files-found: ignore
          retention-days: 30
