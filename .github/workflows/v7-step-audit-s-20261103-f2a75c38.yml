name: V7 loaded-step audit s-20261103-f2a75c38

on:
  push:
    branches:
      - agent/s-20261103-f2a75c38/optimization-001
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v7-steps-s-20261103-f2a75c38-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline-and-real-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit regressions
        run: |
          python -m pip install -e '.[test]'
          python -m pytest -q tests/test_release_step_audit_s_f2a75c38.py tests/test_model_registry.py
      - name: Install pinned game engine
        run: bash scripts/bootstrap_engine.sh
      - name: Engine fingerprint
        run: python -m tavern_ai.contract
      - name: Actual eight-seat BASELINE game (not PPO)
        run: |
          mkdir -p outputs
          python -m tavern_ai.canary --agent-id s-20261103-f2a75c38 --seed 998237 --policy baseline --receipt outputs/001-998237.json
          python -m tavern_ai.validate_receipt outputs/001-998237.json
          cat outputs/001-998237.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v7-s-f2a75c38-match-${{ github.run_id }}
          path: outputs/*.json
          if-no-files-found: ignore
          retention-days: 30
