name: V5 verified 1536-step emergency 90-day Artifact custody (s-20261102-aaee3a59)

on:
  push:
    branches:
      - agent/s-20261102-aaee3a59/optimization-001
    paths:
      - .github/workflows/v5-artifact-90d-s-20261102-aaee3a59.yml

permissions:
  contents: read
  actions: read

jobs:
  preserve-matching-checkpoint-for-90-days:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED: 920bfa96370f0a40dcd7cae30e1652f323f27cb7516787e0375a4e8f1b046fc0
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve authentic trained weights from earlier exact run
        shell: bash
        run: |
          set -euo pipefail
          gh run download 41450695383 --repo "$GITHUB_REPOSITORY" \
            --name v5-resume-smoke-s-20261102-aaee3a59-41450695383 \
            --dir custody
          test -s custody/checkpoints/candidate/model.zip
          test -s custody/checkpoints/candidate/model.metadata.json
          echo "$EXPECTED  custody/checkpoints/candidate/model.zip" | sha256sum -c -
      - name: Standard-library verify optimizer ZIP, metadata, parent SHA, true match receipt
        run: |
          python - <<'PY'
          import hashlib, json, zipfile
          from pathlib import Path
          root = Path("custody/checkpoints/candidate")
          weights = root / "model.zip"
          meta = json.loads((root / "model.metadata.json").read_text(encoding="utf-8"))
          digest = hashlib.sha256(weights.read_bytes()).hexdigest()
          assert digest == meta["checkpoint_sha256"] == "920bfa96370f0a40dcd7cae30e1652f323f27cb7516787e0375a4e8f1b046fc0"
          assert meta["parent_checkpoint_sha256"] == "a73d24c68d238396136c9857ec4f341f39afc6562139ce9b693d282019db2632"
          assert meta["total_timesteps"] == 1536 and meta["algorithm"] == "MaskablePPO"
          with zipfile.ZipFile(weights) as z:
              assert {"data", "policy.pth", "policy.optimizer.pth"} <= set(z.namelist())
              assert z.testzip() is None
          match = json.loads(Path("experiments/s-20261102-aaee3a59/002-94433.json").read_text(encoding="utf-8"))
          assert match["completed"] and match["seed"] == 94433
          assert match["model_sha256"] == digest and match["placements"][0] == 8
          assert match["truncated_combats"] == 0 and not match["turn_limit_end"]
          Path("custody").joinpath("PROVENANCE.json").write_text(json.dumps({
              "schema":1,"research_only":True,"champion_promoted":False,
              "model_sha256":digest,"model_steps":1536,"source_run_id":41450695383,
              "original_artifact_id":13144484155,"parent_release_tag":"v5-s-20261102-68099929-1408-41428692617",
              "real_model_game_seed":94433,"real_model_rank":8,
              "release_403":True,"storage":"temporary_90_day_Actions_artifact_not_permanent"
          },indent=2)+"\n",encoding="utf-8")
          print("Real candidate model/metadata verified; preserving research-only binary")
          PY
      - name: Preserve exact checkpoint as max-retention 90-day fallback
        uses: actions/upload-artifact@v4
        with:
          name: verified-v5-1536-unpromoted-s-20261102-aaee3a59-${{ github.run_id }}
          path: |
            custody/checkpoints/candidate/model.zip
            custody/checkpoints/candidate/model.metadata.json
            custody/PROVENANCE.json
            experiments/s-20261102-aaee3a59/002-94433.json
          if-no-files-found: error
          retention-days: 90
