name: V5 canonical evaluator full-game proof s-20261102-2be229d5

on:
  push:
    branches:
      - agent/s-20261102-2be229d5/optimization-001
    paths:
      - .github/workflows/evaluator-v5-s-20261102-2be229d5.yml

permissions:
  contents: write

concurrency:
  group: v5-evaluator-2be229d5
  cancel-in-progress: false

jobs:
  evaluator-and-real-eight-seat-game:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Full offline test suite including new fail-closed evaluator tests
        run: |
          python -m pip install -e '.[test]'
          python -m pytest
      - name: Install exact pinned TavernGym and verify observation/action contract
        run: |
          bash scripts/bootstrap_engine.sh
          python -m tavern_ai.contract
      - name: Run ORIGINAL true eight-seat baseline game and strict receipt validation
        run: |
          python -m tavern_ai.canary --agent-id s-20261102-2be229d5 --seed 98021 --policy baseline --receipt experiments/s-20261102-2be229d5/001-98021.json
          python -m tavern_ai.validate_receipt experiments/s-20261102-2be229d5/001-98021.json
          python -m tavern_ai.evaluate --policy baseline --games 1 --start-seed 98022 --out reports/s-20261102-2be229d5/001-eval-baseline.json
      - name: Commit ONLY original own authentic receipt and baseline evaluation
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = "agent/s-20261102-2be229d5/optimization-001"
          test -f experiments/s-20261102-2be229d5/001-98021.json
          test -f reports/s-20261102-2be229d5/001-eval-baseline.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/s-20261102-2be229d5/001-98021.json reports/s-20261102-2be229d5/001-eval-baseline.json
          if ! git diff --cached --quiet; then
            git commit -m "test(v5): archive authentic standalone evaluator baseline evidence"
            git push origin HEAD:refs/heads/agent/s-20261102-2be229d5/optimization-001
          fi
      - name: Preserve own game evidence even on failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-evaluator-evidence-2be229d5
          path: |
            experiments/s-20261102-2be229d5/001-98021.json
            reports/s-20261102-2be229d5/001-eval-baseline.json
          if-no-files-found: ignore
          retention-days: 30
