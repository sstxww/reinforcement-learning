name: V5 true schema-2 Release PPO continuation s-20261103-db1986b8

on:
  push:
    branches: [agent/s-20261103-db1986b8/optimization-001]
    paths:
      - .github/workflows/v5-schema2-resume-s-20261103-db1986b8.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s-20261103-db1986b8-schema2-continuation
  cancel-in-progress: false

jobs:
  bounded-real-resume:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install genuine MaskablePPO dependencies and run tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[train,test]'
          python -m pytest
      - name: Install pinned real TavernGym simulator
        run: bash scripts/bootstrap_engine.sh
      - name: Restore authentic schema-2 1280-step immutable V2 Release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs
          python -m tavern_ai.release_restore_entry \
            --model-id v2-learning-41413557445 --out-dir checkpoints \
            | tee outputs/release-restore.json
          python - <<'PY'
          import json
          meta=json.load(open("checkpoints/model.metadata.json"))
          assert meta["schema"] == 2, "expected real schema-2 Release, not fallback"
          assert meta["total_timesteps"] == 1280
          print("Verified genuine 1280-step schema-2 checkpoint")
          PY
      - name: Genuine bounded PPO optimizer continuation 128 steps
        shell: bash
        run: |
          set -euo pipefail
          python -m tavern_ai.train --steps 128 --seed 42 \
            --resume checkpoints/model.zip --out checkpoints/schema2-child.zip \
            | tee outputs/training.json
          python -m tavern_ai.checkpoint_preflight \
            --model checkpoints/schema2-child.zip \
            --metadata checkpoints/schema2-child.metadata.json \
            --expected-sha256 "$(sha256sum checkpoints/schema2-child.zip | awk '{print $1}')" \
            --probe-inference | tee outputs/child-preflight.json
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          before=json.loads(Path("checkpoints/model.metadata.json").read_text())
          after=json.loads(Path("checkpoints/schema2-child.metadata.json").read_text())
          assert after["schema"]==before["schema"]==2
          assert after["compatibility"]==before["compatibility"]
          assert after["total_timesteps"]>before["total_timesteps"]
          assert after["increment_timesteps"]==after["total_timesteps"]-before["total_timesteps"]
          parent=hashlib.sha256(Path("checkpoints/model.zip").read_bytes()).hexdigest()
          assert after["parent_checkpoint_sha256"]==parent
          child=hashlib.sha256(Path("checkpoints/schema2-child.zip").read_bytes()).hexdigest()
          assert after["checkpoint_sha256"]==child
          evidence={"real_optimizer_continuation":True,"source_steps":before["total_timesteps"],
                    "child_steps":after["total_timesteps"],"added_steps":after["increment_timesteps"],
                    "child_sha256":child,"schema_2_preserved":True,
                    "raw_model_match_completed":False,"strength_gain_verified":False,
                    "champion_promoted":False}
          Path("outputs/continuity.json").write_text(json.dumps(evidence,indent=2))
          print(json.dumps(evidence))
          PY
      - name: Bounded raw candidate full-game attempt (no fallback, diagnostic)
        shell: bash
        run: |
          mkdir -p outputs
          set +e
          timeout 300s python -m tavern_ai.canary \
            --agent-id s-20261103-db1986b8 --seed 931282 \
            --policy model --model checkpoints/schema2-child.zip \
            --receipt outputs/001-raw-model-931282.json \
            > outputs/raw-model-game.log 2>&1
          status=$?
          set -e
          echo "{\"attempted\":true,\"exit_code\":$status,\"full_game_completed\":false,\"may_be_timeout\":$([ "$status" -eq 124 ] && echo true || echo false)}" > outputs/raw-model-status.json
          if [ "$status" -eq 0 ]; then
            python -m tavern_ai.validate_receipt outputs/001-raw-model-931282.json
            python - <<'PY'
          import json
          p="outputs/raw-model-status.json"
          x=json.load(open(p))
          x["full_game_completed"]=True
          json.dump(x,open(p,"w"),indent=2)
          PY
          else
            rm -f outputs/001-raw-model-931282.json
            echo "Raw PPO match incomplete; candidate remains UNPROMOTED and is NOT counted in placements."
          fi
      - name: Preserve unpromoted continuation and diagnostics (90-day Artifact only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s-20261103-db1986b8-schema2-128-real-resume
          path: |
            outputs/*
            checkpoints/schema2-child.zip
            checkpoints/schema2-child.metadata.json
          if-no-files-found: warn
          retention-days: 90
