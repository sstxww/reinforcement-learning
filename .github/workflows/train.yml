name: Train - durable registered Release continuation (manual only)

# Paused weekly bulk PPO: current unpromoted models still rank eighth.
# Opt-in only until model behavior and promotion gates are independently audited.
on:
  workflow_dispatch:
    inputs:
      steps:
        description: 'Incremental PPO steps (128..20000); not an automated promotion'
        required: true
        default: '128'
      eval_games:
        description: 'Exploratory paired real-game seeds (1..10)'
        required: true
        default: '3'
      model_id:
        description: 'Canonical registered Release ID or latest (unpromoted)'
        required: true
        default: 'latest'

permissions:
  contents: write

concurrency:
  group: tavern-ai-train-main
  cancel-in-progress: false

jobs:
  train:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install compatible MaskablePPO and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[train,test]'
      - name: Install and verify pinned TavernGym
        run: bash scripts/bootstrap_engine.sh
      - name: Fail-closed durable Release restore and CPU inference
        shell: bash
        env:
          SOURCE_MODEL: ${{ inputs.model_id }}
        run: |
          set -euo pipefail
          python -m tavern_ai.release_restore_entry --model-id "$SOURCE_MODEL" --out-dir checkpoints
          python -m tavern_ai.contract
      - name: Incremental MaskablePPO from verified source (never reset)
        shell: bash
        env:
          STEPS: ${{ inputs.steps }}
        run: |
          set -euo pipefail
          if [[ ! "$STEPS" =~ ^[0-9]+$ ]] || (( STEPS < 128 || STEPS > 20000 )); then
            echo 'steps must be 128..20000'; exit 2
          fi
          python -m tavern_ai.train --steps "$STEPS" --seed 42 \
            --resume checkpoints/model.zip --out checkpoints/candidate.zip
          test -s checkpoints/candidate.zip
          test -s checkpoints/candidate.metadata.json
      - name: Candidate itself plays a complete eight-seat game
        run: |
          python -m tavern_ai.canary --agent-id training-v5-main \
            --policy model --model checkpoints/candidate.zip --seed 43101 \
            --receipt artifacts/trained-canary.json
          python -m tavern_ai.validate_receipt artifacts/trained-canary.json
      - name: Paired held-out evaluation, not a Champion gate
        shell: bash
        env:
          EVAL_GAMES: ${{ inputs.eval_games }}
        run: |
          set -euo pipefail
          if [[ ! "$EVAL_GAMES" =~ ^[0-9]+$ ]] || (( EVAL_GAMES < 1 || EVAL_GAMES > 10 )); then
            echo 'eval_games must be 1..10'; exit 2
          fi
          python -m tavern_ai.evaluate --model checkpoints/candidate.zip \
            --games "$EVAL_GAMES" --start-seed 43110 --compare-baseline \
            --out artifacts/evaluation.json
      - name: Publish immutable unpromoted candidate only after all gates
        shell: bash
        run: |
          set -euo pipefail
          tag="v5-main-unpromoted-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p publish
          cp checkpoints/candidate.zip publish/model.zip
          cp checkpoints/candidate.metadata.json publish/model.metadata.json
          cp artifacts/trained-canary.json publish/trained-canary.json
          cp artifacts/evaluation.json publish/evaluation.json
          sha256sum publish/model.zip publish/model.metadata.json > publish/checksums.sha256
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --prerelease \
            --title "Unpromoted manual PPO continuation $tag" \
            --notes "Manual, bounded candidate only; no Champion/Best promotion. Main commit $GITHUB_SHA; run $GITHUB_RUN_ID. Real-game and paired-evaluation files attached." \
            publish/model.zip publish/model.metadata.json \
            publish/trained-canary.json publish/evaluation.json publish/checksums.sha256
          mkdir -p verification
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern 'model.zip' --pattern 'model.metadata.json' --dir verification
          cmp publish/model.zip verification/model.zip
          cmp publish/model.metadata.json verification/model.metadata.json
      - name: Supplementary diagnostics (not durable storage)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-main-unpromoted-${{ github.run_id }}
          path: |
            artifacts/*.json
            checkpoints/candidate.metadata.json
          if-no-files-found: ignore
          retention-days: 30
