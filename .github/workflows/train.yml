name: Train - gated Release continuation V5

on:
  workflow_dispatch:
    inputs:
      steps:
        description: 'Bounded PPO verification steps: 128 to 512'
        required: true
        default: '128'
      eval_games:
        description: 'Held-out full games: 1 to 10'
        required: true
        default: '3'
  schedule:
    - cron: '13 4 * * 1'

permissions:
  contents: write
  actions: read

concurrency:
  group: tavern-ai-train-main
  cancel-in-progress: false

jobs:
  train:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[train,test]'
      - name: Install pinned TavernGym 1.1 engine
        run: bash scripts/bootstrap_engine.sh
      - name: Choose canonical registered source, download durable Release and verify actual bytes
        shell: bash
        run: |
          mkdir -p checkpoints artifacts
          python scripts/v5_train_release_source_1e55e01e.py \
            | tee artifacts/source-selection.json
          MODEL_ID="$(python -c 'import json;print(json.load(open("artifacts/source-selection.json"))["model_id"])')"
          SHA="$(python -c 'import json;print(json.load(open("artifacts/source-selection.json"))["expected_sha256"])')"
          gh release download "$MODEL_ID" --repo "$GITHUB_REPOSITORY" \
            --pattern 'model.zip' --pattern 'model.metadata.json' --dir checkpoints
          test -s checkpoints/model.zip
          test -s checkpoints/model.metadata.json
          python -m tavern_ai.checkpoint_preflight \
            --model checkpoints/model.zip --metadata checkpoints/model.metadata.json \
            --expected-sha256 "$SHA" --probe-inference \
            | tee artifacts/source-preflight.json
      - name: Incremental Maskable PPO
        shell: bash
        env:
          STEPS: ${{ github.event.inputs.steps || '128' }}
        run: |
          if [[ ! "$STEPS" =~ ^[0-9]+$ ]] || (( STEPS < 128 || STEPS > 512 )); then
            echo 'steps must be 128..512 until validation gates permit more'; exit 2
          fi
          python -m tavern_ai.train --steps "$STEPS" --seed 42 \
            --resume checkpoints/model.zip --out checkpoints/challenger.zip \
            | tee artifacts/training-log.txt
          STEPS="$STEPS" python - <<'PY'
          import json,os
          old=json.load(open('checkpoints/model.metadata.json'))
          new=json.load(open('checkpoints/challenger.metadata.json'))
          assert old['engine']==new['engine']
          assert new['total_timesteps'] >= old['total_timesteps']+int(os.environ['STEPS'])
          print('Real PPO continuation:', old['total_timesteps'], '->', new['total_timesteps'])
          PY
      - name: Model plays full eight-seat game
        run: |
          python -m tavern_ai.canary --agent-id training-v1 \
            --policy model --model checkpoints/challenger.zip --seed 9001 \
            --receipt artifacts/trained-canary.json
          python -m tavern_ai.validate_receipt artifacts/trained-canary.json
      - name: Evaluate model on held-out seeds
        shell: bash
        env:
          EVAL_GAMES: ${{ github.event.inputs.eval_games || '3' }}
        run: |
          if [[ ! "$EVAL_GAMES" =~ ^[0-9]+$ ]] || (( EVAL_GAMES < 1 || EVAL_GAMES > 10 )); then
            echo 'eval_games must be 1..10'; exit 2
          fi
          python -m tavern_ai.evaluate --model checkpoints/challenger.zip \
            --compare-baseline --games "$EVAL_GAMES" --start-seed 24000 \
            --out artifacts/evaluation.json
      - name: Publish only game-completing unpromoted candidate as immutable Release
        shell: bash
        run: |
          TAG="v5-main-unpromoted-$GITHUB_RUN_ID"
          sha256sum checkpoints/challenger.zip checkpoints/challenger.metadata.json \
            > artifacts/checkpoint.sha256
          gh release create "$TAG" \
            checkpoints/challenger.zip#model.zip \
            checkpoints/challenger.metadata.json#model.metadata.json \
            artifacts/source-selection.json artifacts/source-preflight.json \
            artifacts/trained-canary.json artifacts/evaluation.json \
            artifacts/checkpoint.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "UNPROMOTED V5 bounded continuation $GITHUB_RUN_ID" \
            --notes "Only after verified source Release, real PPO continuation, strict model game and paired evaluation. No Champion promotion or proven competitive gain."
          mkdir -p artifacts/release-redownload
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'model.zip' --pattern 'model.metadata.json' --dir artifacts/release-redownload
          cmp checkpoints/challenger.zip artifacts/release-redownload/model.zip
          cmp checkpoints/challenger.metadata.json artifacts/release-redownload/model.metadata.json
      - name: Preserve short-lived audit artifact even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-main-verification-${{ github.run_id }}
          path: |
            checkpoints/challenger.zip
            checkpoints/challenger.metadata.json
            artifacts/source-selection.json
            artifacts/source-preflight.json
            artifacts/checkpoint.sha256
            artifacts/trained-canary.json
            artifacts/evaluation.json
          if-no-files-found: error
          retention-days: 30
