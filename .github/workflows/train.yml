name: Train - incremental V1

on:
  workflow_dispatch:
    inputs:
      steps:
        description: 'PPO steps: 128 to 20000'
        required: true
        default: '2048'
      eval_games:
        description: 'Held-out full games: 1 to 10'
        required: true
        default: '3'
      source_release:
        description: 'Optional explicit Release tag from verified models/release_asset_digests.json'
        required: false
        type: string
        default: ''
      allow_fresh_start:
        description: 'Explicitly allow random initialization ONLY when no prior checkpoint exists'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '13 4 * * 1'

permissions:
  contents: read
  actions: read

concurrency:
  group: tavern-ai-train-main
  cancel-in-progress: false

jobs:
  train:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[train,test]'
      - name: Install pinned TavernGym 1.1 engine
        run: bash scripts/bootstrap_engine.sh
      - name: Verify an explicit Release or fail-closed prior Artifact
        shell: bash
        env:
          RESUME_RELEASE: ${{ github.event.inputs.source_release || '' }}
          ALLOW_FRESH_START: ${{ github.event.inputs.allow_fresh_start || 'false' }}
        run: |
          set -euo pipefail
          mkdir -p checkpoints
          if [[ -n "$RESUME_RELEASE" ]]; then
            echo "Explicit Release recovery requested: $RESUME_RELEASE"
            gh release download "$RESUME_RELEASE" --repo "$GITHUB_REPOSITORY" \
              --pattern 'model.zip' --pattern 'model.metadata.json' --dir checkpoints
            python -m tavern_ai.release_asset_verifier \
              --model-id "$RESUME_RELEASE" --weights checkpoints/model.zip \
              --metadata checkpoints/model.metadata.json --check-load
          else
            RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/train.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].id // empty')"
            if [[ -n "$RUN_ID" ]]; then
              echo "Recovering prior main training Artifact from run $RUN_ID"
              gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
                --name v1-model --dir checkpoints || {
                  echo 'ERROR: previous Artifact unavailable; refusing silent random restart.' >&2
                  echo 'Choose a verified source_release manually, or opt into fresh_start explicitly after clearing the source.' >&2
                  exit 2
                }
            fi
          fi
          gate_args=(--checkpoint checkpoints/model.zip --metadata checkpoints/model.metadata.json)
          if [[ "$ALLOW_FRESH_START" == "true" ]]; then gate_args+=(--allow-fresh-start); fi
          python -m tavern_ai.continuation_gate "${gate_args[@]}"
          echo 'Model archive gate passed; optimizer continuation still requires real training.'
      - name: Incremental Maskable PPO
        shell: bash
        env:
          STEPS: ${{ github.event.inputs.steps || '2048' }}
        run: |
          if [[ ! "$STEPS" =~ ^[0-9]+$ ]] || (( STEPS < 128 || STEPS > 20000 )); then
            echo 'steps must be 128..20000'; exit 2
          fi
          args=(--steps "$STEPS" --seed 42 --out checkpoints/model.zip)
          if [[ -f checkpoints/model.zip ]]; then
            args+=(--resume checkpoints/model.zip)
          fi
          python -m tavern_ai.train "${args[@]}"
      - name: Model plays full eight-seat game
        run: |
          python -m tavern_ai.canary --agent-id training-v1 \
            --policy model --model checkpoints/model.zip --seed 9001 \
            --receipt artifacts/trained-canary.json
          python -m tavern_ai.validate_receipt artifacts/trained-canary.json
      - name: Evaluate model on held-out seeds
        shell: bash
        env:
          EVAL_GAMES: ${{ github.event.inputs.eval_games || '3' }}
        run: |
          if [[ ! "$EVAL_GAMES" =~ ^[0-9]+$ ]] || (( EVAL_GAMES < 1 || EVAL_GAMES > 10 )); then
            echo 'eval_games must be 1..10'; exit 2
          fi
          python -m tavern_ai.evaluate --model checkpoints/model.zip \
            --games "$EVAL_GAMES" --start-seed 24000 \
            --out artifacts/evaluation.json
      - name: Save resumable checkpoint and evidence
        uses: actions/upload-artifact@v4
        with:
          name: v1-model
          path: |
            checkpoints/model.zip
            checkpoints/model.metadata.json
            artifacts/trained-canary.json
            artifacts/evaluation.json
          if-no-files-found: error
          retention-days: 90
