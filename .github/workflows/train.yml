name: Train - durable registered Release continuation (manual only)

# Paused weekly bulk PPO: current unpromoted models still rank eighth.
# Opt-in only until model behavior and promotion gates are independently audited.
on:
  workflow_dispatch:
    inputs:
      steps:
        description: 'Incremental PPO steps (128..20000); not an automated promotion'
        required: true
        default: '128'
      eval_games:
        description: 'Exploratory paired real-game seeds (1..10)'
        required: true
        default: '3'
      model_id:
        description: 'Canonical registered Release ID or latest (unpromoted)'
        required: true
        default: 'latest'

permissions:
  contents: read

concurrency:
  group: tavern-ai-train-main
  cancel-in-progress: false

jobs:
  train:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install compatible MaskablePPO and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[train,test]'
      - name: Install and verify pinned TavernGym
        run: bash scripts/bootstrap_engine.sh
      - name: Fail-closed durable Release restore and CPU inference
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_MODEL: ${{ inputs.model_id }}
        run: |
          set -euo pipefail
          python -m tavern_ai.release_restore_entry --model-id "$SOURCE_MODEL" --out-dir checkpoints
          python -m tavern_ai.contract
      - name: Incremental MaskablePPO from verified source (never reset)
        shell: bash
        env:
          STEPS: ${{ inputs.steps }}
        run: |
          set -euo pipefail
          if [[ ! "$STEPS" =~ ^[0-9]+$ ]] || (( STEPS < 128 || STEPS > 20000 )); then
            echo 'steps must be 128..20000'; exit 2
          fi
          python -m tavern_ai.train --steps "$STEPS" --seed 42 \
            --resume checkpoints/model.zip --out checkpoints/candidate.zip
          test -s checkpoints/candidate.zip
          test -s checkpoints/candidate.metadata.json
      - name: Candidate itself plays a complete eight-seat game
        run: |
          python -m tavern_ai.canary --agent-id training-v5-main \
            --policy model --model checkpoints/candidate.zip --seed 43101 \
            --receipt artifacts/trained-canary.json
          python -m tavern_ai.validate_receipt artifacts/trained-canary.json
      - name: Paired held-out evaluation, not a Champion gate
        shell: bash
        env:
          EVAL_GAMES: ${{ inputs.eval_games }}
        run: |
          set -euo pipefail
          if [[ ! "$EVAL_GAMES" =~ ^[0-9]+$ ]] || (( EVAL_GAMES < 1 || EVAL_GAMES > 10 )); then
            echo 'eval_games must be 1..10'; exit 2
          fi
          python -m tavern_ai.evaluate --model checkpoints/candidate.zip \
            --games "$EVAL_GAMES" --start-seed 43110 --compare-baseline \
            --out artifacts/evaluation.json
      - name: Verify and stage candidate with immutable lineage
        shell: bash
        env:
          SOURCE_MODEL_ID: ${{ inputs.model_id }}
        run: |
          set -euo pipefail
          mkdir -p publish
          cp checkpoints/candidate.zip publish/model.zip
          cp checkpoints/candidate.metadata.json publish/model.metadata.json
          cp artifacts/trained-canary.json publish/trained-canary.json
          cp artifacts/evaluation.json publish/evaluation.json
          python -m tavern_ai.checkpoint_preflight \
            --model publish/model.zip --metadata publish/model.metadata.json \
            --expected-sha256 "$(sha256sum publish/model.zip | cut -d' ' -f1)" \
            --probe-inference
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          source=json.loads(Path("checkpoints/model.metadata.json").read_text())
          candidate=json.loads(Path("publish/model.metadata.json").read_text())
          receipt=json.loads(Path("publish/trained-canary.json").read_text())
          evaluation=json.loads(Path("publish/evaluation.json").read_text())
          digest=lambda path: hashlib.sha256(Path(path).read_bytes()).hexdigest()
          registry=json.loads(Path("models/registry.json").read_text())
          requested=os.environ["SOURCE_MODEL_ID"]
          source_id=registry["latest"]["id"] if requested=="latest" else requested
          matches=[row for row in registry["candidates"] if row["id"]==source_id]
          if len(matches)!=1 or digest("checkpoints/model.zip")!=matches[0]["checkpoint_sha256"]:
              raise ValueError("Source checkpoint is not the registered immutable Release")
          if candidate.get("engine")!=source.get("engine") or candidate.get("total_timesteps",0)<=source.get("total_timesteps",0):
              raise ValueError("PPO continuation did not preserve engine and increase steps")
          if receipt.get("policy")!="model" or receipt.get("model_sha256")!=digest("publish/model.zip") or receipt.get("completed") is not True:
              raise ValueError("Candidate full-game receipt is missing or mismatched")
          if receipt.get("turn_limit_end") or receipt.get("truncated_combats") or receipt.get("fallback_actions",0) or receipt.get("guard_forced_ends",0):
              raise ValueError("Guarded/truncated game is not raw model evidence")
          if evaluation.get("policy")!="model" or evaluation.get("model_evidence_mode")!="raw model; guard and fallback not permitted":
              raise ValueError("Candidate evaluation is not raw-model evidence")
          if evaluation["candidate"]["games"]<1 or evaluation["baseline"]["games"]!=evaluation["candidate"]["games"]:
              raise ValueError("Paired baseline receipts missing")
          lineage={"schema":1,"source_model_id":source_id,
                   "parent_sha256":digest("checkpoints/model.zip"),
                   "candidate_sha256":digest("publish/model.zip"),
                   "parent_steps":source["total_timesteps"],"candidate_steps":candidate["total_timesteps"],
                   "raw_model_game_verified":True,"champion_promoted":False}
          Path("publish/lineage.json").write_text(json.dumps(lineage,indent=2)+"\n")
          PY
          (cd publish && sha256sum model.zip model.metadata.json trained-canary.json evaluation.json lineage.json > checksums.sha256)
      - name: Hand off candidate to separately permissioned publisher
        uses: actions/upload-artifact@v4
        with:
          name: v5-main-verified-candidate-${{ github.run_id }}
          path: publish/
          if-no-files-found: error
          retention-days: 30
      - name: Supplementary diagnostics (not durable storage)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-main-unpromoted-${{ github.run_id }}
          path: |
            artifacts/*.json
            checkpoints/candidate.metadata.json
          if-no-files-found: ignore
          retention-days: 30

  publish:
    needs: train
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - name: Restore artifact from this exact run
        uses: actions/download-artifact@v4
        with:
          name: v5-main-verified-candidate-${{ github.run_id }}
          path: publish
      - name: Reverify and publish unpromoted candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd publish && sha256sum -c checksums.sha256)
          jq -e '(.policy == "model") and (.completed == true) and (.truncated_combats == 0) and (.turn_limit_end == false)' publish/trained-canary.json
          jq -e '(.policy == "model") and (.candidate.games >= 1) and (.baseline.games == .candidate.games) and (.model_evidence_mode == "raw model; guard and fallback not permitted")' publish/evaluation.json
          jq -e '(.champion_promoted == false) and (.candidate_steps > .parent_steps) and (.raw_model_game_verified == true)' publish/lineage.json
          tag="v5-main-unpromoted-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --prerelease \
            --title "Unpromoted main PPO continuation $tag" \
            --notes "Bounded manual candidate, no Champion promotion. Source run $GITHUB_RUN_ID. Lineage, raw model match and paired eval attached." \
            publish/model.zip publish/model.metadata.json publish/trained-canary.json \
            publish/evaluation.json publish/lineage.json publish/checksums.sha256
          mkdir -p verification
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern 'model.zip' --pattern 'model.metadata.json' --pattern 'lineage.json' \
            --dir verification
          cmp publish/model.zip verification/model.zip
          cmp publish/model.metadata.json verification/model.metadata.json
          cmp publish/lineage.json verification/lineage.json
