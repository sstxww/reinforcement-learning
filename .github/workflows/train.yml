name: Train - incremental V1

on:
  workflow_dispatch:
    inputs:
      steps:
        description: 'PPO steps: 128 to 20000'
        required: true
        default: '2048'
      eval_games:
        description: 'Held-out full games: 1 to 10'
        required: true
        default: '3'
      resume_release_tag:
        description: 'Optional registered, immutable unpromoted Release tag; fail closed if invalid'
        required: false
        default: ''
  schedule:
    - cron: '13 4 * * 1'

permissions:
  contents: write # publish verified, unpromoted checkpoints as durable Releases
  actions: read

concurrency:
  group: tavern-ai-train-main
  cancel-in-progress: false

jobs:
  train:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[train,test]'
      - name: Install pinned TavernGym 1.1 engine
        run: bash scripts/bootstrap_engine.sh
      - name: Restore last successful compatible model
        shell: bash
        env:
          RESUME_RELEASE_TAG: ${{ github.event.inputs.resume_release_tag || '' }}
        run: |
          set -euo pipefail
          mkdir -p checkpoints
          if [[ -n "$RESUME_RELEASE_TAG" ]]; then
            # Check declared immutable tag before accessing the remote or loading weights.
            python -m tavern_ai.release_resume_gate_6ed41c9a --tag "$RESUME_RELEASE_TAG"
            gh release download "$RESUME_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern model.zip --pattern model.metadata.json --dir checkpoints
            python -m tavern_ai.release_resume_gate_6ed41c9a --tag "$RESUME_RELEASE_TAG" \
              --model checkpoints/model.zip --metadata checkpoints/model.metadata.json
            echo "Verified explicit durable Release checkpoint; continuing PPO."
          else
            RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/train.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].id // empty' || true)"
            if [[ -n "$RUN_ID" ]]; then
              if gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name v1-model --dir checkpoints; then
                test -f checkpoints/model.zip
                test -f checkpoints/model.metadata.json
              else
                echo "No compatible prior artifact; initializing a fresh checkpoint"
                rm -f checkpoints/model.zip checkpoints/model.metadata.json
              fi
            else
              echo "First run; training from scratch"
            fi
          fi
      - name: Incremental Maskable PPO
        shell: bash
        env:
          STEPS: ${{ github.event.inputs.steps || '2048' }}
        run: |
          if [[ ! "$STEPS" =~ ^[0-9]+$ ]] || (( STEPS < 128 || STEPS > 20000 )); then
            echo 'steps must be 128..20000'; exit 2
          fi
          args=(--steps "$STEPS" --seed 42 --out checkpoints/model.zip)
          if [[ -f checkpoints/model.zip ]]; then
            args+=(--resume checkpoints/model.zip)
          fi
          python -m tavern_ai.train "${args[@]}"
      - name: Model plays full eight-seat game
        run: |
          python -m tavern_ai.canary --agent-id training-v1 \
            --policy model --model checkpoints/model.zip --seed 9001 \
            --receipt artifacts/trained-canary.json
          python -m tavern_ai.validate_receipt artifacts/trained-canary.json
      - name: Evaluate model on held-out seeds
        shell: bash
        env:
          EVAL_GAMES: ${{ github.event.inputs.eval_games || '3' }}
        run: |
          if [[ ! "$EVAL_GAMES" =~ ^[0-9]+$ ]] || (( EVAL_GAMES < 1 || EVAL_GAMES > 10 )); then
            echo 'eval_games must be 1..10'; exit 2
          fi
          python -m tavern_ai.evaluate --model checkpoints/model.zip \
            --games "$EVAL_GAMES" --start-seed 24000 \
            --out artifacts/evaluation.json
      - name: Save resumable checkpoint and evidence
        uses: actions/upload-artifact@v4
        with:
          name: v1-model
          path: |
            checkpoints/model.zip
            checkpoints/model.metadata.json
            artifacts/trained-canary.json
            artifacts/evaluation.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish durable unpromoted Release and verify downloaded bytes
        shell: bash
        run: |
          set -euo pipefail
          TAG="v5-main-${GITHUB_RUN_ID}"
          sha256sum checkpoints/model.zip > artifacts/checkpoint.sha256
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease \
            --title "Unpromoted main training checkpoint $TAG" \
            --notes "Experimental only; no Champion promotion. Source run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. The full game and evaluation passed before publication." \
            checkpoints/model.zip checkpoints/model.metadata.json \
            artifacts/trained-canary.json artifacts/evaluation.json artifacts/checkpoint.sha256
          mkdir -p "$RUNNER_TEMP/release-roundtrip"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern model.zip --pattern model.metadata.json \
            --dir "$RUNNER_TEMP/release-roundtrip"
          cmp checkpoints/model.zip "$RUNNER_TEMP/release-roundtrip/model.zip"
          cmp checkpoints/model.metadata.json "$RUNNER_TEMP/release-roundtrip/model.metadata.json"
          python -m tavern_ai.checkpoint_preflight \
            --model "$RUNNER_TEMP/release-roundtrip/model.zip" \
            --metadata "$RUNNER_TEMP/release-roundtrip/model.metadata.json" \
            --expected-sha256 "$(cut -d' ' -f1 artifacts/checkpoint.sha256)" \
            --probe-inference
