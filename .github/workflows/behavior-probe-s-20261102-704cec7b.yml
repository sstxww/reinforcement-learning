name: Rank-eight legal-opportunity probe s-20261102-704cec7b
on:
  push:
    branches:
      - 'agent/s-20261102-704cec7b/optimization-001'
    paths:
      - 'tavern_ai/behavior_probe_704cec7b.py'
      - 'tests/test_behavior_probe_704cec7b.py'
      - '.github/workflows/behavior-probe-s-20261102-704cec7b.yml'

permissions:
  contents: write

concurrency:
  group: behavior-probe-s-20261102-704cec7b
  cancel-in-progress: false

jobs:
  genuine-v2-model-telemetry:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[train,test]'
      - name: Run behavior and model registry regression tests
        run: |
          python -m pytest tests/test_behavior_probe_704cec7b.py tests/test_model_registry.py
      - name: Bootstrap exact pinned TavernGym engine
        run: bash scripts/bootstrap_engine.sh
      - name: Verify durable V2 checkpoint and model runtime
        run: |
          mkdir -p checkpoints
          gh release download v2-learning-41413557445 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern model.zip --pattern model.metadata.json --dir checkpoints
          python -m tavern_ai.model_registry \
            --model-id v2-learning-41413557445 --asset checkpoints/model.zip
      - name: Two independent real eight-seat V2 model games and legal-buy traces
        run: |
          for seed in 88201 88202; do
            python -m tavern_ai.behavior_probe_704cec7b \
              --model checkpoints/model.zip \
              --expected-sha256 73bde2666426cecce39f135980a897bb2cd4a7d70783ba04c9c0d29477a6664a \
              --seed "$seed" \
              --receipt "experiments/s-20261102-704cec7b/002-$seed.json"
            python -m tavern_ai.validate_receipt "experiments/s-20261102-704cec7b/002-$seed.json"
          done
      - name: Save bounded authentic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rank-eight-telemetry-s-20261102-704cec7b
          path: experiments/s-20261102-704cec7b/002-*.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Commit successful real model-game receipts to isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/s-20261102-704cec7b/002-*.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "evidence: save genuine rank-eight model legal-opportunity traces"
          test "$GITHUB_REF_NAME" = "agent/s-20261102-704cec7b/optimization-001"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
