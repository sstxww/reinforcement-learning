name: V5 P1-P2 bounded Release resume and raw model diagnostic s-20261103-4fd17801

# Isolated one-shot evidence workflow. No secrets, no autonomous branch writes.
on:
  push:
    branches:
      - agent/s-20261103-4fd17801/optimization-001
    paths:
      - .github/workflows/v5-smoke-s-20261103-4fd17801.yml

permissions:
  contents: read

concurrency:
  group: v5-smoke-s-20261103-4fd17801
  cancel-in-progress: false

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned training and test dependencies
        run: |
          python -m pip install -e '.[train,test]'
          python -m pytest -q tests/test_release_restore_entry_fe461d0d.py tests/test_checkpoint_writer_s_20261102_001b7da1.py tests/test_train_resume_s_20261102_001b7da1.py
      - name: Install pinned TavernGym
        run: bash scripts/bootstrap_engine.sh
      - name: Restore indexed experimental Release and independently preflight model
        run: |
          python -m tavern_ai.release_restore_entry --model-id latest --out-dir checkpoints
          python -m tavern_ai.contract
          sha256sum checkpoints/model.zip
          cat checkpoints/model.metadata.json
      - name: Full eight-seat baseline and unguarded source PPO on identical seed
        run: |
          mkdir -p experiments/s-20261103-4fd17801
          python -m tavern_ai.buy_opportunity_68099929 --agent-id s-20261103-4fd17801 --seed 97303 --policy baseline --out experiments/s-20261103-4fd17801/001-baseline-97303.json
          python -m tavern_ai.buy_opportunity_68099929 --agent-id s-20261103-4fd17801 --seed 97303 --policy model --model checkpoints/model.zip --out experiments/s-20261103-4fd17801/002-source-model-97303.json
          python -m tavern_ai.validate_receipt experiments/s-20261103-4fd17801/001-baseline-97303.json
          python -m tavern_ai.validate_receipt experiments/s-20261103-4fd17801/002-source-model-97303.json
          cat experiments/s-20261103-4fd17801/001-baseline-97303.json
          cat experiments/s-20261103-4fd17801/002-source-model-97303.json
      - name: 128-step actual PPO continuation smoke, SHA-bound lineage
        run: |
          mkdir -p checkpoints
          python -m tavern_ai.train --steps 128 --seed 97303 --resume checkpoints/model.zip --out checkpoints/candidate.zip
          sha256sum checkpoints/candidate.zip
          cat checkpoints/candidate.metadata.json
      - name: Candidate alone completes genuine eight-seat match without fallback
        run: |
          python -m tavern_ai.canary --agent-id s-20261103-4fd17801 --seed 97304 --policy model --model checkpoints/candidate.zip --receipt experiments/s-20261103-4fd17801/003-candidate-97304.json
          python -m tavern_ai.validate_receipt experiments/s-20261103-4fd17801/003-candidate-97304.json
          cat experiments/s-20261103-4fd17801/003-candidate-97304.json
      - name: Upload original receipts and temporary candidate for independent verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-p1-p2-s-20261103-4fd17801-${{ github.run_id }}
          path: |
            experiments/s-20261103-4fd17801/*.json
            checkpoints/model.metadata.json
            checkpoints/candidate.metadata.json
            checkpoints/candidate.zip
          if-no-files-found: ignore
          retention-days: 14
