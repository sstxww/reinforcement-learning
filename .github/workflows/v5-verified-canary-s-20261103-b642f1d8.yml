name: V5 P1 integrity regression and authentic eight-seat canary s-20261103-b642f1d8

on:
  push:
    branches:
      - 'agent/s-20261103-b642f1d8/optimization-001'
    paths:
      - '.github/workflows/v5-verified-canary-s-20261103-b642f1d8.yml'

permissions:
  contents: write

concurrency:
  group: v5-real-game-s-20261103-b642f1d8
  cancel-in-progress: false

jobs:
  independent-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ github.token }}
      SESSION_ID: 's-20261103-b642f1d8'
      MODEL_SHA256: 'a73d24c68d238396136c9857ec4f341f39afc6562139ce9b693d282019db2632'
      MODEL_TAG: 'v5-s-20261102-68099929-1408-41428692617'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test and CPU model dependencies
        run: python -m pip install -e '.[train,test]'
      - name: Verify focused fail-closed resume regression
        run: python -m pytest -q tests/test_train_resume_provenance_s_20261103_b642f1d8.py
      - name: Install pinned TavernGym and verify contract
        run: |
          bash scripts/bootstrap_engine.sh
          python -m tavern_ai.contract
      - name: Play own real complete eight-seat baseline match
        run: |
          mkdir -p "experiments/$SESSION_ID"
          python -m tavern_ai.canary --agent-id "$SESSION_ID" --policy baseline --seed 99383 --receipt "experiments/$SESSION_ID/001-99383.json"
          python -m tavern_ai.validate_receipt "experiments/$SESSION_ID/001-99383.json"
      - name: Commit only validated authentic own receipt to own isolated branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "experiments/$SESSION_ID/001-99383.json"
          git commit -m 'evidence: authentic eight-seat baseline seed 99383 [skip ci]'
          git fetch origin "agent/$SESSION_ID/optimization-001"
          git rebase "origin/agent/$SESSION_ID/optimization-001"
          git push origin HEAD:"agent/$SESSION_ID/optimization-001"
      - name: Verify persisted V5 Release and run bounded raw-policy behavior audit
        continue-on-error: true
        run: |
          mkdir -p "reports/$SESSION_ID" downloaded
          gh release download "$MODEL_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'model.*' --dir downloaded
          python -m tavern_ai.checkpoint_preflight --model downloaded/model.zip --metadata downloaded/model.metadata.json --expected-sha256 "$MODEL_SHA256" --probe-inference > "reports/$SESSION_ID/001-release-preflight.json"
          python -m tavern_ai.model_gate_s9450775f --model downloaded/model.zip --metadata downloaded/model.metadata.json --expected-sha256 "$MODEL_SHA256" --seed 99384 --max-decisions 600 --out "reports/$SESSION_ID/001-raw-model-diagnostic-99384.json"
      - name: Archive genuine evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-s-20261103-b642f1d8-real-evidence
          path: |
            experiments/s-20261103-b642f1d8/001-99383.json
            reports/s-20261103-b642f1d8/*.json
          if-no-files-found: warn
          retention-days: 30
