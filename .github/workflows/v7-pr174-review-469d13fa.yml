name: V7 independent PR174 review real-game gate s-20261103-469d13fa
on:
  push:
    branches:
      - 'agent/s-20261103-469d13fa/optimization-001'
    paths:
      - '.github/workflows/v7-pr174-review-469d13fa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v7-pr174-review-469d13fa
  cancel-in-progress: false
jobs:
  independent-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install unit test tools
        run: python -m pip install -e '.[test]'
      - name: Mainline static and unit regression
        run: |
          python -m pytest -q
          python scripts/check_pr_evidence.py
      - name: Verify pinned real TavernGym
        run: bash scripts/bootstrap_engine.sh
      - name: Inspect engine contract
        run: python -m tavern_ai.contract
      - name: Complete independent eight-seat BASELINE game
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs
          python -m tavern_ai.canary --agent-id s-20261103-469d13fa --seed 99517 --policy baseline --receipt outputs/001-99517-baseline.json
          python -m tavern_ai.validate_receipt outputs/001-99517-baseline.json
      - name: Preserve original evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v7-pr174-review-469d13fa-${{ github.run_id }}
          path: outputs/*.json
          if-no-files-found: ignore
          retention-days: 30
