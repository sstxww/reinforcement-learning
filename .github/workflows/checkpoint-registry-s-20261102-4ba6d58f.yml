name: Checkpoint registry audit s-20261102-4ba6d58f
on:
  push:
    branches:
      - 'agent/s-20261102-4ba6d58f/optimization-001'
    paths:
      - 'models/**'
      - 'tavern_ai/checkpoint_registry.py'
      - 'tests/test_checkpoint_registry.py'
      - '.github/workflows/checkpoint-registry-s-20261102-4ba6d58f.yml'
permissions:
  contents: read
concurrency:
  group: checkpoint-registry-s-20261102-4ba6d58f
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests and model registry audit
        run: |
          python -m pip install -e '.[test]'
          python -m pytest tests/test_checkpoint_registry.py
          python -m tavern_ai.checkpoint_registry --registry models/registry.json
      - name: Bootstrap pinned real TavernGym
        run: bash scripts/bootstrap_engine.sh
      - name: Real baseline-controlled eight-seat engineering canary (NOT PPO)
        run: |
          python -m tavern_ai.canary --agent-id s-20261102-4ba6d58f \
            --seed 49123 --policy baseline \
            --receipt artifacts/registry-canary-49123.json
          python -m tavern_ai.validate_receipt artifacts/registry-canary-49123.json
      - name: Preserve genuine canary receipt
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint-registry-canary-s-20261102-4ba6d58f
          path: artifacts/registry-canary-49123.json
          if-no-files-found: error
          retention-days: 30
