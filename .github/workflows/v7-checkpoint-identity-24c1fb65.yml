name: V7 checkpoint identity one-shot s-20261103-24c1fb65
on:
  push:
    branches:
      - agent/s-20261103-24c1fb65/optimization-001
    paths:
      - tavern_ai/evaluate.py
      - tests/test_eval_receipt_gate_s_1aff5449.py
      - tests/test_v7_checkpoint_identity_24c1fb65.py
      - .github/workflows/v7-checkpoint-identity-24c1fb65.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v7-checkpoint-identity-24c1fb65
  cancel-in-progress: false
jobs:
  identity-and-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tests
        run: python -m pip install -e '.[test]'
      - name: Regression tests
        run: python -m pytest -q tests/test_v7_checkpoint_identity_24c1fb65.py tests/test_eval_receipt_gate_s_1aff5449.py
      - name: Pinned engine for genuine baseline eight-seat match
        run: bash scripts/bootstrap_engine.sh
      - name: Generate and validate own baseline receipt
        run: |
          python -m tavern_ai.canary --agent-id s-20261103-24c1fb65 --seed 97551 --policy baseline --receipt experiments/s-20261103-24c1fb65/001-97551-baseline.json
          python -m tavern_ai.validate_receipt experiments/s-20261103-24c1fb65/001-97551-baseline.json
          cat experiments/s-20261103-24c1fb65/001-97551-baseline.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v7-checkpoint-identity-s-20261103-24c1fb65-${{ github.run_id }}
          path: experiments/s-20261103-24c1fb65/*.json
          if-no-files-found: ignore
          retention-days: 30
