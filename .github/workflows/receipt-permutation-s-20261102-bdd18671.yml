name: V5 strict eight-seat receipt integration s-20261102-bdd18671
# Rerun after expected legacy duplicate-rank regression was updated.

on:
  push:
    branches:
      - agent/s-20261102-bdd18671/optimization-001
    paths:
      - .github/workflows/receipt-permutation-s-20261102-bdd18671.yml

permissions:
  contents: write

concurrency:
  group: strict-receipt-s-20261102-bdd18671
  cancel-in-progress: false

jobs:
  independent-receipt-proof:
    if: github.repository == 'sstxww/reinforcement-learning'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline regression dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Test real-path receipt validator and all unit regressions
        run: python -m pytest
      - name: Bootstrap exact pinned TavernGym engine
        run: bash scripts/bootstrap_engine.sh
      - name: Run one genuine complete eight-seat game
        run: |
          python -m tavern_ai.contract
          python -m tavern_ai.canary \
            --agent-id s-20261102-bdd18671 --seed 97621 --policy baseline \
            --receipt experiments/s-20261102-bdd18671/001-97621.json
          python -m tavern_ai.validate_receipt experiments/s-20261102-bdd18671/001-97621.json
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("experiments/s-20261102-bdd18671/001-97621.json")
          row = json.loads(path.read_text())
          assert row["completed"] is True and sorted(row["placements"]) == list(range(1, 9))
          assert row["seed"] == 97621 and row["policy"] == "baseline"
          assert row["truncated_combats"] == 0 and row["turn_limit_end"] is False
          print("Independent genuine game complete; rank =", row["placements"][0])
          PY
      - name: Commit only session-owned real-game receipt
        env:
          OWN_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- experiments/s-20261102-bdd18671/001-97621.json
          if ! git diff --cached --quiet; then
            git commit -m "evidence(s-20261102-bdd18671): preserve genuine completed TavernGym seed 97621"
            git push origin "HEAD:refs/heads/$OWN_BRANCH"
          fi
      - name: Preserve run output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strict-receipt-s-20261102-bdd18671-${{ github.run_id }}
          path: experiments/s-20261102-bdd18671/001-97621.json
          if-no-files-found: ignore
          retention-days: 30
