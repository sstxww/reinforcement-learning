name: Experiment s-20261102-1b82df52 - isolated log-scale PPO

on:
  push:
    branches:
      - 'agent/s-20261102-1b82df52/optimization-001'
    paths:
      - 'tavern_ai/log_extractor.py'
      - 'tavern_ai/experiment_logscale.py'
      - 'tests/test_logscale_extractor.py'
      - '.github/workflows/experiment-s-20261102-1b82df52.yml'

permissions:
  contents: write

concurrency:
  group: logscale-s-20261102-1b82df52
  cancel-in-progress: false

jobs:
  paired-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated experiment dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[train,test]'
      - name: Install pinned real TavernGym simulator
        run: bash scripts/bootstrap_engine.sh
      - name: Verify observation contract and isolated extractor tests
        run: |
          python -m tavern_ai.contract
          python -m pytest tests/test_logscale_extractor.py
      - name: Real PPO training and six complete eight-seat matches
        shell: bash
        run: |
          timeout --signal=TERM --kill-after=15s 55m python -m tavern_ai.experiment_logscale \
            --session-id 's-20261102-1b82df52' --steps 256 \
            --train-seed 71002 --eval-seed-start 32001 --games 3
          python -m tavern_ai.validate_receipt 'experiments/s-20261102-1b82df52/001-32001.json'
          python - <<'PY'
          import json
          from pathlib import Path
          from tavern_ai.validate_receipt import validate
          root = Path('experiments/s-20261102-1b82df52')
          assert len(list(root.glob('*.json'))) == 7
          for p in root.glob('*.json'):
              if p.name != 'comparison.json':
                  validate(json.loads(p.read_text()))
          print('Independent real-engine receipts validated')
          PY
      - name: Upload session-only checkpoint and raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logscale-s-20261102-1b82df52-${{ github.run_id }}
          path: |
            checkpoints/s-20261102-1b82df52/*.zip
            checkpoints/s-20261102-1b82df52/*.metadata.json
            experiments/s-20261102-1b82df52/*.json
          if-no-files-found: warn
          retention-days: 60
      - name: Commit verified JSON receipts only to own branch
        if: success()
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = 'agent/s-20261102-1b82df52/optimization-001'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'experiments/s-20261102-1b82df52/'
          git commit -m '[skip ci] evidence: s-20261102-1b82df52 paired real-engine pilot'
          git push origin "HEAD:$GITHUB_REF_NAME"
