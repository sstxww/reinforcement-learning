name: V7 s-20261103-2ef2eeca independent serial-gate canary

on:
  push:
    branches: ['agent/s-20261103-2ef2eeca/optimization-001']
    paths:
      - 'scripts/v7_integrate.py'
      - 'tests/test_v7_integrate_s_20261103_2ef2eeca.py'
      - '.github/workflows/v7-serial-canary-s-20261103-2ef2eeca.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v7-s-20261103-2ef2eeca-canary-${{ github.ref }}
  cancel-in-progress: false

jobs:
  independent-game-and-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded test dependencies
        run: python -m pip install -e '.[test]'
      - name: Validate integration safety fixtures
        run: python -m pytest -q tests/test_v7_integrate_s_20261103_2ef2eeca.py
      - name: Install and validate pinned TavernGym
        run: |
          bash scripts/bootstrap_engine.sh
          python -m tavern_ai.contract
      - name: Original real eight-seat baseline game (NOT model skill)
        run: |
          mkdir -p outputs
          python -m tavern_ai.canary --agent-id s-20261103-2ef2eeca --seed 982134 --policy baseline --receipt outputs/001-982134.json
          python -m tavern_ai.validate_receipt outputs/001-982134.json
      - name: Preserve original receipt artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v7-s-20261103-2ef2eeca-game-${{ github.run_id }}
          path: outputs/001-982134.json
          if-no-files-found: ignore
          retention-days: 30
