name: V5 paired gate own-game s-20261102-a280d7eb

on:
  push:
    branches:
      - agent/s-20261102-a280d7eb/optimization-001
    paths:
      - .github/workflows/v5-paired-gate-a280d7eb.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v5-paired-gate-s-20261102-a280d7eb
  cancel-in-progress: false

jobs:
  paired-gate-and-real-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Strict seed/seat/fallback evaluation regressions
        run: python -m pytest tests/test_paired_rank_gate_a280d7eb.py
      - name: Install pinned real TavernGym
        run: bash scripts/bootstrap_engine.sh
      - name: Confirm exact real-engine contract
        run: python -m tavern_ai.contract
      - name: Genuine complete eight-seat baseline game, no model claims
        run: |
          python -m tavern_ai.canary --agent-id s-20261102-a280d7eb --seed 95031 --policy baseline --receipt outputs/001-95031.json
          python -m tavern_ai.validate_receipt outputs/001-95031.json
          python -c "import json; from tavern_ai.receipt_integrity import validate_integrity; validate_integrity(json.load(open('outputs/001-95031.json')))"
      - name: Preserve real game receipt for manual review/commit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-a280d7eb-real-baseline-${{ github.run_id }}
          path: outputs/001-95031.json
          if-no-files-found: ignore
          retention-days: 30
