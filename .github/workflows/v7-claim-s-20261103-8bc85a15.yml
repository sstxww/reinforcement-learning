name: V7 claim-CAS and genuine eight-seat canary s-20261103-8bc85a15

on:
  push:
    branches:
      - 'agent/s-20261103-8bc85a15/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v7-claim-8bc85a15-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-claim-and-real-game:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project regression dependencies
        run: python -m pip install -e '.[test]'
      - name: Verify race-safe task claim without GitHub write token
        run: python -m pytest tests/test_v7_atomic_claim_8bc85a15.py -q
      - name: Install pinned TavernGym and verify engine contract
        run: |
          bash scripts/bootstrap_engine.sh
          python -m tavern_ai.contract
      - name: Execute genuine completed eight-seat baseline match
        run: |
          python -m tavern_ai.canary \
            --agent-id s-20261103-8bc85a15 --seed 99387 --policy baseline \
            --receipt experiments/s-20261103-8bc85a15/001-99387.json
          python -m tavern_ai.validate_receipt experiments/s-20261103-8bc85a15/001-99387.json
      - name: Preserve genuine result for source verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v7-claim-8bc85a15-${{ github.run_id }}
          path: experiments/s-20261103-8bc85a15/*.json
          if-no-files-found: ignore
          retention-days: 30
