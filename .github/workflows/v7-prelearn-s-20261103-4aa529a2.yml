name: V7 session s-20261103-4aa529a2 prelearn + genuine baseline
on:
  push:
    branches:
      - agent/s-20261103-4aa529a2/optimization-001
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v7-s-20261103-4aa529a2-prelearn
  cancel-in-progress: false

jobs:
  prelearn-and-real-match:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install -e '.[test]'
          python -m pytest -q tests/test_prelearn_schema2_s_20261103_4aa529a2.py tests/test_train_schema2_resume_db1986b8.py
      - name: Install pinned TavernGym
        run: bash scripts/bootstrap_engine.sh
      - name: Genuine eight-seat baseline regression (not a PPO strength claim)
        run: |
          python -m tavern_ai.contract
          python -m tavern_ai.canary --agent-id s-20261103-4aa529a2 --seed 94837 --policy baseline --receipt outputs/s-20261103-4aa529a2-baseline-94837.json
          python -m tavern_ai.validate_receipt outputs/s-20261103-4aa529a2-baseline-94837.json
      - name: Preserve authentic baseline receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v7-s-20261103-4aa529a2-match
          path: outputs/*.json
          if-no-files-found: ignore
          retention-days: 30
