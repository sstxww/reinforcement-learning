name: V7 isolated trigger budget audit and real eight-seat match 8e49e70d

on:
  push:
    branches:
      - agent/s-20261103-8e49e70d/optimization-001
    paths:
      - scripts/v7_workflow_trigger_scope_8e49e70d.py
      - tests/test_v7_workflow_trigger_scope_8e49e70d.py
      - .github/workflows/trigger-scope-s-20261103-8e49e70d.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v7-trigger-scope-s-20261103-8e49e70d
  cancel-in-progress: false

jobs:
  scope-audit-and-real-eight-seat:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated test dependencies
        run: python -m pip install -e '.[test]'
      - name: Check scoped trigger regression and scan actual repository
        run: |
          python -m pytest -q tests/test_v7_workflow_trigger_scope_8e49e70d.py
          python scripts/v7_workflow_trigger_scope_8e49e70d.py --root . --out reports/s-20261103-8e49e70d/001-trigger-scope.json
      - name: Install genuine pinned TavernGym and confirm contract
        run: |
          bash scripts/bootstrap_engine.sh
          python -m tavern_ai.contract
      - name: Play unique real full eight-seat baseline seed 99783
        run: |
          python -m tavern_ai.canary --agent-id s-20261103-8e49e70d --policy baseline --seed 99783 --receipt experiments/s-20261103-8e49e70d/001-99783.json
          python -m tavern_ai.validate_receipt experiments/s-20261103-8e49e70d/001-99783.json
          echo BEGIN_ORIGINAL_EIGHT_SEAT_RECEIPT
          cat experiments/s-20261103-8e49e70d/001-99783.json
          echo END_ORIGINAL_EIGHT_SEAT_RECEIPT
      - name: Preserve truthful scoped audit and original real match
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v7-trigger-scope-8e49e70d
          path: |
            reports/s-20261103-8e49e70d/*.json
            experiments/s-20261103-8e49e70d/*.json
          if-no-files-found: ignore
          retention-days: 30
