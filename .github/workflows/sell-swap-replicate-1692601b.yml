name: Sell-swap independent R002 s-20261102-1692601b
on:
  push:
    branches: ['agent/s-20261102-1692601b/optimization-002']
    paths:
      - 'tavern_ai/replicate_1692601b.py'
      - 'tests/test_replicate_1692601b.py'
      - '.github/workflows/sell-swap-replicate-1692601b.yml'
permissions:
  contents: write
concurrency:
  group: sell-swap-replicate-1692601b
  cancel-in-progress: false
jobs:
  replication:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Full unit suite
        run: |
          python -m pip install -e '.[test]'
          python -m pytest
      - name: Pin official TavernGym and validate layout
        run: |
          bash scripts/bootstrap_engine.sh
          python -m tavern_ai.contract
      - name: Run 40 complete games with fixed parameters and seat rotation
        run: |
          python -m tavern_ai.replicate_1692601b --out-dir experiments/s-20261102-1692601b --metrics research/sessions/s-20261102-1692601b/metrics-002.json
          for f in experiments/s-20261102-1692601b/002-*.json; do python -m tavern_ai.validate_receipt "$f"; done
      - name: Commit only new R002 reproducible receipts
        run: |
          test "$GITHUB_REF_NAME" = "agent/s-20261102-1692601b/optimization-002"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/s-20261102-1692601b/002-*.json research/sessions/s-20261102-1692601b/metrics-002.json
          if ! git diff --cached --quiet; then
            git commit -m "evidence(1692601b R002): 40 new seat-rotated matches [skip ci]"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sell-swap-r002-1692601b-evidence
          path: |
            experiments/s-20261102-1692601b/002-*.json
            research/sessions/s-20261102-1692601b/metrics-002.json
          if-no-files-found: ignore
          retention-days: 30
