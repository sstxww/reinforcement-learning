name: V5 rejected PPO checkpoint Release custody s-20261103-bf44b161

on:
  push:
    branches:
      - agent/s-20261103-bf44b161/optimization-002
    paths:
      - research/sessions/s-20261103-bf44b161/run-trigger-rejected-002.txt

permissions:
  contents: write
  actions: read

concurrency:
  group: v5-rejected-release-s-20261103-bf44b161
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore SHA-recorded own 90-day Artifact
        shell: bash
        run: |
          set -euo pipefail
          gh run download 41509203645 --repo "$GITHUB_REPOSITORY" \
            --name 'v5-s-20261103-bf44b161-r002-unpromoted-41509203645' --dir recovered
          find recovered -maxdepth 4 -type f -printf '%P\n'
          test -s recovered/checkpoints/candidate.zip
          test -s recovered/checkpoints/candidate.metadata.json
          test -s recovered/checkpoints/candidate.sha256
          (cd recovered && sha256sum --check checkpoints/candidate.sha256)
          python -m tavern_ai.checkpoint_preflight \
            --model recovered/checkpoints/candidate.zip \
            --metadata recovered/checkpoints/candidate.metadata.json \
            --expected-sha256 ce1e1f35841eb4239f854ebc2706505af126d7a820cf589cadb93a79502a735b
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('recovered/checkpoints/candidate.metadata.json').read_text())
          assert m['checkpoint_sha256']=='ce1e1f35841eb4239f854ebc2706505af126d7a820cf589cadb93a79502a735b'
          assert m['parent_checkpoint_sha256']=='a73d24c68d238396136c9857ec4f341f39afc6562139ce9b693d282019db2632'
          assert m['total_timesteps']==1536
          assert m['algorithm']=='MaskablePPO'
          print('Confirmed rejected candidate 1408 to 1536 PPO lineage')
          PY
      - name: Publish permanent REJECTED research checkpoint, never Champion
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p publish verified
          cp recovered/checkpoints/candidate.zip publish/model.zip
          cp recovered/checkpoints/candidate.metadata.json publish/model.metadata.json
          sha256sum publish/model.zip publish/model.metadata.json > publish/checksums.sha256
          printf '%s\n' '{"status":"REJECTED","candidate_sha256":"ce1e1f35841eb4239f854ebc2706505af126d7a820cf589cadb93a79502a735b","parent_sha256":"a73d24c68d238396136c9857ec4f341f39afc6562139ce9b693d282019db2632","training_steps":1536,"raw_game_seed":98633,"raw_game_completed":false,"failure":"Full-game safety limit exceeded","champion_eligible":false,"evaluation_completed":false,"source_run":41509203645}' > publish/rejection.json
          gh release create 'v5-rejected-s-20261103-bf44b161-1536-41509203645' \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title 'REJECTED 1536-step V5 checkpoint; raw game safety cap' \
            --notes 'Research-only rejected candidate. Genuine 128-step continuation from registered 1408-step PPO Release, but raw model failed full eight-seat game seed 98633 with Full-game safety limit exceeded. Not Best, Champion or Arena-evaluated. Stored only for recovery and diagnosis.' \
            publish/model.zip publish/model.metadata.json publish/checksums.sha256 publish/rejection.json
          gh release download 'v5-rejected-s-20261103-bf44b161-1536-41509203645' --repo "$GITHUB_REPOSITORY" \
            --pattern model.zip --pattern model.metadata.json --dir verified
          cmp publish/model.zip verified/model.zip
          cmp publish/model.metadata.json verified/model.metadata.json
          echo 'Release assets round-tripped with byte-for-byte match'
      - name: Preserve publication evidence (not promotion)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rejected-s-20261103-bf44b161-release-audit-${{ github.run_id }}
          path: |
            publish/checksums.sha256
            publish/rejection.json
          if-no-files-found: ignore
          retention-days: 90
