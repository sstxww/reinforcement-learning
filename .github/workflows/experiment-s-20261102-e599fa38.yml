name: Isolated PPO turn-loop guard s-20261102-e599fa38
on:
  push:
    branches:
      - agent/s-20261102-e599fa38/optimization-001
permissions:
  contents: read
concurrency:
  group: experiment-s-20261102-e599fa38
  cancel-in-progress: false
jobs:
  guarded-model:
    if: ${{ !contains(github.event.head_commit.message, '[docs-only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test and training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[train,test]'
      - name: Run tests and verify real engine
        run: |
          python -m pytest
          bash scripts/bootstrap_engine.sh
          python -m tavern_ai.contract
      - name: Train fresh candidate exactly 128 steps
        run: |
          mkdir -p checkpoints/s-20261102-e599fa38
          python -m tavern_ai.train --steps 128 --seed 71879 \
            --out checkpoints/s-20261102-e599fa38/model.zip
          sha256sum checkpoints/s-20261102-e599fa38/model.zip
      - name: Probe unguarded candidate with 300s wall limit
        shell: bash
        run: |
          set +e
          timeout 300s python -m tavern_ai.canary \
            --agent-id s-20261102-e599fa38 --seed 31071 --policy model \
            --model checkpoints/s-20261102-e599fa38/model.zip \
            --receipt outputs/raw-31071.json > raw-canary.log 2>&1
          code=$?
          set -e
          echo "raw_candidate_exit_code=$code" | tee raw-result.txt
          tail -c 3000 raw-canary.log
      - name: Guarded PPO candidate completes two full eight-seat games
        run: |
          for seed in 31071 31072; do
            python -m tavern_ai.guarded_model_probe \
              --agent-id s-20261102-e599fa38 --seed "$seed" \
              --model checkpoints/s-20261102-e599fa38/model.zip \
              --max-turn-actions 32 \
              --receipt "experiments/s-20261102-e599fa38/001-$seed.json"
            python -m tavern_ai.validate_receipt "experiments/s-20261102-e599fa38/001-$seed.json"
          done
      - name: Paired baseline, same held-out seeds
        run: |
          python -m tavern_ai.evaluate --policy baseline --games 2 \
            --start-seed 31071 --out outputs/baseline-31071.json
      - name: Upload short-lived checkpoint and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s-20261102-e599fa38-guard-evidence
          path: |
            checkpoints/s-20261102-e599fa38/model.zip
            checkpoints/s-20261102-e599fa38/model.metadata.json
            experiments/s-20261102-e599fa38/*.json
            outputs/*.json
            raw-canary.log
            raw-result.txt
          if-no-files-found: warn
          retention-days: 30
