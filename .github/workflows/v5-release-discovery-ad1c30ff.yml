name: V5 Release registry drift and authentic canary s-20261103-ad1c30ff

on:
  push:
    branches:
      - agent/s-20261103-ad1c30ff/optimization-001
    paths:
      - scripts/v5_release_discovery_ad1c30ff.py
      - tests/test_v5_release_discovery_ad1c30ff.py
      - .github/workflows/v5-release-discovery-ad1c30ff.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v5-release-discovery-ad1c30ff
  cancel-in-progress: false

jobs:
  read-only-audit-and-eight-seat:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test and training dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -e '.[train,test]'
      - name: Run Release catalog and regression tests
        run: |
          python -m pytest -q tests/test_v5_release_discovery_ad1c30ff.py
          python scripts/v5_release_discovery_ad1c30ff.py --out reports/s-20261103-ad1c30ff/remote-release-audit.json
      - name: Install and verify exact TavernGym dependency
        run: bash scripts/bootstrap_engine.sh
      - name: Complete OWN real eight-seat TavernGym baseline game
        run: |
          python -m tavern_ai.canary --agent-id s-20261103-ad1c30ff --seed 99431 --policy baseline --receipt experiments/s-20261103-ad1c30ff/001-99431.json
          python -m tavern_ai.validate_receipt experiments/s-20261103-ad1c30ff/001-99431.json
          cat experiments/s-20261103-ad1c30ff/001-99431.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-v5-release-discovery-ad1c30ff
          retention-days: 30
          if-no-files-found: ignore
          path: |
            reports/s-20261103-ad1c30ff/remote-release-audit.json
            experiments/s-20261103-ad1c30ff/001-99431.json
