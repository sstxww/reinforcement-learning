name: V5 strict receipt evidence and real-game gate s-86664ac4

on:
  push:
    branches:
      - 'agent/s-20261102-86664ac4/optimization-001'
    paths:
      - 'scripts/check_pr_evidence.py'
      - 'tests/test_pr_evidence_strict_s_86664ac4.py'
      - '.github/workflows/receipt-strict-s-20261102-86664ac4.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v5-receipt-gate-s-20261102-86664ac4
  cancel-in-progress: false

jobs:
  validate-and-capture:
    if: github.ref == 'refs/heads/agent/s-20261102-86664ac4/optimization-001'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project and test dependencies
        run: python -m pip install -e '.[test]'
      - name: Test receipt gate against synthetic negative fixtures
        run: python -m pytest -q tests/test_pr_evidence_strict_s_86664ac4.py tests/test_receipt_integrity.py
      - name: Install and verify pinned TavernGym engine
        run: bash scripts/bootstrap_engine.sh
      - name: Run authentic complete eight-seat TavernGym match
        run: |
          python -m tavern_ai.canary --seed 96641 --agent-id s-20261102-86664ac4 --policy baseline --receipt experiments/s-20261102-86664ac4/001-96641.json
          python -m tavern_ai.validate_receipt experiments/s-20261102-86664ac4/001-96641.json
          python -c "import json; from tavern_ai.receipt_integrity import validate_integrity; validate_integrity(json.load(open('experiments/s-20261102-86664ac4/001-96641.json')))"
      - name: Commit only this session's authentic receipt, never shared files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/s-20261102-86664ac4/001-96641.json
          if ! git diff --cached --quiet; then
            git commit -m "test(s-86664ac4): record one strict-validated authentic eight-seat match"
            git push origin HEAD:refs/heads/agent/s-20261102-86664ac4/optimization-001
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v5-strict-receipt-s-86664ac4
          path: experiments/s-20261102-86664ac4/*.json
          if-no-files-found: ignore
          retention-days: 30
