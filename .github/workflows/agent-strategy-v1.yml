name: Agent strategy - real V1 experiment
on:
  push:
    branches: ['agent/strategy/v1']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v1-strategy-experiment
  cancel-in-progress: false
jobs:
  full-game-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Unit tests
        run: python -m pytest
      - name: Install pinned TavernGym and validate observe2
        run: |
          bash scripts/bootstrap_engine.sh
          python -m tavern_ai.contract
      - name: Execute real experiment to Game.is_over
        shell: bash
        run: |
          mkdir -p experiments/strategy reports/strategy
          cp tavern_ai/baseline.py /tmp/baseline-v1.py
          git show origin/main:tavern_ai/baseline.py > tavern_ai/baseline.py
          PYTHONDONTWRITEBYTECODE=1 python -m tavern_ai.canary --agent-id strategy --seed 1301 --policy baseline --receipt experiments/strategy/v0-reference.json
          cp /tmp/baseline-v1.py tavern_ai/baseline.py
          PYTHONDONTWRITEBYTECODE=1 python -m tavern_ai.canary --agent-id strategy --seed 1301 --policy baseline --receipt experiments/strategy/v1-candidate.json
          python -m tavern_ai.validate_receipt experiments/strategy/v0-reference.json
          python -m tavern_ai.validate_receipt experiments/strategy/v1-candidate.json
          python - <<'PY'
          import json,pathlib
          base=json.loads(pathlib.Path("experiments/strategy/v0-reference.json").read_text())
          cand=json.loads(pathlib.Path("experiments/strategy/v1-candidate.json").read_text())
          for p,version in [(pathlib.Path("experiments/strategy/v0-reference.json"),"v0"),(pathlib.Path("experiments/strategy/v1-candidate.json"),"v1")]:
              data=json.loads(p.read_text());data["strategy_version"]=version;p.write_text(json.dumps(data,indent=2)+"\n")
          report={"hypothesis":"prioritize buying before optional ability loop; use 36 action cap","seed":1301,"v0_placement":base["placements"][0],"v1_placement":cand["placements"][0],"v0_decisions":base["decisions"],"v1_decisions":cand["decisions"],"claimed_improvement":False,"caution":"one paired seed is insufficient to prove improvement"}
          pathlib.Path("reports/strategy/v1.json").write_text(json.dumps(report,indent=2)+"\n")
          print(report)
          PY
      - name: Commit only actual match receipts and compact metrics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/strategy/ reports/strategy/
          git diff --cached --quiet && exit 0
          git commit -m "results(strategy): record real V1 full-match evidence"
          test "$GITHUB_REF_NAME" = "agent/strategy/v1"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-strategy-v1-evidence
          path: |
            experiments/strategy/*.json
            reports/strategy/*.json
          if-no-files-found: ignore
          retention-days: 30
