name: V7 exact-main CI gate and real canary f6c9fea8

on:
  push:
    branches:
      - agent/s-20261103-f6c9fea8/optimization-001
    paths:
      - .github/workflows/v7-main-ci-gate-f6c9fea8.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v7-main-ci-gate-f6c9fea8
  cancel-in-progress: false

jobs:
  isolated-real-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned project and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Offline fail-closed main CI verifier tests
        run: python -m pytest -q tests/test_v7_main_ci_gate_f6c9fea8.py
      - name: Install and verify actual TavernGym engine
        run: bash scripts/bootstrap_engine.sh
      - name: Verify pinned observation action contract
        run: python -m tavern_ai.contract
      - name: Play a genuine independent eight-seat baseline game
        run: |
          mkdir -p outputs
          python -m tavern_ai.canary --agent-id s-20261103-f6c9fea8 --policy baseline --seed 99713 --receipt outputs/001-99713.json
          python -m tavern_ai.validate_receipt outputs/001-99713.json
          echo 'V7_ORIGINAL_GAME_RECEIPT_START'
          cat outputs/001-99713.json
          echo 'V7_ORIGINAL_GAME_RECEIPT_END'
      - name: Retain original real-match receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v7-real-baseline-s-20261103-f6c9fea8
          path: outputs/*.json
          if-no-files-found: ignore
          retention-days: 30
