name: V5 integration evidence s-20261103-db1986b8

on:
  push:
    branches:
      - agent/s-20261103-db1986b8/optimization-001
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s-20261103-db1986b8-integration-evidence
  cancel-in-progress: false

jobs:
  offline-and-real-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install unit test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Run repository regression suite
        run: python -m pytest
      - name: Install exact pinned TavernGym engine
        run: bash scripts/bootstrap_engine.sh
      - name: Confirm pinned contract
        run: python -m tavern_ai.contract
      - name: Own genuine eight-seat baseline game (infrastructure evidence only)
        run: |
          python -m tavern_ai.canary --agent-id s-20261103-db1986b8 \
            --seed 931281 --policy baseline --receipt outputs/001-931281.json
          python -m tavern_ai.validate_receipt outputs/001-931281.json
      - name: Upload immutable original game receipt for source review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s-20261103-db1986b8-own-baseline-game
          path: outputs/001-931281.json
          if-no-files-found: warn
          retention-days: 90
