name: V7 isolated postmerge schema2 real PPO and eight-seat diagnostic s-20261103-7c7c11cb
on:
  push:
    branches:
      - agent/s-20261103-7c7c11cb/optimization-001
    paths:
      - .github/workflows/v7-postmerge-schema2-s-20261103-7c7c11cb.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v7-s-20261103-7c7c11cb-r001-schema2-smoke
  cancel-in-progress: false
jobs:
  real-postmerge-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bounded smoke dependencies
        run: |
          python -m pip install -e '.[train,test]'
      - name: Verify postmerge trainer metadata regression
        run: |
          python -m pytest -q tests/test_train_schema2_resume_db1986b8.py
      - name: Install pinned TavernGym engine
        run: |
          bash scripts/bootstrap_engine.sh
          python -m tavern_ai.contract
      - name: Restore registered immutable schema2 Release and verify digest
        run: |
          set -euo pipefail
          python -m tavern_ai.release_restore_entry \
            --model-id v2-learning-41413557445 --out-dir checkpoints/source \
            > outputs-restore.tmp
          mkdir -p outputs
          mv outputs-restore.tmp outputs/restore.json
      - name: Real 128-step MaskablePPO optimizer continuation and checkpoint save
        run: |
          set -euo pipefail
          python -m tavern_ai.train --steps 128 --seed 43281 \
            --resume checkpoints/source/model.zip --out checkpoints/child.zip \
            | tee outputs/train.json
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          from tavern_ai.checkpoint_preflight import audit_archive
          parent = json.loads(Path("checkpoints/source/model.metadata.json").read_text())
          child = json.loads(Path("checkpoints/child.metadata.json").read_text())
          digest = hashlib.sha256(Path("checkpoints/child.zip").read_bytes()).hexdigest()
          assert parent["schema"] == child["schema"] == 2
          assert parent["total_timesteps"] == 1280
          assert child["total_timesteps"] == 1408
          assert child["increment_timesteps"] == 128
          assert child["compatibility"] == parent["compatibility"]
          assert child["parent_checkpoint_sha256"] == hashlib.sha256(Path("checkpoints/source/model.zip").read_bytes()).hexdigest()
          assert child["checkpoint_sha256"] == digest
          audit_archive(Path("checkpoints/child.zip"),Path("checkpoints/child.metadata.json"),digest)
          Path("outputs/optimizer-resume-verified.json").write_text(json.dumps({"schema":2,"source_steps":1280,"added_steps":128,"child_steps":1408,"model_sha256":digest,"optimizer_archive_preflight":True,"promoted":False},indent=2))
          PY
      - name: Independent genuine eight-seat baseline infrastructure game
        run: |
          python -m tavern_ai.canary --agent-id s-20261103-7c7c11cb --seed 43282 \
            --policy baseline --receipt outputs/001-baseline-43282.json
          python -m tavern_ai.validate_receipt outputs/001-baseline-43282.json
      - name: Raw child PPO full-game attempt, no rescue or fabricated placement
        shell: bash
        run: |
          set -uo pipefail
          timeout 600 python -m tavern_ai.canary --agent-id s-20261103-7c7c11cb \
            --seed 43283 --policy model --model checkpoints/child.zip \
            --receipt outputs/001-raw-model-43283.json > outputs/raw-model.log 2>&1
          result=$?
          export RESULT="$result"
          python - <<'PY'
          import json, os
          from pathlib import Path
          done = Path("outputs/001-raw-model-43283.json").is_file()
          Path("outputs/raw-model-status.json").write_text(json.dumps({"attempted":True,"exit_code":int(os.environ["RESULT"]),"completed_receipt_exists":done,"is_raw_model":True,"fallback_used":False,"rank_if_incomplete":None}, indent=2))
          PY
          if test -f outputs/001-raw-model-43283.json; then
            python -m tavern_ai.validate_receipt outputs/001-raw-model-43283.json
          else
            echo "Raw game incomplete; preserving failure evidence, no placement awarded"
          fi
          exit 0
      - name: Preserve owned verification and checkpoint as temporary Artifact only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v7-s-20261103-7c7c11cb-r001-${{ github.run_id }}
          path: |
            outputs/*.json
            outputs/*.log
            checkpoints/child.zip
            checkpoints/child.metadata.json
          retention-days: 30
          if-no-files-found: ignore
