name: LR sensitivity s-20261102-24728f13 (real TavernGym)

on:
  push:
    branches:
      - 'agent/s-20261102-24728f13/optimization-001'
    paths:
      - 'tavern_ai/lr_probe_24728f13.py'
      - 'tests/test_lr_probe_24728f13.py'
      - '.github/workflows/experiment-s-20261102-24728f13.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: isolated-lr-s-20261102-24728f13
  cancel-in-progress: false

jobs:
  bounded-study:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated test and training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[train,test]'
      - name: Isolated unit regressions
        run: python -m pytest tests/test_lr_probe_24728f13.py
      - name: Install real pinned TavernGym and verify observe2
        run: |
          bash scripts/bootstrap_engine.sh
          python -m tavern_ai.contract
      - name: Train 2 x 256 PPO steps and complete six true eight-seat matches
        run: python -m tavern_ai.lr_probe_24728f13
      - name: Confirm own actual completed canary receipt
        run: |
          python -m tavern_ai.validate_receipt experiments/s-20261102-24728f13/001-42171.json
          python -m pytest tests/test_lr_probe_24728f13.py
      - name: Commit only this session's actual receipts and compact analysis
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'agent/s-20261102-24728f13/optimization-001'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/s-20261102-24728f13/ reports/s-20261102-24728f13/
          if ! git diff --cached --quiet; then
            git commit -m 'results(s-20261102-24728f13): record genuine PPO LR match receipts'
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
      - name: Save isolated candidate/reference checkpoint Artifacts (temporary)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lr-study-s-20261102-24728f13-${{ github.run_id }}
          path: |
            outputs/s-20261102-24728f13/
            experiments/s-20261102-24728f13/
            reports/s-20261102-24728f13/
          if-no-files-found: ignore
          retention-days: 30
