name: V7 c5853eb8 serial gate tests and genuine eight-seat proof

on:
  push:
    branches:
      - 'agent/s-20261103-c5853eb8/optimization-001'
    paths:
      - '.github/workflows/v7-game-c5853eb8.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v7-c5853eb8-genuine-proof
  cancel-in-progress: false

jobs:
  actual-game:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install unit-test dependencies
        run: python -m pip install -e '.[test]'
      - name: Test independent exact-head integration gate
        run: python -m pytest -q tests/test_v7_serial_merge_gate_c5853eb8.py
      - name: Install pinned upstream TavernGym
        run: bash scripts/bootstrap_engine.sh
      - name: Verify pinned real game engine contract
        run: python -m tavern_ai.contract
      - name: Complete an actual baseline eight-seat game
        run: |
          python -m tavern_ai.canary --agent-id s-20261103-c5853eb8 \
            --policy baseline --seed 93493 \
            --receipt experiments/s-20261103-c5853eb8/001-93493.json
          python -m tavern_ai.validate_receipt experiments/s-20261103-c5853eb8/001-93493.json
      - name: Save original actual match receipt (temporary, not model storage)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v7-c5853eb8-original-baseline-game
          path: experiments/s-20261103-c5853eb8/001-93493.json
          if-no-files-found: ignore
          retention-days: 30
