name: Persistent pool TavernGym s-20261102-8cfa0c44 R002
on:
  push:
    branches:
      - 'agent/s-20261102-8cfa0c44/optimization-002'
    paths:
      - 'tavern_ai/persistent_pool_eval.py'
      - 'tests/test_persistent_pool_eval.py'
      - '.github/workflows/experiment-s-20261102-8cfa0c44-r002.yml'

permissions:
  contents: write

concurrency:
  group: persistent-pool-s-20261102-8cfa0c44-r002
  cancel-in-progress: false

jobs:
  real-game-batches:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Regression tests
        run: |
          python -m pytest tests/test_parallel_eval.py tests/test_persistent_pool_eval.py tests/test_evaluation_v1.py tests/test_receipt.py
      - name: Bootstrap real pinned TavernGym
        run: |
          bash scripts/bootstrap_engine.sh
          python -m tavern_ai.contract
      - name: Run 385 genuine full matches with replay checks
        run: |
          python -m tavern_ai.persistent_pool_eval \
            --agent-id s-20261102-8cfa0c44 \
            --own-seed 28800 --start-seeds 28801 28901 \
            --receipt-dir experiments/s-20261102-8cfa0c44 \
            --report reports/s-20261102-8cfa0c44/persistent-002.json
          python -m tavern_ai.validate_receipt \
            experiments/s-20261102-8cfa0c44/002-28800.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('reports/s-20261102-8cfa0c44/persistent-002.json')
          d=json.loads(p.read_text())
          assert d['engine']['source_hash']=='6d8712c93022ba11'
          assert d['total_real_matches']==385
          assert len(d['trials'])==2
          assert all(x['matching_game_fields'] for x in d['trials'])
          assert d['replay_equivalence'] is True
          print('385 full real games; two 64-seed reversed-order triple-arm trials')
          PY
      - name: Commit only R002 compact evidence to own branch
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = 'agent/s-20261102-8cfa0c44/optimization-002'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/s-20261102-8cfa0c44/002-*.json
          git add reports/s-20261102-8cfa0c44/persistent-002.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'results(s-20261102-8cfa0c44 R002): true engine pool receipts [skip ci]'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
      - name: Upload ephemeral evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: persistent-pool-s-20261102-8cfa0c44-r002
          path: |
            experiments/s-20261102-8cfa0c44/002-*.json
            reports/s-20261102-8cfa0c44/persistent-002.json
          if-no-files-found: ignore
          retention-days: 30
