name: V5 P0 historical Release verifier integration s-20261102-d5349678

on:
  push:
    branches:
      - agent/s-20261102-d5349678/optimization-001
    paths:
      - .github/workflows/integration-s-20261102-d5349678.yml

permissions:
  contents: write

concurrency:
  group: v5-p0-s-20261102-d5349678
  cancel-in-progress: false

jobs:
  verify-and-genuine-match:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Python test dependencies
        run: python -m pip install -e '.[test]'
      - name: Verify canonical registry and historical Release digest subset
        run: |
          python -m tavern_ai.checkpoint_catalog
          python -m pytest -q tests/test_checkpoint_catalog_91b6e4a7.py tests/test_registry_integrity.py tests/test_release_asset_verifier.py
      - name: Install exact TavernGym engine
        run: bash scripts/bootstrap_engine.sh
      - name: Execute and validate one original complete eight-seat game
        run: |
          python -m tavern_ai.contract
          python -m tavern_ai.canary --agent-id s-20261102-d5349678 --seed 94673 --policy baseline --receipt experiments/s-20261102-d5349678/001-94673.json
          python -m tavern_ai.validate_receipt experiments/s-20261102-d5349678/001-94673.json
      - name: Commit only original validated receipt to own isolated branch
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = "agent/s-20261102-d5349678/optimization-001"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/s-20261102-d5349678/001-94673.json
          if git diff --cached --quiet; then
            echo "Receipt already committed; no new commit"
          else
            git commit -m "test(v5): preserve genuine s-20261102-d5349678 eight-seat match"
            git push origin HEAD:refs/heads/agent/s-20261102-d5349678/optimization-001
          fi
      - name: Retain receipt artifact for independent review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-p0-eight-seat-s-20261102-d5349678
          path: experiments/s-20261102-d5349678/*.json
          if-no-files-found: ignore
          retention-days: 30
