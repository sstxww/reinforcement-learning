name: V5 paired evidence gate s-20261102-15ac04d0
on:
  push:
    branches:
      - agent/s-20261102-15ac04d0/optimization-001
    paths:
      - tavern_ai/paired_receipt_gate_v5.py
      - tests/test_paired_receipt_gate_v5_15ac04d0.py
      - .github/workflows/v5-paired-evidence-s-20261102-15ac04d0.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v5-paired-evidence-s-20261102-15ac04d0
  cancel-in-progress: false
jobs:
  tests-and-real-eight-seat-game:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Contract tests
        run: |
          python -m pytest tests/test_paired_receipt_gate_v5_15ac04d0.py -v
          python -m pytest
      - name: Install verified TavernGym
        run: bash scripts/bootstrap_engine.sh
      - name: Check pinned environment
        run: python -m tavern_ai.contract
      - name: Own genuine complete eight-player game (baseline engineering evidence only)
        run: |
          python -m tavern_ai.canary --agent-id s-20261102-15ac04d0 \
            --policy baseline --seed 93431 \
            --receipt outputs/s-20261102-15ac04d0-001-93431.json
          python -m tavern_ai.validate_receipt outputs/s-20261102-15ac04d0-001-93431.json
          python -m tavern_ai.paired_receipt_gate_v5 --help
          cat outputs/s-20261102-15ac04d0-001-93431.json
      - name: Preserve authentic receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-paired-gate-s-20261102-15ac04d0
          path: outputs/s-20261102-15ac04d0-001-93431.json
          retention-days: 30
          if-no-files-found: warn
