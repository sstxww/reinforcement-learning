name: V5 action taxonomy d6f69c12
on:
  push:
    branches:
      - 'agent/s-20261103-d6f69c12/optimization-001'
    paths:
      - '.github/workflows/v5-action-taxonomy-d6f69c12.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v5-action-taxonomy-d6f69c12
  cancel-in-progress: false

jobs:
  isolated-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -e '.[test]'
      - name: Test the corrected pinned action taxonomy
        run: python -m pytest -q tests/test_behavior_audit_v5_880b8a71.py tests/test_action_taxonomy_s_20261103_d6f69c12.py tests/test_mechanics_audit_f3af3b4d.py
      - name: Install pinned real TavernGym engine
        run: bash scripts/bootstrap_engine.sh
      - name: Verify pinned runtime action names, not only synthetic labels
        run: |
          python - <<'PY'
          import taverngym
          from tavern_ai.mechanics_audit_f3af3b4d import check_action_names
          from tavern_ai.contract import verify_engine
          verify_engine()
          print(check_action_names(taverngym))
          PY
      - name: Complete a real baseline eight-seat TavernGym match
        run: |
          python -m tavern_ai.canary --agent-id s-20261103-d6f69c12 --policy baseline --seed 93471 --receipt experiments/s-20261103-d6f69c12/001-93471.json
          python -m tavern_ai.validate_receipt experiments/s-20261103-d6f69c12/001-93471.json
      - name: Preserve original genuine receipt as diagnostic Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: action-taxonomy-d6f69c12-genuine-game
          path: experiments/s-20261103-d6f69c12/001-93471.json
          if-no-files-found: ignore
          retention-days: 30
