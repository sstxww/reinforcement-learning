[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autotavern-ai-lab"
version = "0.1.0"
description = "Independent multi-agent TavernGym reinforcement-learning laboratory"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["numpy>=1.26,<3","gymnasium>=1.0,<2"]

[project.optional-dependencies]
train = ["torch>=2.3","sb3-contrib>=2.3,<3"]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["tavern_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
